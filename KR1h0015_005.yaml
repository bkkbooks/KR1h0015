body:
  text: 欽定四庫全書論語卷五宋朱子集注子罕第九凡三十章子罕言利與命與仁罕少也程子曰計利則害義命之理微仁之道大皆夫子所罕言也達巷黨人曰大哉孔子博學而無所成名達巷黨名其人姓名不傳博學無所成名蓋美其學之博而惜其不成一藝之名也子聞之謂門弟子曰吾何執執御乎執射乎吾執御矣執專執也射御皆一藝而御為人僕所執尤卑言欲使我何所執以成名乎然則吾將執御矣聞人譽己承之以謙也尹氏曰聖人道全而德備不可以偏長目之也達巷黨人見孔子之大意其所學者博而惜其不以一善得名於世蓋慕聖人而不知者也故孔子曰欲使我何所執而得為名乎然則吾將執御矣子曰麻冕禮也今也純儉吾從衆麻冕緇布冠也純絲也儉謂省約緇布冠以三十升布為之升八十縷則其經二千四百縷矣細密難成不如用絲之省約拜下禮也今拜乎上泰也雖違衆吾從下臣與君行禮當拜於堂下君辭之乃升成拜泰驕慢也程子曰君子處世事之無害於義者從俗可也害於義則不可從矣子絶四毋意毋必毋固毋我絶無之盡者毋史記作無是也意私意也必期必也固執滯也我私己也四者相為終始起於意遂於必留於固而成於我也蓋意必常在事前固我常在事後至於我又生意則物欲牽引循環不窮矣程子曰此毋字非禁止之辭聖人絶此四者何用禁止張子曰四者有一焉則與天地不相似楊氏曰非知足以知聖人詳視而默識之不足以記此子畏於匡畏者有戒心之謂匡地名史記云陽虎曾暴於匡夫子貌似陽虎故匡人圍之曰文王既沒文不在兹乎道之顯者謂之文蓋禮樂制度之謂不曰道而曰文亦謙辭也兹此也孔子自謂天之將喪斯文也後死者不得與於斯文也天之未喪斯文也匡人其如子何喪與並去聲馬氏曰文王既沒故孔子自謂後死者言天若欲喪此文則必不使我得與於此文今我既得與於此文則是天未欲喪此文也天既未欲喪此文則匡人其奈我何言必不能違天害己也大宰問於子貢曰夫子聖者與何其多能也大音泰與平聲孔氏曰大宰官名或吳或宋未可知也與者疑辭大宰蓋以多能為聖也子貢曰固天縱之將聖又多能也縱猶肆也言不為限量也將殆也謙若不敢知之辭聖無不通多能乃其餘事故言又以兼之子聞之曰大宰知我乎吾少也賤故多能鄙事君子多乎哉不多也言由少賤故多能而所能者鄙事爾非以聖而無不通也且多能非所以率人故又言君子不必多能以曉之牢曰子云吾不試故藝牢孔子弟子姓琴字子開一字子張試用也言由不為世用故得以習於藝而通之吳氏曰弟子記夫子此言之時子牢因言昔之所聞有如此者其意相近故併記之子曰吾有知乎哉無知也有鄙夫問於我空空如也我叩其兩端而竭焉叩音口孔子謙言己無知識但其告人雖於至愚不敢不盡耳叩發動也兩端猶言兩頭言終始本末上下精粗無所不盡程子曰聖人之教人俯就之若此猶恐衆人以為髙逺而不親也聖人之道必降而自卑不如此則人不親賢人之言則引而自髙不如此則道不尊觀於孔子孟子則可見矣尹氏曰聖人之言上下兼盡即其近衆人皆可與知極其至則雖聖人亦無以加焉是之謂兩端如答樊遲之問仁知兩端竭盡無餘藴矣若夫語上而遺下語理而遺物則豈聖人之言哉子曰鳳鳥不至河不出圖吾已矣夫夫音扶鳯靈鳥舜時來儀文王時鳴於岐山河圖河中龍馬負圖伏羲時出皆聖王之瑞也已止也張氏曰鳯至圖出文明之祥伏羲舜文之瑞不至則夫子之文章知其已矣子見齊衰者冕衣裳者與瞽者見之雖少必作過之必趨齊音咨衰七雷反少去聲齊衰喪服冕冠也衣上服裳下服冕而衣裳貴者之盛服也瞽無目者作起也趨疾行也或曰少當作坐范氏曰聖人之心哀有喪尊有爵矜不成人其作與趨蓋有不期然而然者尹氏曰此聖人之誠心內外一者也顔淵喟然歎曰仰之彌髙鑽之彌堅瞻之在前忽焉在後喟苦位反鑽祖官反喟歎聲仰彌髙不可及鑽彌堅不可入在前在後恍惚不可為象此顔淵深知夫子之道無窮盡無方體而歎之也夫子循循然善誘人博我以文約我以禮循循有次序貌誘引進也博文約禮教之序也言夫子道雖高妙而教人有序也侯氏曰博我以文致知格物也約我以禮克己復禮也程子曰此顔子稱聖人最切當處聖人教人惟此二事而已欲罷不能既竭吾才如有所立卓爾雖欲從之末由也已卓立貌末無也此顔子自言其學之所至也蓋悅之深而力之盡所見益親而又無所用其力也吳氏曰所謂卓爾亦在乎日用行事之間非所謂窈冥昏默者程子曰到此地位功夫尤難直是峻絶又大段著力不得楊氏曰自可欲之謂善充而至於大力行之積也大而化之則非力行所及矣此顔子所以未達一閒也程子曰此顔子所以為深知孔子而善學之者也胡氏曰無上事而喟然歎此顔子學既有得故述其先難之故後得之由而歸功於聖人也髙堅前後語道體也仰鑽瞻忽未領其要也惟夫子循循善誘先博我以文使我知古今達事變然後約我以禮使我尊所聞行所知如行者之赴家食者之求飽是以欲罷而不能盡心盡力不少休廢然後見夫子所立之卓然雖欲從之末由也已是蓋不怠所從必求至乎卓立之地也抑斯歎也其在請事斯語之後三月不違之時乎子疾病子路使門人為臣夫子時已去位無家臣子路欲以家臣治其喪其意實尊聖人而未知所以尊也病閒曰久矣哉由之行詐也無臣而為有臣吾誰欺欺天乎閒如字病閒少差也病時不知既差乃知其事故言我之不當有家臣人皆知之不可欺也而為有臣則是欺天而已人而欺天莫大之罪引以自歸其責子路深矣且豫與其死於臣之手也無寧死於二三子之手乎且豫縱不得大葬子死於道路乎無寧寧也大葬謂君臣禮葬死於道路謂槀而不葬又曉之以不必然之故范氏曰曽子將死起而易簀曰吾得正而斃焉斯已矣子路欲尊夫子而不知無臣之不可為有臣是以陷於行詐罪至欺天君子之於言動雖微不可不謹夫子深懲子路所以警學者也楊氏曰非知至而意誠則用智自私不知行其所無事往往自陷於行詐欺天而莫之知也其子路之謂乎子貢曰有美玉於斯韞櫝而藏諸求善賈而沽諸子曰沽之哉沽之哉我待賈者也韞紆粉反櫝徒木反賈音嫁韞藏也櫝櫝也沽賣也子貢以孔子有道不仕故設此二端以問也孔子言固當賣之但當待賈而不當求之耳范氏曰君子未嘗不欲仕也又惡不由其道士之待禮猶玉之待賈也若伊尹之耕於野伯夷太公之居於海濱世無成湯文王則終焉而已必不枉道以從人衒玉而求售也子欲居九夷東方之夷有九種欲居之者亦乘桴浮海之意或曰陋如之何子曰君子居之何陋之有君子所居則化何陋之有子曰吾自衛反魯然後樂正雅頌各得其所魯哀公十一年冬孔子自衛反魯是時周禮在魯然詩樂亦頗殘缺失次孔子周流四方參互考訂以知其說晚知道終不行故歸而正之子曰出則事公卿入則事父兄喪事不敢不勉不為酒困何有於我哉說見第七篇然此則其事愈卑而意愈切矣子在川上曰逝者如斯夫不舍晝夜夫音扶舍上聲天地之化往者過來者續無一息之停乃道體之本然也然其可指而易見者莫如川流故於此發以示人欲學者時時省察而無毫髮之閒斷也程子曰此道體也天運而不已日往則月來寒往則暑來水流而不息物生而不窮皆與道為體運乎晝夜未嘗已也是以君子法之自強不息及其至也純亦不已焉又曰自漢以來儒者皆不識此義此見聖人之心純亦不已也純亦不已乃天德也有天德便可與王道其要只在謹獨愚按自此至終篇皆勉人進學不已之辭子曰吾未見好德如好色者也好去聲謝氏曰好好色惡惡臭誠也好德如好色斯誠好德矣然民鮮能之史記孔子居衛靈公與夫人同車使孔子為次乘招搖市過之孔子醜之故有是言子曰譬如為山未成一簣止吾止也譬如平地雖覆一簣進吾往也簣求位反覆芳服反簣土籠也書曰為山九仞功虧一簣夫子之言蓋出於此言山成而但少一簣其止者吾自止耳平地而方覆一簣其進者吾自往耳蓋學者自強不息則積少成多中道而止則前功盡棄其止其往皆在我而不在人也子曰語之而不惰者其回也與語去聲與平聲惰懈怠也范氏曰顔子聞夫子之言而心解力行造次顚沛未嘗違之如萬物得時雨之潤發榮滋長何有於惰此羣弟子所不及也子謂顔淵曰惜乎吾見其進也未見其止也進止二字說見上章顏子既死而孔子惜之言其方進而未已也子曰苗而不秀者有矣夫秀而不實者有矣夫夫音扶穀之始生曰苗吐華曰秀成榖曰實蓋學而不至於成有如此者是以君子貴自勉也子曰後生可畏焉知來者之不如今也四十五十而無聞焉斯亦不足畏也已焉知之焉於虔反孔子言後生年富力彊足以積學而有待其勢可畏安知其將來不如我之今日乎然或不能自勉至於老而無聞則不足畏矣言此以警人使及時勉學也曾子曰五十而不以善聞則不聞矣蓋述此意尹氏曰少而不勉老而無聞則亦已矣自少而進者安知其不至於極乎是可畏也子曰法語之言能無從乎改之為貴巽與之言能無說乎繹之為貴說而不繹從而不改吾末如之何也已矣法語者正言之也巽言者婉而導之也繹尋其緒也法言人所敬憚故必從然不改則面從而已巽言無所乖忤故必說然不繹則又不足以知其微意之所在也楊氏曰法言若孟子論行王政之類是也巽言若其論好貨好色之類是也語之而不達拒之而不受猶之可也其或喻焉則尚庶幾其能改繹矣從且說矣而不改繹焉則是終不改繹也已雖聖人其如之何哉子曰主忠信毋友不如己者過則勿憚改重出而逸其半子曰三軍可奪帥也匹夫不可奪志也侯氏曰三軍之勇在人匹夫之志在已故帥可奪而志不可奪如可奪則亦不足謂之志矣子曰衣敝縕袍與衣狐貉者立而不恥者其由也與衣去聲縕紆粉反貉胡各反與平聲敝壞也縕枲著也袍衣有著者也蓋衣之賤者狐貉以狐貉之皮為裘衣之貴者子路之志如此則能不以貧富動其心而可以進於道矣故夫子稱之不忮不求何用不臧忮之豉反忮害也求貪也臧善也言能不忮不求則何為不善乎此衛風雄雉之詩孔子引之以美子路也呂氏曰貧與富交強者必忮弱者必求子路終身誦之子曰是道也何足以臧終身誦之則自喜其能而不復求進於道矣故夫子復言此以警之謝氏曰恥惡衣惡食學者之大病善心不存蓋由於此子路之志如此其過人逺矣然以衆人而能此則可以為善矣子路之賢宜不止此而終身誦之則非所以進於日新也故激而進之子曰歲寒然後知松柏之後雕也范氏曰小人之在治世或與君子無異惟臨利害遇事變然後君子之所守可見也謝氏曰士窮見節義世亂識忠臣欲學者必周於德子曰知者不惑仁者不憂勇者不懼明足以燭理故不惑理足以勝私故不憂氣足以配道義故不懼此學之序也子曰可與共學未可與適道可與適道未可與立可與立未可與權可與者言其可與共為此事也程子曰可與共學知所以求之也可與適道知所往也可與立者篤志固執而不變也權稱錘也所以稱物而知輕重者也可與權謂能權輕重使合義也楊氏曰知為己則可與共學矣學足以明善然後可與適道信道篤然後可與立知時措之宜然後可與權洪氏曰易九卦終於巽以行權權者聖人之大用未能立而言權猶人未能立而欲行鮮不仆矣程子曰漢儒以反經合道為權故有權變權術之語皆非也權只是經也自漢以下無人識權字愚按先儒誤以此章連下文偏其反而為一章故有反經合道之說程子非之是矣然以孟子嫂溺援之以手之義推之則權與經亦當有辨唐棣之華偏其反而豈不爾思室是遠而棣大計反唐棣郁李也偏晉書作翩然則反亦當與翻同言華之搖動也而語助也此逸詩也於六義屬興上兩句無意義但以起下兩句之辭耳其所謂爾亦不知其何所指也子曰未之思也夫何遠之有夫音扶夫子借其言而反之蓋前篇仁逺乎哉之意程子曰聖人未嘗言易以驕人之志亦未嘗言難以阻人之進但曰未之思也夫何遠之有此言極有涵蓄意思深遠鄉黨第十楊氏曰聖人之所謂道者不離乎日用之閒也故夫子之平日一動一靜門人皆審視而詳記之尹氏曰甚矣孔門諸子之嗜學也於聖人之容色言動無不謹書而備録之以貽後世今讀其書即其事宛然如聖人之在目也雖然聖人豈拘拘而為之者哉蓋盛德之至動容周旋自中乎禮耳學者欲潛心於聖人宜於此求焉舊說凡一章今分為十七節孔子於鄉黨恂恂如也似不能言者恂相倫反恂恂信實之貌似不能言者謙卑遜順不以賢知先人也鄉黨父兄宗族之所在故孔子居之其容貌辭氣如此其在宗廟朝廷便便言唯謹爾朝直遙反下同便旁連反便便辨也宗朝禮法之所在朝廷政事之所出言不可以不明辨故必詳問而極言之但謹而不放爾此一節記孔子在鄉黨宗廟朝廷言貌之不同朝與下大夫言侃侃如也與上大夫言誾誾如也侃苦旦反誾魚巾反此君未視朝時也王制諸侯上大夫卿下大夫五人許氏說文侃侃剛直也誾誾和悅而諍也君在踧踖如也與與如也踧子六反踖子亦反與平聲或如字君在視朝也踧踖恭敬不寧之貌與與威儀中適之貌張子曰與與不忘向君也亦通此一節記孔子在朝廷事上接下之不同也君召使擯色勃如也足躩如也擯必刃反躩驅若反擯主國之君所使出接賓者勃變色貌躩盤辟貌皆敬君命故也揖所與立左右手衣前後襜如也襜赤占反所與立謂同為擯者也擯用命數之半如上公九命則用五人以次傳命揖左人則左其手揖右人則右其手襜整貌趨進翼如也疾趨而進張拱端好如鳥舒翼賓退必復命曰賓不顧矣紓君敬也此一節記孔子為君擯相之容入公門鞠躬如也如不容鞠躬曲身也公門高大而若不容敬之至也立不中門行不履閾閾于逼反中門中於門也謂當棖闑之閒君出入處也閾門限也禮士大夫出入君門由闑右不踐閾謝氏曰立中門則當尊行履閾則不恪過位色勃如也足躩如也其言似不足者位君之虛位謂門屏之閒人君寧立之處所謂寧也君雖不在過之必敬不敢以虛位而慢之也言似不足不敢肆也攝齊升堂鞠躬如也屏氣似不息者齊音咨攝摳也齊衣下縫也禮將升堂兩手摳衣使去地尺恐躡之而傾跌失容也屏藏也息鼻息出入者也近至尊氣容肅也出降一等逞顔色怡怡如也沒階趨進翼如也復其位踧踖如也陸氏曰趨下本無進字俗本有之誤等階之級也逞放也漸遠所尊舒氣解顔怡怡和悅也沒階下盡階也趨走就位也復位踧踖敬之餘也此一節記孔子在朝之容執圭鞠躬如也如不勝上如揖下如授勃如戰色足蹜蹜如有循勝平聲蹜色六反圭諸侯命圭聘問鄰國則使大夫執以通信如不勝執主器執輕如不克敬謹之至也上如揖下如授謂執圭平衡手與心齊高不過揖卑不過授也戰色戰而色懼也蹜蹜舉足促狹也如有循記所謂舉前曳踵言行不離地如緣物也享禮有容色享獻也既聘而享用圭璧有庭實有容色和也儀禮曰發氣滿容私覿愈愈如也私覿以私禮見也愈愈則又和矣此一節記孔子為君聘於鄰國之禮也朝氏曰孔子定公九年仕魯至十三年適齊其閒絶無朝聘往來之事疑使擯執圭兩條但孔子嘗言其禮當如此爾君子不以紺緅飾紺古暗反緅側由反君子謂孔子紺深青揚赤色齊服也緅絳色三年之喪以飾練服也飾領緣也紅紫不以為䙝服紅紫閒色不正且近於婦人女子之服也䙝服私居服也言此則不以為朝祭之服可知當暑袗絺綌必表而出之袗單也葛之精者曰絺粗者曰綌表而出之謂先著裏衣表絺綌而出之於外欲其不見體也詩所謂蒙彼皺絺是也緇衣羔裘素衣麑裘黃衣狐裘麑研奚反緇黑色羔裘用黑羊皮麑鹿子色白狐色黃衣以裼裘欲其相稱䙝裘長短右袂長欲其溫短右袂所以便作事必有寢衣長一身有半長去聲齊主於敬不可解衣而寢又不可著明衣而寢故别有寢衣其半蓋以覆足程子曰此錯簡當在齊必有明衣布之下愚謂如此則此條與明衣變食既得以類相從而䙝裘狐貉亦得以類相從矣狐貉之厚以居狐貉毛深溫厚私居取其適體去喪無所不佩去上聲君子無故玉不去身觽礪之屬亦皆佩也非帷裳必殺之殺去聲朝祭之服裳用正幅如帷要有襞積而旁無殺縫其餘若深衣要半下齊倍要則無襞積而有殺縫矣羔裘𤣥冠不以弔喪主素吉主𤣥弔必變服所以哀死吉月必朝服而朝吉月月朔也孔子在魯致仕時如此此一節記孔子衣服之制蘇氏曰此孔氏遺書雜記曲禮非特孔子事也齊必有明衣布齊側皆反齊必沐浴浴竟即著明衣所以明潔其體也以布為之此下脫前章寢衣一簡齊必變食居必遷坐變食謂不飲酒不茹葷遷坐易常處也此一節記孔子謹齊之事楊氏曰齊所以交神故致潔變常以盡敬食不厭精膾不厭細食音嗣食飯也精鑿也牛羊與魚之腥聶而切之為膾食精則能養人膾粗則能害人不厭言以是為善非謂必欲如是也食饐而餲魚餒而肉敗不食色惡不食臭惡不食失飪不食不時不食食饐之食音嗣饐於冀反餲烏邁反飪而甚反饐飯傷熱濕也餲味變也魚爛曰餒肉腐曰敗色惡臭惡未敗而色臭變也飪烹調生熟之節也不時五榖不成果實未熟之類此數者皆足以傷人故不食割不正不食不得其醬不食割肉不方正者不食造次不離於正也漢陸續之母切肉未嘗不方斷葱以寸為度蓋其質美與此暗合也食肉用醬各有所宜不得則不食惡其不備也此二者無害於人但不以嗜味而苟食耳肉雖多不使勝食氣唯酒無量不及亂食音嗣量去聲食以榖為主故不使肉勝食氣酒以為人合歡故不為量但以醉為節而不及亂耳程子曰不及亂者非惟不使亂志雖血氣亦不可使亂但浹洽而已可也沽酒市脯不食沽市皆買也恐不精潔或傷人也與不嘗康子之藥同意不撤薑食薑通神明去穢惡故不撤不多食適可而止無貪心也祭於公不宿肉祭肉不出三日出三日不食之矣助祭於公所得胙肉歸即頒賜不俟經宿者不留神惠也家之祭肉則不過三日皆以分賜蓋過三日則肉必敗而人不食之是䙝鬼神之餘也但比君所賜胙可少緩耳食不語寢不言答述曰語自言曰言范氏曰聖人存心不他當食而食當寢而寢言語非其時也楊氏曰肺為氣主而聲出焉寢食則氣窒而不通語言恐傷之也亦通雖疏食菜羹瓜祭必齊如也食音嗣陸氏曰魯論瓜作必古人飲食每種各出少許置之豆閒之地以祭先代始為飲食之人不忘本也齊嚴敬貌孔子雖薄物必祭其祭必敬聖人之誠也此一節記孔子飲食之節謝氏曰聖人飲食如此非極口腹之欲蓋養氣體不以傷生當如此然聖人之所不食窮口腹者或反食之欲心勝而不暇擇也席不正不坐謝氏曰聖人心安於正故於位之不正者雖小不處鄉人飲酒杖者出斯出矣杖者老人也六十杖於鄉未出不敢先既出不敢後鄉人儺朝服而立於阼階儺乃多反儺所以逐疫周禮方相氏掌之阼階東階也儺雖古禮而近於戲亦必朝服而臨之者無所不用其誠敬也或曰恐其驚先祖五祀之神欲其依己而安也此一節記孔子居鄉之事問人於他邦再拜而送之拜送使者如親見之敬也康子饋藥拜而受之曰丘未達不敢嘗范氏曰凡賜食必嘗以拜藥未達則不敢嘗受而不飲則虛人之賜故告之如此然則可飲而飲不可飲而不飲皆在其中矣楊氏曰大夫有賜拜而受之禮也未達不敢嘗謹疾也必告之直也此一節記孔子與人交之誠意廏焚子退朝曰傷人乎不問馬非不愛馬然恐傷人之意多故未暇問蓋貴人賤畜理當如此君賜食必正席先嘗之君賜腥必熟而薦之君賜生必畜之食恐或餕餘故不以薦正席先嘗如對君也言先嘗則餘當以頒賜矣腥生肉熟而薦之祖考榮君賜也畜之者仁君之惠無故不敢殺也侍食於君君祭先飯飯扶晚反周禮王日一舉膳夫授祭品嘗食王乃食故侍食者君祭則已不祭而先飯若為君嘗食然不敢當客禮也疾君視之東首加朝服拖紳首去聲拖徒我反東首以受生氣也病卧不能著衣束帶又不可以䙝服見君故加朝服於身又引大帶於上也君命召不俟駕行矣急趨君命行出而駕車隨之此一節記孔子事君之禮入太廟每事問重出朋友死無所歸曰於我殯朋友以義合死無所歸不得不殯朋友之饋雖車馬非祭肉不拜朋友有通財之義故雖車馬之重不拜祭肉則拜者敬其祖考同於己親也此一節記孔子交朋友之義寢不尸居不容尸謂偃臥似死人也居居家容容儀范氏曰寢不尸非惡其類於死也惰慢之氣不設於身體雖舒布其四體而亦未嘗肆耳居不容非惰也但不若奉祭祀見賓客而已申申夭夭是也見齊衰者雖狎必變見冕者與瞽者雖䙝必以貌狎謂素親狎褻謂燕見貌謂禮貌餘見前篇凶服者式之式負版者式車前橫木有所敬則俯而憑之負版持邦國圖籍者式此二者哀有喪重民數也人惟萬物之靈而王者之所天也故周禮獻民數於王王拜受之况其下者敢不敬乎有盛饌必變色而作敬主人之禮非以其饌也迅雷風烈必變迅疾也烈猛也必變者所以敬天之怒記曰若有疾風迅雷甚雨則必變雖夜必興衣服冠而坐此一節記孔子容貌之變升車必正立執綏綏挽以上車之索也范氏曰正立執綏則心體無不正而誠意肅恭矣蓋君子莊敬無所不在升車則見於此也車中不內顧不疾言不親指內顧回視也禮曰顧不過轂三者皆失容且惑人此一節記孔子升車之容色斯舉矣翔而後集言鳥見人之顔色不善則飛去回翔審視而後下止人之見幾而作審擇所處亦當如此然此上下必有闕文矣曰山梁雌雉時哉時哉子路共之三嗅而作共九用反又居勇反嗅許又反邢氏曰梁橋也時哉言雉之飲啄得其時子路不達以為時物而共具之孔子不食三嗅其氣而起朝氏曰石經嗅作戞謂雉鳴也劉聘君曰嗅當作狊古闐反張兩翅也見爾雅愚按如後兩說則共字當為拱執之義然此必有闕文不可彊為之說姑記所聞以俟知者論語卷五
