body:
  text: 欽定四庫全書經部八四書章句集注四書類提要臣等謹案大學章句一卷論語集注十卷孟子集注七卷中庸章句一卷宋朱子撰案論語自漢文帝時立博士孟子據趙岐題詞文帝時亦立博士以其旋罷故史不載中庸説二篇見漢書藝文志戴顒中庸傳二卷梁武帝中庸講疏一卷見隋書經籍志惟大學無别行之本然書録解題載司馬光有大學廣義一卷中庸廣義一卷已在二程以前均不自洛閩諸儒始為表章特其論説之詳自二程始定著四書之名則自朱子始耳原本首大學次論語次孟子次中庸後刋本以大學中庸篇頁無多併為一册遂移中庸於論語前明代科舉命題又以作者先後移中庸于孟子前然非宏旨所關不必定復其舊也大學古本為一篇朱子則分别經傳顛倒其舊次補綴其闕文中庸亦不從鄭注分節故均謂之章句論語孟子融會諸家之説故謂之集注猶何晏注論語裒八家之説稱集解也惟晏注皆標其姓朱子則或標或不標例稍殊焉大學章句諸儒頗有異同然所謂誠其意者以下並用舊文所特創者不過補傳一章要非增於八條目外既於理無害又於學者不為無禆何必分門角逐歟中庸雖不從鄭注而實較鄭注為精密蓋考證之學宋儒不及漢儒義理之學漢儒亦不及宋儒言豈一端要各有當況鄭注之善者如戒慎乎其所不睹四句未嘗不採用其意雖有其位一節又未嘗不全襲其文觀其去取具有鑒裁尤不必定執古義相爭也論語孟子亦頗取古注如論語瑚璉一條與明堂位不合孟子曹交一注與春秋傳不合論者或以為疑不知瑚璉用包咸注曹交用趙岐注非朱子杜撰也又如夫子之牆數仭注七尺曰仭掘井九仭注八尺曰仭論者尤以為矛盾不知七尺亦包咸注八尺亦趙岐注也是知鎔鑄羣言非出私見苟不詳考所出固未可槩目以師心矣大抵朱子平生精力殫於四書其判析疑似辨别毫釐實逺在易本義詩集傳上讀其書者要當於大義微言求其根本明以來議朱子者務托其名物度數之疏尊朱子者又併此末節而回護之是均門户之見烏識朱子著書之意乎乾隆四十二年五月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀欽定四庫全書大學章句序大學之書古之大學所以教人之法也蓋自天降生民則既莫不與之以仁義禮智之性矣然其氣質之稟或不能齊是以不能皆有以知其性之所有而全之也一有聰明睿智能盡其性者出於其間則天必命之以為億兆之君師使之治而教之以復其性此伏羲神農黃帝堯舜所以繼天立極而司徒之職典樂之官所由設也三代之隆其法寖備然後王宫國都以及閭巷莫不有學人生八歲則自王公以下至於庶人之子弟皆入小學而教之以灑掃應對進退之節禮樂射御書數之文及其十有五年則自天子之元子衆子以至公卿大夫元士之適子與凡民之俊秀皆入大學而教之以窮理正心修巳治人之道此又學校之教大小之節所以分也夫以學校之設其廣如此教之之術其次第節目之詳又如此而其所以為教則又皆本之人君躬行心得之餘不待求之民生日用彝倫之外是以當世之人無不學其學焉者無不有以知其性分之所固有職分之所當為而各俯焉以盡其力此古昔盛時所以治隆於上俗美於下而非後世之所能及也及周之衰賢聖之君不作學校之政不修教化陵夷風俗頽敗時則有若孔子之聖而不得君師之位以行其政教於是獨取先王之法誦而傳之以詔後世若曲禮少儀內則弟子職諸篇固小學之支流餘裔而此篇者則因小學之成功以著大學之明法外有以極其規模之大而內有以盡其節目之詳者也三千之徒蓋莫不聞其説而曾氏之傳獨得其宗於是作為傳義以發其意及孟子沒而其傳泯焉則其書雖存而知者鮮矣自是以來俗儒記誦詞章之習其功倍於小學而無用異端虛無寂滅之教其高過於大學而無實其他權謀術數一切以就功名之説與夫百家衆技之流所以惑世誣民充塞仁義者又紛然雜出乎其間使其君子不幸而不得聞大道之要其小人不幸而不得蒙至治之澤晦盲否塞反覆沈痼以及五季之衰而壞亂極矣天運循環無往不復宋德隆盛治教休明於是河南程氏兩夫子出而有以接乎孟氏之傳實始尊信此篇而表章之既又為之次其簡編發其歸趣然後古者大學教人之法聖經賢傳之指粲然復明於世雖以熹之不敏亦幸私淑而與有聞焉顧其為書猶頗放失是以忘其固陋采而輯之間亦竊附巳意補其闕略以俟後之君子極知僭踰無所逃罪然於國家化民成俗之意學者修巳治人之方則未必無小補云淳熙巳酉二月甲子新安朱熹序欽定四庫全書大學大舊音泰今讀如字宋朱子章句子程子曰大學孔氏之遺書而初學入德之門也於今可見古人為學次第者獨賴此篇之存而論孟次之學者必由是而學焉則庶乎其不差矣大學之道在明明德在親民在止於至善程子曰親當作新大學者大人之學也明明之也明德者人之所得乎天而虛靈不眛以具衆理而應萬事者也但為氣稟所拘人欲所蔽則有時而昏然其本體之明則有未嘗息者故學者當因其所發而遂明之以復其初也新者革其舊之謂也言既自明其明德又當推以及人使之亦有以去其舊染之汚也止者必至於是而不遷之意至善則事理當然之極也言明明德新民皆當止於至善之地而不遷蓋必其有以盡夫天理之極而無一毫人欲之私也此三者大學之綱領也知止而后有定定而后能靜靜而后能安安而后能慮慮而后能得后與後同後放此止者所當止之地即至善之所在也知之則志有定向靜謂心不妄動安謂所處而安慮謂處事精詳得謂得其所止物有本末事有終始知所先後則近道矣明德為本新民為末知止為始能得為終本始所先末終所後此結上文兩節之意古之欲明明德於天下者先治其國欲治其國者先齊其家欲齊其家者先修其身欲修其身者先正其心欲正其心者先誠其意欲誠其意者先致其知致知在格物治平聲後放此明明德於天下者使天下之人皆有以明其明德也心者身之所主也誠實也意者心之所發也實其心之所發欲其必自慊而無自欺也致推極也知猶識也推極吾之知識欲其所知無不盡也格至也物猶事也窮至事物之理欲其極處無不到也此八者大學之條目也物格而后知至知至而后意誠意誠而后心正心正而后身修身修而后家齊家齊而后國治國治而后天下平治去聲後放此物格者物理之極處無不到也知至者吾心之所知無不盡也知既盡則意可得而實矣意既實則心可得而正矣修身以上明明德之事也齊家以下新民之事也物格知至則知所止矣意誠以下則皆得所止之序也自天子以至於庶人一是皆以修身為本一是一切也正心以上皆所以修身也齊家以下則舉此而錯之耳其本亂而末治者否矣其所厚者薄而其所薄者厚未之有也本謂身也所厚謂家也此兩節結上文兩節之意右經一章蓋孔子之言而曾子述之凡二百五字其傳十章則曾子之意而門人記之也舊本頗有錯簡今因程子所定而更考經文别為序次如左凡千五百四十六字凡傳文雜引經傳若無統紀然文理接續血脈貫通深淺始終至為精密熟讀詳味久當見之今不盡釋也康誥曰克明德康誥周書克能也大甲曰顧諟天之明命大讀作泰諟古是字大甲商書顧謂常目在之也諟猶此也或曰審也天之明命即天之所以與我而我之所以為德者也常目在之則無時不明矣帝典曰克明峻德峻書作俊帝典堯典虞書峻大也皆自明也結所引書皆言自明巳德之意右傳之首章釋明明德此通下三章至止於信舊本誤在沒世不忘之下湯之盤銘曰茍日新日日新又日新盤沐浴之盤也銘名其器以自警之辭也茍誠也湯以人之洗濯其心以去惡如沐浴其身以去垢故銘其盤言誠能一日有以滌其舊染之汚而自新則當因其已新者而日日新之又日新之不可略有間斷也康誥曰作新民鼓之舞之之謂作言振起其自新之民也詩曰周雖舊邦其命維新詩大雅文王之篇言周國雖舊至於文王能新其德以及於民而始受天命也是故君子無所不用其極自新新民皆欲止於至善也右傳之二章釋新民詩云邦畿千里惟民所止詩商頌玄鳥之篇邦畿王者之都也止居也言物各有所當止之處也詩云緡蠻黃鳥止于丘隅子曰於止知其所止可以人而不如鳥乎緡詩作綿詩小雅緡蠻之篇緡蠻鳥聲丘隅岑蔚之處子曰以下孔子説詩之辭言人當知所當止之處也詩云穆穆文王於緝熙敬止為人君止於仁為人臣止於敬為人子止於孝為人父止於慈與國人交止於信於緝之於音烏詩文王之篇穆穆深逺之意於歎美辭緝繼續也熙光明也敬止言其無不敬而安所止也引此而言聖人之止無非至善五者乃其目之大者也學者於此究其精微之藴而又推類以盡其餘則於天下之事皆有以知其所止而無疑矣詩云瞻彼淇澳菉竹猗猗有斐君子如切如磋如琢如磨瑟兮僩兮赫兮喧兮有斐君子終不可喧兮如切如磋者道學也如琢如磨者自修也瑟兮僩兮者恂栗也赫兮喧兮者威儀也有斐君子終不可喧兮者道盛德至善民之不能忘也澳於六反菉詩作緑猗叶韻音阿僩下版反喧詩作咺喧詩作諼並况晚反恂鄭氏讀作峻詩衛風淇澳之篇淇水名澳隈也猗猗美盛貌興也斐文貌切以刀鋸琢以椎鑿皆裁物使成形質也磋以鑢鐋磨以沙石皆治物使其滑澤也治骨角者既切而復磋之治玉石者既琢而復磨之皆言其治之有緒而益致其精也瑟嚴密之貌僩武毅之貌赫喧宣著盛大之貌喧忘也道言也學謂講習討論之事自修者省察克治之功恂栗戰懼也威可畏也儀可象也引詩而釋之以明明明德者之止於至善道學自修言其所以得之之由恂栗威儀言其德容表裏之盛卒乃指其實而歎美之也詩云於戲前王不忘君子賢其賢而親其親小人樂其樂而利其利此以沒世不忘也於戲音嗚呼樂音洛詩周頌烈文之篇於戲歎辭前王謂文武也君子謂其後賢後王小人謂後民也此言前王所以新民者止於至善能使天下後世無一物不得其所所以既沒世而人思慕之愈久而不忘也此兩節咏歎淫泆其味深長當熟玩之右傳之三章釋止於至善此章內自引淇澳詩以下舊本誤在誠意章下子曰聽訟吾猶人也必也使無訟乎無情者不得盡其辭大畏民志此謂知本猶人不異於人也情實也引夫子之言而言聖人能使無實之人不敢盡其虛誕之辭蓋我之明德既明自然有以畏服民之心志故訟不待聽而自無也觀於此言可以知本末之先後矣右傳之四章釋本末此章舊本誤在止於信下此謂知本程子曰衍文也此謂知之至也此句之上别有闕文此特其結語耳右傳之五章蓋釋格物致知之義而今亡矣此章舊本通下章誤在經文之下間嘗竊取程子之意以補之曰所謂致知在格物者言欲致吾之知在即物而窮其理也蓋人心之靈莫不有知而天下之物莫不有理惟於理有未窮故其知有不盡也是以大學始教必使學者即凡天下之物莫不因其巳知之理而益窮之以求至乎其極至於用力之久而一旦豁然貫通焉則衆物之表裏精粗無不到而吾心之全體大用無不明矣此謂物格此謂知之至也所謂誠其意者毋自欺也如惡惡臭如好好色此之謂自謙故君子必慎其獨也惡好上字皆去聲謙讀為慊苦劫反誠其意者自修之首也毋者禁止之辭自欺云者知為善以去惡而心之所發有未實也謙快也足也獨者人所不知而已所獨知之地也言欲自修者知為善以去其惡則當實用其力而禁止其自欺使其惡惡則如惡惡臭好善則如好好色皆務決去而求必得之以自快足於己不可徒茍且以徇外而為人也然其實與不實蓋有他人所不及知而巳獨知之者故必謹之於此以審其幾焉小人間居為不善無所不至見君子而后厭然掩其不善而著其善人之視已如見其肺肝然則何益矣此謂誠於中形於外故君子必慎其獨也間音間厭鄭氏讀作黶間居獨處也厭然消沮閉藏之貌此言小人隂為不善而陽欲掩之則是非不知善之當為與惡之當去也但不能實用其力以至此耳然欲掩其惡而卒不可掩欲詐為善而卒不可詐則亦何益之有哉此君子所以重以為戒而必謹其獨也曾子曰十目所視十手所指其嚴乎引此以明上文之意言雖幽獨之中而其善惡之不可掩如此可畏之甚也富潤屋德潤身心廣體胖故君子必誠其意胖步丹反胖安舒也言富則能潤屋矣德則能潤身矣故心無愧怍則廣大寬平而體常舒泰德之潤身者然也蓋善之實於中而形於外者如此故又言此以結之右傳之六章釋誠意經曰欲誠其意先致其知又曰知至而后意誠蓋心體之明有所未盡則其所發必有不能實用其力而茍焉以自欺者然或已明而不謹乎此則其所明又非巳有而無以為進德之基故此章之指必承上章而通考之然後有以見其用力之始終其序不可亂而功不可闕如此云所謂修身在正其心者身有所忿懥則不得其正有所恐懼則不得其正有所好樂則不得其正有所憂患則不得其正程子曰身有之身當作心忿弗粉反懥敕值反好樂並去聲忿懥怒也蓋是四者皆心之用而人所不能無者然一有之而不能察則欲動情勝而其用之所行或不能不失其正矣心不在焉視而不見聽而不聞食而不知其味心有不存則無以檢其身是以君子必察乎此而敬以直之然後此心常存而身無不修也此謂修身在正其心右傳之七章釋正心修身此亦承上章以起下章蓋意誠則真無惡而實有善矣所以能存是心以檢其身然或但知誠意而不能密察此心之存否則又無以直內而修身也自此以下並以舊文為正所謂齊其家在修其身者人之其所親愛而辟焉之其所賤惡而辟焉之其所畏敬而辟焉之其所哀矜而辟焉之其所敖惰而辟焉故好而知其惡惡而知其美者天下鮮矣辟讀為僻惡而之惡敖好並去聲鮮上聲人謂衆人之猶於也辟猶偏也五者在人本有當然之則然常人之情惟其所向而不加察焉則必陷於一偏而身不修矣故諺有之曰人莫知其子之惡莫知其苗之碩諺音彥碩叶韻時若反諺俗語也溺愛者不明貪得者無厭是則偏之為害而家之所以不齊也此謂身不修不可以齊其家右傳之八章釋修身齊家所謂治國必先齊其家者其家不可教而能教人者無之故君子不出家而成教於國孝者所以事君也弟者所以事長也慈者所以使衆也弟去聲長上聲身修則家可教矣孝弟慈所以修身而教於家者也然而國之所以事君事長使衆之道不外乎此此所以家齊於上而教成於下也康誥曰如保赤子心誠求之雖不中不逺矣未有學養子而后嫁者也中去聲此引書而釋之又明立教之本不假強為在識其端而推廣之耳一家仁一國興仁一家讓一國興讓一人貪戾一國作亂其機如此此謂一言僨事一人定國僨音奮一人謂君也機發動所由也僨覆敗也此言教成於國之效堯舜帥天下以仁而民從之桀紂帥天下以暴而民從之其所令反其所好而民不從是故君子有諸巳而后求諸人無諸巳而后非諸人所藏乎身不恕而能喻諸人者未之有也好去聲此又承上文一人定國而言有善於巳然後可以責人之善無惡於已然後可以正人之惡皆推已以及人所謂恕也不如是則所令反其所好而民不從矣喻曉也故治國在齊其家通結上文詩云桃之夭夭其葉蓁蓁之子于歸宜其家人宜其家人而后可以教國人夭平聲蓁音臻詩周南桃夭之篇夭夭少好貌蓁蓁美盛貌興也之子猶言是子此指女子之嫁者而言也婦人謂嫁曰歸宜猶善也詩云宜兄宜弟宜兄宜弟而后可以教國人詩小雅蓼蕭篇詩云其儀不忒正是四國其為父子兄弟足法而后民法之也詩曹風鳲鳩篇忒差也此謂治國在齊其家此三引詩皆以咏嘆上文之事而又結之如此其味深長最宜潛玩右傳之九章釋齊家治國所謂平天下在治其國者上老老而民興孝上長長而民興弟上恤孤而民不倍是以君子有潔矩之道也長上聲弟去聲倍與背同潔胡結反老老所謂老吾老也興謂有所感發而興起也孤者幼而無父之稱潔度也矩所以為方也言此三者上行下效捷於影響所謂家齊而國治也亦可以見人心之所同而不可使有一夫之不獲矣是以君子必當因其所同推以度物使彼我之間各得分願則上下四旁均齊方正而天下平矣所惡於上毋以使下所惡於下毋以事上所惡於前毋以先後所惡於後毋以從前所惡於右毋以交於左所惡於左毋以交於右此之謂潔矩之道惡先並去聲此覆解上文潔矩二字之義如不欲上之無禮於我則心以此度下之心而亦不敢以此無禮使之不欲下之不忠於我則必以此度上之心而亦不敢以此不忠事之至於前後左右無不皆然則身之所處上下四旁長短廣狹彼此如一而無不方矣彼同有是心而興起焉者又豈有一夫之不獲哉所操者約而所及者廣此平天下之要道也故章內之意皆自此而推之詩云樂只君子民之父母民之所好好之民之所惡惡之此之謂民之父母樂音洛只音紙好惡並去聲下並同詩小雅南山有臺之篇只語助辭言能潔矩而以民心為巳心則是愛民如子而民愛之知父母矣詩云節彼南山維石巖巖赫赫師尹民具爾瞻有國者不可以不慎辟則為天下僇矣節讀為截辟讀為僻僇與戮同詩小雅節南山之篇節截然高大貌師尹周大師尹氏也具俱也辟偏也言在上者人所瞻仰不可不謹若不能潔矩而好惡徇於一巳之偏則身弒國亡為天下之大戮矣詩云殷之未喪師克配上帝儀監于殷峻命不易道得衆則得國失衆則失國喪去聲儀詩作宜峻詩作駿易去聲詩文王篇師衆也配對也配上帝言其為天下君而對乎上帝也監視也峻大也不易言難保也道言也引詩而言此以結上文兩節之意有天下者能存此心而不失則所以潔矩而與民同欲者自不能巳矣是故君子先慎乎德有德此有人有人此有土有土此有財有財此有用先慎乎德承上文不可不謹而言德即所謂明德有人謂得衆有土謂得國有國則不患無財用矣德者本也財者末也本上文而言外本內末爭民施奪人君以德為外以財為內則是爭鬭其民而施之以劫奪之教也蓋財者人之所同欲不能潔矩而欲専之則民亦起而爭奪矣是故財聚則民散財散則民聚外本內末故財聚爭民施奪故民散反是則有德而有人矣是故言悖而出者亦悖而入貨悖而入者亦悖而出悖布內反悖逆也此以言之出入明貨之出入也自先慎乎德以下至此又因財貨以明能潔矩與不能者之得失也康誥曰惟命不于常道善則得之不善則失之矣道言也因上文引文王詩之意而申言之其丁寧反覆之意益深切矣楚書曰楚國無以為寶惟善以為寶楚書楚語言不寶金玉而寶善人也舅犯曰亡人無以為寶仁親以為寶舅犯晉文公舅狐偃字子犯亡人文公時為公子出亡在外也仁愛也事見檀弓此兩節又明不外本而內末之意秦誓曰若有一個臣斷斷兮無他技其心休休焉其如有容焉人之有技若巳有之人之彥聖其心好之不啻若自其口出實能容之以能保我子孫黎民尚亦有利哉人之有技媢疾以惡之人之彥聖而違之俾不通實不能容以不能保我子孫黎民亦曰殆哉個古賀反書作介斷丁亂反媢音冒秦誓周書斷斷誠一之貌彥美士也聖通明也尚庶幾也媢忌也違拂戾也殆危也唯仁人放流之迸諸四夷不與同中國此謂唯仁人為能愛人能惡人迸讀為屏古字通用迸猶遂也言有此媢疾之人妨賢而病國則仁人必深惡而痛絶之以其至公無私故能得好惡之正如此也見賢而不能舉舉而不能先命也見不善而不能退退而不能逺過也命鄭氏云當作幔程子云當作怠未詳孰是逺去聲若此者知所愛惡矣而未能盡愛惡之道蓋君子而未仁者也好人之所惡惡人之所好是謂拂人之性災必逮夫身災古災字夫音扶拂逆也好善而惡惡人之性也至於拂人之性則不仁之甚者也自秦誓至此又皆以申言好惡公私之極以明上文所引南山有臺節南山之意是故君子有大道必忠信以得之驕泰以失之君子以位言之道謂居其位而修巳治人之術發已自盡為忠循物無違謂信驕者矜高泰者侈肆此因上所引文王康誥之意而言章內三言得失而語益加切蓋至此而天理存亡之幾決矣生財有大道生之者衆食之者寡為之者疾用之者舒則財恆足矣恆胡登反吕氏曰國無遊民則生者衆矣朝無幸位則食者寡矣不奪農時則為之疾矣量入為出則用之舒矣愚按此因有土有財而言以明足國之道在乎務本而節用非必外本內末而後財可聚也自此以至終篇皆一意也仁者以財發身不仁者以身發財發猶起也仁者散財以得民不仁者亡身以殖貨未有上好仁而下不好義者也未有好義其事不終者也未有府庫財非其財者也上好仁以愛其下則下好義以忠其上所以事必有終而府庫之財無悖出之患也孟獻子曰畜馬乘不察於雞豚伐冰之家不畜牛羊百乘之家不畜聚斂之臣與其有聚斂之臣寧有盜臣此謂國不以利為利以義為利也畜許六反乘斂並去聲孟獻子魯之賢大夫仲孫蔑也畜馬乘士初試為大夫者也伐冰之家卿大夫以上喪祭用冰者也百乘之家有采地者也君子寧亡巳之財而不忍傷民之力故寧有盜臣而不畜聚斂之臣此謂以下釋獻子之言也長國家而務財用者必自小人矣彼為善之小人之使為國家災害並至雖有善者亦無如之何矣此謂國不以利為利以義為利也長上聲彼為善之此句上下疑有闕文誤字自由也言由小人導之也此一節深明以利為利之害而重言以結之其丁寧之意切矣右傳之十章釋治國平天下此章之義務在與民同好惡而不専其利皆推廣潔矩之意也能如是則親賢樂利各得其所而天下平矣凡傳十章前四章統論綱領指趣後六章細論條目工夫其第五章乃明善之要第六章乃誠身之本在初學尤為當務之急讀者不可以其近而忽之也大學欽定四庫全書論語序説史記世家曰孔子名丘字仲尼其先宋人父叔梁紇母顔氏以魯襄公二十二年庚戌之嵗十一月庚子生孔子於魯昌平鄉陬邑為兒嬉戲常陳俎豆設禮容及長為委吏料量平委吏本作季氏史索隱云一本作委吏與孟子合今從之為司職吏畜蕃息職見周禮牛人讀為樴義與杙同蓋繫飬犧牲之所此官即孟子所謂乘田適周問禮於老子既反而弟子益進昭公二十五年甲申孔子年三十五而昭公奔齊魯亂於是適齊為高昭子家臣以通乎景公有聞韶問政二事公欲封以尼溪之田晏嬰不可公惑之有季孟吾老之語孔子遂行反乎魯定公元年壬辰孔子年四十三而季氏強僭其臣陽虎作亂專政故孔子不仕而退修詩書禮樂弟子彌衆九年庚子孔子年五十一公山不狃以費畔季氏召孔子欲往而卒不行有答子路東周語定公以孔子為中都宰一年四方則之遂為司空又為大司寇十年辛丑相定公會齊侯于夾谷齊人歸魯侵地十二年癸卯使仲由為季氏宰墮三都收其甲兵孟氏不肯墮成圍之不克十四年乙巳孔子年五十六攝行相事誅少正卯與聞國政三月魯國大治齊人歸女樂以沮之季桓子受之郊又不致膰俎於大夫孔子行魯世家以此以上皆為十二年事適衛主於子路妻兄顔濁鄒家孟子作顔讎由適陳過匡匡人以為陽虎而拘之有顔淵後及文王既沒之語既解還衛主蘧伯玉家見南子有矢子路及未見好德之語去適宋司馬桓魋欲殺之有天生德語及微服過宋事又去適陳主司城貞子家居三歲而反于衛靈公不能用有三年有成之語晉趙氏家臣佛肸以中牟畔召孔子孔子欲往不果有答子路堅白語及荷蕢過門事將西見趙簡子至河而反又主蘧伯玉家靈公問陳不對而行復如陳據論語則絶糧當在此時季桓子卒遺言謂康子必召孔子其臣止之康子乃召冉求史記以論語歸與之歎為在此時又以孟子所記歎詞為主司城貞子時語疑不然蓋語孟所記本皆此一時語而所記有異同耳孔子如蔡及葉有葉公問答子路不對沮溺耦耕荷蓧丈人等事史記云於是楚昭王使人聘孔子孔子將往拜禮而陳蔡大夫發徒圍之故孔子絶糧於陳蔡之間有慍見及告子貢一貫之語按是時陳蔡臣服於楚若楚王來聘孔子陳蔡大夫安敢圍之且據論語絶糧當在去衛如陳之時楚昭王將以書社地封孔子令尹子西不可乃止史記云書社地七百里恐無此理時則有接輿之歌又反乎衛時靈公已卒衛君輒欲得孔子為政有魯衛兄弟及答子貢夷齊子路正名之語而冉求為季氏將與齊戰有功康子乃召孔子而孔子歸魯實哀公之十一年丁巳而孔子年六十八矣有對哀公及康子語然魯終不能用孔子孔子亦不求仕乃敘書傳禮記有把宋損益從周等語刪詩正樂有語大師及樂正之語序易彖繫象説卦文言有假我數年之語弟子蓋三千焉身通六藝者七十二人弟子顔回最賢蚤死後唯曾參得傳孔子之道十四年庚申魯西狩獲麟有莫我知之歎孔子作春秋有知我罪我等語論語請討陳恆事亦在是年明年辛酉子路死於衛十六年壬戌四月己丑孔子卒年七十三葬魯城北泗上弟子皆服心喪三年而去惟子貢廬於冢上凡六年孔子生鯉字伯魚先卒伯魚生伋字子思作中庸子思學於曾子而孟子受業子思之門人何氏曰魯論語二十篇齊論語别有問王知道凡二十二篇其二十篇中章句頗多於魯論古論出孔氏壁中分堯曰下章子張問以為一篇有兩子張凡二十一篇篇次不與齊魯論同程子曰論語之書成於有子曾子之門人故其書獨二子以子稱程子曰讀論語有讀了全然無事者有讀了後其中得一兩句喜者有讀了後知好之者有讀了後直有不知手之舞之足之蹈之者程子曰今人不會讀書如讀論語未讀時是此等人讀了後又只是此等人便是不曾讀程子曰頤自十七八讀論語當時巳曉文義讀之愈久但覺意味深長
