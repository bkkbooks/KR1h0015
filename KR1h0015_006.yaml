body:
  text: 欽定四庫全書論語卷六宋朱子集注先進第十一此篇多評弟子賢否凡二十五章胡氏曰此篇記閔子騫言行者四而其一直稱閔子疑閔氏門人所記也子曰先進於禮樂野人也後進於禮樂君子也先進後進猶言前輩後輩野人謂郊外之民君子謂賢士大夫也程子曰先進於禮樂文質得宜今反謂之質朴而以為野人後進之於禮樂文過其質今反謂之彬彬而以為君子蓋周末文勝故時人之言如此不自知其過於文也如用之則吾從先進用之謂用禮樂孔子既述時人之言又自言其如此蓋欲損過以就中也子曰從我於陳蔡者皆不及門也從去聲孔子嘗厄於陳蔡之閒弟子多從之者此時皆不在門故孔子思之蓋不忘其相從於患難之中也德行顔淵閔子騫冉伯牛仲弓言語宰我子貢政事冉有季路文學子游子夏行去聲弟子因孔子之言記此十人而並目其所長分為四科孔子教人各因其材於此可見程子曰四科乃從夫子於陳蔡者爾門人之賢君固不止此曾子傳道而不與焉故知十哲世俗論也子曰回也非助我者也於吾言無所不說說音悅助我若子夏之起豫因疑問而有以相長也顔子於聖人之言默識心通無所疑問故夫子云然其辭若有憾焉其實乃深喜之胡氏曰夫子之於回豈真以助我望之蓋聖人之謙德又以深贊顔子云爾子曰孝哉閔子騫人不閒於其父母昆弟之言閒去聲胡氏曰父母兄弟稱其孝友人皆信之無異詞者蓋其孝友之實有以積於中而著於外故夫子歎而美之南容三復白圭孔子以其兄之子妻之三妻並去聲詩大雅抑之篇曰白圭之玷尚可磨也斯言之玷不可為也南容一日三復此言事見家語蓋深有意於謹言也此邦有道所以不廢邦無道所以免禍故孔子以兄子妻之范氏曰言者行之表行者言之實未有易其言而能謹於行者南容欲謹其言如此則必能謹其行矣季康子問弟子孰為好學孔子對曰有顔回者好學不幸短命死矣今也則亡好去聲范氏曰哀公康子問同而對有詳略者臣之告君不可不盡若康子者必待其能問乃告之此教誨之道也顔淵死顔路請子之車以為之椁顔路淵之父名無繇少孔子六歲孔子始教而受學焉椁外棺也請為椁欲賣車以買椁也子曰才不才亦各言其子也鯉也死有棺而無椁吾不徒行以為之椁以吾從大夫之後不可徒行也鯉孔子之子伯魚也先孔子卒言鯉之才雖不及顔淵然已與顔路以父視之則皆子也孔子時已致仕尚從大夫之列言後謙辭胡氏曰孔子遇舊館人之喪嘗脫驂以賻之矣今乃不許顔路之請何耶葬可以無椁驂可以脫而復求大夫不可以徒行命車不可以與人而鬻諸市也且為所識窮乏者得我而勉強以副其意豈誠心與直道哉或者以為君子行禮視吾之有無而已夫君子之用財視義之可否豈獨視有無而已哉顔淵死子曰噫天喪豫天喪豫喪去聲噫傷痛聲悼道無傳若天喪已也顔淵死子哭之慟從者曰子慟矣從去聲慟哀過也曰有慟乎哀傷之至不自知也非夫人之為慟而誰為夫音扶為去聲夫人謂顔淵言其死可惜哭之宜慟非他人之比也胡氏曰痛惜之至施當其可皆情性之正也顔淵死門人欲厚葬之子曰不可喪具稱家之有無貧而厚葬不循理也故夫子止之門人厚葬之蓋顔路聽之子曰回也視豫猶父也豫不得視猶子也非我也夫二三子也歎不得如葬鯉之得宜以責門人也季路問事鬼神子曰未能事人焉能事鬼敢問死曰未知生焉知死焉於䖍反問事鬼神蓋求所以奉祭祀之意而死者人之所必有不可不知皆切問也然非誠敬足以事人則必不能事神非原始而知所以生則必不能反終而知所以死蓋幽明始終初無二理但學之有序不可躐等故夫子告之如此程子曰晝夜者死生之道也知生之道則知死之道盡事人之道則盡事鬼之道死生人鬼一而二二而一者也或言夫子不告子路不知此乃所以深告之也閔子侍側誾誾如也子路行行如也冉有子貢侃侃如也子樂誾侃音義見前篇行胡浪反樂音洛行行剛強之貌子樂者樂得英才而教育之若由也不得其死然尹氏曰子路剛強有不得其死之理故因以戒之其後子路卒死於衛孔悝之難洪氏曰漢書引此句上有曰字或云上文樂字即曰字之誤魯人為長府長府藏名藏貨財曰府為蓋改作之閔子騫曰仍舊貫如之何何必改作仍因也貫事也王氏曰改作勞民傷財在於得已則不如仍舊貫之善子曰夫人不言言必有中夫音扶中去聲言不妄發發必當理惟有德者能之子曰由之瑟奚為於丘之門程子曰言其聲之不和與己不同也家語云子路鼓瑟有北鄙殺伐之聲蓋其氣質剛勇而不足於中和故其發於聲者如此門人不敬子路子曰由也升堂矣未入於室也門人以夫子之言遂不敬子路故夫子釋之升堂入室喻入道之次第言子路之學已造乎正大高明之域特未深入精微之奧耳未可以一事之失而遽忽之也子貢問師與商也孰賢子曰師也過商也不及子張才高意廣而好為苟難故常過中子夏篤信謹守而規模狹隘故常不及曰然則師愈與與平聲愈猶勝也子曰過猶不及道以中庸為至賢智之過雖若勝於愚不肖之不及然其失中則一也尹氏曰中庸之為德也其至矣乎夫過與不及均也差之毫釐繆以千里故聖人之教抑其過引其不及歸於中道而已季氏富於周公而求也為之聚斂而附益之為去聲周公以王室至親有大功位冢宰其富宜矣季氏以諸侯之卿而富過之非攘奪其君刻剝其民何以得此冉有為季氏宰又為之急賦稅以益其富子曰非吾徒也小子鳴鼓而攻之可也非吾徒絶之也小子鳴鼓而攻之使門人聲其罪以責之也聖人之惡黨惡而害民也加此然師嚴而友親故已絶之而猶使門人正之又見其愛人之無已也范氏曰冉有以政事之才施於季氏故為不善至於如此由其心術不明不能反求諸身而以仕為急故也柴也愚柴孔子弟子姓高字子羔愚者知不足而厚有餘家語記其足不履影啓蟄不殺方長不折執親之喪泣血三年未嘗見齒避難而行不徑不竇可以見其為人矣參也魯魯鈍也程子曰參也竟以魯得之又曰曾子之學誠篤而已聖門學者聰明才辨不為不多而卒傳其道乃質魯之人爾故學以誠實為貴也尹氏曰曾子之才魯故其學也確所以能深造乎道也師也辟辟婢亦反辟便辟也謂習於容止少誠實也由也唁唁五旦反唁粗俗也傳稱唁者謂俗論也楊氏曰四者性之偏語之使知自勵也吳氏曰此章之首脫子曰二字或疑下章子曰當在此章之首而通為一章子曰回也其庶乎屢空庶近也言近道也屢空數至空匱也不以貧窶動心而求富故屢至於空匱也言其近道又能安貧也賜不受命而貨殖焉億則屢中中去聲命謂天命貨殖貨財生殖也億意度也言子貢不如顔子之安貧樂道然其才識之明亦能料事而多中也程子曰子貢之貨殖非若後人之豐財但此心未忘耳然此亦子貢少時事至聞性與天道則不為此矣范氏曰屢空者簞食瓢飲屢絶而不改其樂也天下之物豈有可動其中者哉貧富在天而子貢以貨殖為心則是不能安受天命矣其言而多中者億而已非窮理樂天者也夫子嘗曰賜不幸言而中是使賜多言也聖人之不貴言也如是子張問善人之道子曰不踐迹亦不入於室善人質美而未學者也程子曰踐迹如言循途守轍善人雖不必踐舊迹而自不為惡然亦不能入聖人之室也張子曰善人欲仁而未志於學者也欲仁故雖不踐成法亦不蹈於惡有諸己也由不學故無自而入聖人之室也子曰論篤是與君子者乎色莊者乎與加字言但以其言論篤實而與之則未知其為君子者乎為色莊者乎言不可以言貌取人也子路問聞斯行諸子曰有父兄在如之何其聞斯行之冉有問聞斯行諸子曰聞斯行之公西華曰由也問聞斯行諸子曰有父兄在求也問聞斯行諸子曰聞斯行之赤也惑敢問子曰求也退故進之由也兼人故退之兼人謂勝人也張敬夫曰聞義固當勇為然有父兄在則有不可得而專者若不稟命而行則反傷於義矣子路有聞未之能行惟恐有聞則於所當為不患其不能為矣特患為之之意或過而於所當稟命者有闕耳若冉求之資稟失之弱不患其不稟命也患其於所當為者逡巡畏縮而為之不勇耳聖人一進之一退之所以約之於義理之中而使之無過不及之患也子畏於匡顔淵後子曰吾以女為死矣曰子在回何敢死女音汝後謂相失在後何敢死謂不赴鬭而必死也胡氏曰先王之制民生於三事之如一惟其所在則致死焉况顔淵之於孔子恩義兼盡又非他人之為師弟子者而已即夫子不幸而遇難回必捐生以赴之矣捐生以赴之幸而不死則必上告天子下告方伯請討以復讎不但已也夫子而在則回何為而不愛其死以犯匡人之鋒乎季子然問仲由冉求可謂大臣與與平聲子然季氏子弟自多其家得臣二子故問之子曰吾以子為異之問曾由與求之問異非常也曾猶乃也輕二子以抑季然也所謂大臣者以道事君不可則止以道事君者不從君之欲不可則止者必行已之志今由與求也可謂具臣矣具臣謂備臣數而已曰然則從之者與與平聲意二子既非大臣則從季氏之所為而已子曰弒父與君亦不從也言二子雖不足於大臣之道然君臣之義則聞之熟矣弒逆大故必不從之蓋深許二子以死難不可奪之節而又以陰折季氏不臣之心也尹氏曰季氏專權僭竊二子仕其家而不能正也知其不可而不能止也可謂具臣矣是時季氏已有無君之心故自多其得人意其可使從己也故曰弒父與君亦不從也其庶乎二子可免矣子路使子羔為費宰子路為季氏宰而舉之也子曰賊夫人之子夫音扶下同賊害也言子羔質美而未學遽使治民適以害之子路曰有民人焉有社稷焉何必讀書然後為學言治民事神皆所以為學子曰是故惡夫佞者惡去聲治民事神固學者事然必學之已成然後可仕以行其學若初未嘗學而使之即仕以為學其不至於慢神而虐民者幾希矣子路之言非其本意但理屈詞窮而取辦於口以禦人耳故夫子不斥其非而特惡其佞也范氏曰古者學而後入政未聞以政學者也蓋道之本在於修身而後及於治人其說具於方冊讀而知之然後能行何可以不讀書也子路乃欲使子羔以政為學失先後本末之序矣不知其過而以口給禦人故夫子惡其佞也子路曾晳冉有公西華侍坐坐才卧反晳曾參父名㸃子曰以吾一日長乎爾毋吾以也長上聲言我雖年少長於女然女勿以我長而難言蓋誘之盡言以觀其志而聖人和氣謙德於此亦可見矣居則曰不吾知也如或知爾則何以哉言女平居則言人不知我如或有人知女則女將何以為用也子路率爾而對曰千乘之國攝乎大國之閒加之以師旅因之以饑饉由也為之比及三年可使有勇且知方也夫子哂之乘去聲饑音機饉音僅比必二反下同哂詩忍反率爾輕遽之貌攝管束也二千五百人為師五百人為旅因仍也榖不熟曰饑菜不熟曰饉方向也謂向義也民向義則能親其上死其長矣哂微笑也求爾何如對曰方六七十如五六十求也為之比及三年可使足民如其禮樂以俟君子求爾何如孔子問也下放此方六七十里小國也如猶或也五六十里則又小矣足富足也俟君子言非己所能冉有謙退又以子路見哂故其詞益遜赤爾何如對曰非曰能之願學焉宗廟之事如㑹同端章甫願為小相焉相去聲公西華志於禮樂之事嫌以君子自居故將言己志而先為遜詞言未能而願學也宗廟之事謂祭祀諸侯時見曰㑹衆俯曰同端𤣥端服章甫禮冠相贊君之禮者言小亦謙辭㸃爾何如鼓瑟希鏗爾舍瑟而作對曰異乎三子者之撰子曰何傷乎亦各言其志也曰莫春者春服既成冠者五六人童子六七人浴乎沂風乎舞雩詠而歸夫子喟然歎曰吾與㸃也鏗苦耕反舍上聲撰士免反莫冠並去聲沂漁依反雩音于四子侍坐以齒為序則㸃當次對以方鼓瑟故夫子先問求赤而後及㸃也希閒歇也作起也撰具也莫春和煦之時春服單祫之衣浴盥濯也今上已祓除是也沂水名在魯城南地志以為有溫泉焉理或然也風乘凉也舞雩祭天禱雨之處有壇墠樹木也詠歌也曾㸃之學蓋有以見夫人欲盡處天理流行隨處充滿無少缺闕故其動靜之際從容如此而其言志則又不過即其所居之位樂其日用之常初無舍己為人之意而其胸次悠然直與天地萬物上下同流各得其所之妙隱然自見於言外視三子之規規於事為之末者其氣象不侔矣故夫子歎息而深許之而門人記其本末獨加詳焉蓋亦有以識此矣三子者出曾晳後曾晳曰夫三子者之言何如子曰亦各言其志也已矣夫音扶曰夫子何哂由也㸃以子路之志乃所優為而夫子哂之故請其說曰為國以禮其言不讓是故哂之夫子蓋許其能特哂其不遜唯求則非邦也與安見方六七十如五六十而非邦也者與平聲下同曾㸃以冉求亦欲為國而不見哂故微問之而夫子之答無貶詞蓋亦許之唯赤則非邦也與宗廟㑹同非諸侯而何赤也為之小孰能為之大此亦曾晳問而夫子答也孰能為之大言無能出其右者亦許之之詞程子曰古之學者優柔厭飫有先後之序如子路冉有公西赤言志如此夫子許之亦以此自是實事後之學者好高如人游心千里之外然自身却只在此又曰孔子與㸃蓋與聖人之志同便是堯舜氣象也誠異三子者之撰特行有不掩焉耳此所謂狂也子路等所見者小子路只為不達為國以禮道理是以哂之若達却便是這氣象也又曰三子皆欲得國而治之故夫子不取曾㸃狂者也未必能為聖人之事而能知夫子之志故曰浴乎沂風乎舞雩詠而歸言樂而得其所也孔子之志在於老者安之朋友信之少者懷之使萬物莫不遂其性曾㸃知之故夫子喟然歎曰吾與㸃也又曰曾㸃漆雕開已見大意顏淵第十二凡二十四章顔淵問仁子曰克己復禮為仁一日克己復禮天下歸仁焉為仁由己而由人乎哉仁者本心之全德克勝也已謂身之私欲也復反也禮者天理之節文也為仁者所以全其心之德也蓋心之全德莫非天理而亦不能不壞於人欲故為仁者必有以勝私欲而復於禮則事皆天理而本心之德復全於我矣歸猶與也又言一日克己復禮則天下之人皆與其仁極言其效之甚速而至大也又言為仁由己而非他人所能預又見其機之在我而無難也日日克之不以為難則私欲淨盡天理流行而仁不可勝用矣程子曰非禮處便是私意既是私意如何得仁須是克盡己私皆歸於禮方始是仁又曰克己復禮則事事皆仁故曰天下歸仁謝氏曰克己須從性偏難克處克將去顔淵曰請問其目子曰非禮勿視非禮勿聽非禮勿言非禮勿動顔淵曰回雖不敏請事斯語矣目條件也顔淵聞夫子之言則於天理人欲之際已判然矣故不復有所疑問而直請其條目也非禮者己之私也勿者禁止之辭是人心之所以為主而勝私復禮之機也私勝則動容周旋無不中禮而日用之閒莫非天理之流行矣事如事事之事請事斯語顔子默識其理又自知其力有以勝之故直以為己任而不疑也程子曰顔子問克己復禮之目子曰非禮勿視非禮勿聽非禮勿言非禮勿動四者身之用也由乎中而應乎外制於外所以養其中也顔淵事斯語所以進於聖人後之學聖人者宜服膺而勿失也因針以自警其視針曰心兮本虛應物無迹操之有要視為之則蔽交於前其中則遷制之於外以安其內克己復禮久而誠矣其聽針曰人有秉彝本乎天性知誘物化遂亡其正卓彼先覺知止有定間邪存誠非禮勿聽其言針曰人心之動因言以宣發禁躁妄內斯靜專矧是樞機興戎出好吉凶榮辱惟其所召傷易則誕傷煩則支己肆物忤出悖來違非法不道欽哉訓辭其動針曰哲人知幾誠之於思志士勵行守之於為順理則裕從欲惟危造次克念戰兢自持習與性成聖賢同歸愚按此章問答乃傳授心法切要之言非至明不能察其機非至健不能致其決故惟顔子得聞之而凡學者亦不可以不勉也程子之針發明親切學者尤宜深玩仲弓問仁子曰出門如見大賓使民如承大祭己所不欲勿施於人在邦無怨在家無怨仲弓曰雍雖不敏請事斯語矣敬以持己恕以及物則私意無所容而心德全矣內外無怨亦以其效言之使以自考也程子曰孔子言仁只說出門如見大賓使民如承大祭看其氣象便須心廣體胖動容周旋中禮唯謹獨便是守之之法或問出門使民之時如此可也未出門使民之時如之何曰此儼若思時也有諸中而後見於外觀其出門使民之時其敬如此則前乎此者敬可知矣非因出門使民然後有此敬也愚按克己復禮乾道也主敬行恕坤道也顔冉之學其高下淺深於此可見然學者誠能從事於敬恕之閒而有得焉亦將無己之可克矣司馬牛問仁司馬牛孔子弟子名犁向魋之弟子曰仁者其言也訒訒音刃訒忍也難也仁者心存而不放故其言若有所忍而不易發蓋其德之一端也夫子以牛多言而躁故告之以此使其於此而謹之則所以為仁之方不外是矣曰其言也訒斯謂之仁矣乎子曰為之難言之得無訒乎牛意仁道至大不但如夫子之所言故夫子又告之以此蓋心常存故事不苟事不苟故其言自有不得而易者非強閉之而不出也楊氏曰觀此及下章再問之語牛之易其言可知程子曰雖為司馬牛多言故及此然聖人之言亦止此為是愚謂牛之為人如此若不告之以其病之所切而泛以為仁之大槩語之則以彼之躁必不能深思以去其病而終無自以入德矣故其告之如此蓋聖人之言雖有高下大小之不同然其切於學者之身而皆為入德之要則又初不異也讀者其致思焉司馬牛問君子子曰君子不憂不懼向魋作亂牛常憂懼故夫子告之以此曰不憂不懼斯謂之君子矣乎子曰內省不疚夫何憂何懼夫音扶牛之再問猶前章之意故復告之以此疚病也言由其平日所為無愧於心故能內省不疚而自無憂懼未可遽以為易而忽之也朝氏曰不憂不懼由乎德全而無疵故無入而不自得非實有憂懼而强排遣之也司馬牛憂曰人皆有兄弟我獨亡牛有兄弟而云然者憂其為亂而將死也子夏曰商聞之矣蓋聞之夫子死生有命富貴在天命稟於有生之初非今所能移天莫之為而為非我所能必但當順受而已君子敬而無失與人恭而有禮四海之內皆兄弟也君子何患乎無兄弟也既安於命又當修其在己者故又言苟能持己以敬而不閒斷接人以恭而有節文則天下之人皆愛敬之如兄弟矣蓋子夏欲以寬牛之憂故為是不得已之辭讀者不以辭害意可也胡氏曰子夏四海皆兄弟之言特以廣司馬牛之意意圓而語滯者也唯聖人則無此病矣且子夏知此而以哭子喪明則以蔽於愛而昧於理是以不能踐其言爾子張問明子曰浸潤之譖膚受之訴不行焉可謂明也已矣浸潤之譖膚受之訴不行焉可謂遠也已矣譖莊蔭反訴蘇路反浸潤如水之浸灌滋潤漸漬而不驟也譖毁人之行也膚受謂肌膚所受利害切身如易所謂剝牀以膚切近災者也訴訴已之寃也毁人者漸漬而不驟則聽者不覺其入而信之深矣訴寃者急迫而切身則聽者不及致詳而發之暴矣二者難察而能察之則可見其心之明而不蔽於近矣此亦必因子張之失而告之故其辭繁而不殺以致丁寧之意云楊氏曰驟而語之與利害不切於身者不行焉有不待明者能之也故浸潤之譖膚受之訴不行然後謂之明而又謂之遠遠則明之至也書曰視遠惟明子貢問政子曰足食足兵民信之矣言倉廩實而武備修然後教化行而民信於我不離叛也子貢曰必不得已而去於斯三者何先曰去兵去上聲下同言食足而信孚則無兵而守固矣子貢曰必不得已而去於斯二者何先曰去食自古皆有死民無信不立民無食必死然死者人之所必不免無信則雖生而無以自立不若死之為安故寧死而不失信於民使民亦寧死而不失信於我也程子曰孔門弟子善問直窮到底如此章者非子貢不能問非聖人不能答也愚謂以人情而言則兵食足而後吾之信可以孚於民以民德而言則信本人之所固有非兵食所得而先也是以為政者當身率其民而以死守之不以危急而可棄也棘子成曰君子質而已矣何以文為棘子成衛大夫疾時人文勝故為此言子貢曰惜乎夫子之說君子也駟不及舌言子成之言乃君子之意然言出於舌則駟馬不能追之又惜其失言也文猶質也質猶文也虎豹之鞟猶犬羊之鞟鞟其郭反鞟皮去毛者也言文質等耳不可相無若必盡去其文而獨存其質則君子小人無以辨矣夫棘子成矯當時之弊固失之過而子貢矯子成之弊又無本末輕重之差胥失之矣哀公問於有若曰年饑用不足如之何稱有若者君臣之辭用謂國用公意蓋欲加賦以足用也有若對曰盍徹乎徹通也均也周制一夫受田百畝而與同溝共井之人通力合作計畝均收大率民得其九公取其一故謂之徹魯自宣公稅畝又逐畝什取其一則為什而取二矣故有若請但專行徹法欲公節用以厚民也曰二吾猶不足如之何其徹也二即所謂什二也公以有若不喻其旨故言此以示加賦之意對曰百姓足君孰與不足百姓不足君孰與足民富則君不至獨貧民貧則君不能獨富有若深言君民一體之意以止公之厚斂為人上者所宜深念也楊氏曰仁政必自經界始經界正而後井地均穀祿平而軍國之需皆量是以為出焉故一徹而百度舉矣上下寧憂不足乎以二猶不足而教之徹疑若迂矣然什一天下之中正多則桀寡則貉不可改也後世不究其本而唯末之圖故征斂無藝費出無經而上下困矣又惡知盍徹之當務而不為迂乎子張問崇德辨惑子曰主忠信徙義崇德也主忠信則本立徙義則日新愛之欲其生惡之欲其死既欲其生又欲其死是惑也惡去聲愛惡人之常情也然人之生死有命非可得而欲也以愛惡而欲其生死則惑矣既欲其生又欲其死則惑之甚也誠不以富亦祗以異此詩小雅我行其野之詞也舊說夫子引之以明欲其生死者不能使之生死如此詩所言不足以致富而適足以取異也程子曰此錯簡當在第十六篇齊景公有馬千駟之下因此下文亦有齊景公字而誤也楊氏曰堂堂乎張也難與並為仁矣則非誠善補過不蔽於私者故告之如此齊景公問政於孔子齊景公名杵臼魯昭公末年孔子適齊孔子對曰君君臣臣父父子子此人道之大經政事之根本也是時景公失政而大夫陳氏厚施於國景公又多內嬖而不立太子其君臣父子之閒皆失其道故夫子告之以此公曰善哉信如君不君臣不臣父不父子不子雖有粟吾得而食諸景公善孔子之言而不能用其後果以繼嗣不定啓陳氏弒君纂國之禍楊氏曰君之所以君臣之所以臣父之所以父子之所以子是必有道矣景公知善夫子之言而不知反求其所以然蓋悅而不繹者齊之所以卒於亂也子曰片言可以折獄者其由也與折之舌反與平聲片言半言折斷也子路忠信明決故言出而人信服之不待其辭之畢也子路無宿諾宿留也猶宿怨之宿急於踐言不留其諾也記者因夫子之言而記此以見子路之所以取信於人者由其養之有素也尹氏曰小邾射以句繹奔魯曰使季路要我吾無盟矣千乘之國不信其盟而信子路之一言其見信於人可知矣一言而折獄者信在言前人自信之故也不留諾所以全其信也子曰聽訟吾猶人也必也使無訟乎范氏曰聽訟者治其末塞其流也正其本清其源則無訟矣楊氏曰子路片言可以折獄而不知以禮遜為國則未能使民無訟者也故又記孔子之言以見聖人不以聽訟為難而以使民無訟為貴子張問政子曰居之無倦行之以忠居謂存諸心無倦則始終如一行謂發於事以忠則表裏如一程子曰子張少仁無誠心愛民則必倦而不盡心故告之以此子曰博學於文約之以禮亦可以弗畔矣夫重出子曰君子成人之美不成人之惡小人反是成者誘掖獎勸以成其事也君子小人所存既有厚薄之殊而其所好又有善惡之異故其用心不同如此季康子問政於孔子孔子對曰政者正也子帥以正孰敢不正范氏曰未有已不正而能正人者胡氏曰魯自中葉政由大夫家臣效尤據邑背叛不正甚矣故孔子以是告之欲康子以正自克而改三家之故惜乎康子之溺於利欲而不能也季康子患盜問於孔子孔子對曰苟子之不欲雖賞之不竊言子不貪欲則雖賞民使之為盜民亦知恥而不竊胡氏曰季氏竊柄康子奪嫡民之為盜固其所也盍亦反其本耶孔子以不欲啓之其旨深矣奪嫡事見春秋傳季康子問政於孔子曰如殺無道以就有道何如孔子對曰子為政焉用殺子欲善而民善矣君子之德風小人之德草草上之風必偃焉於䖍反為政者民所視效何以殺為欲善則民善矣上一作尚加也偃仆也尹氏曰殺之為言豈為人上之語哉以身教者從以言教者訟而况於殺乎子張問士何如斯可謂之達矣達者德孚於人而行無不得之謂子曰何哉爾所謂達者子張務外夫子蓋已知其發問之意故反詰之將以發其病而藥之也子張對曰在邦必聞在家必聞言名譽著聞也子曰是聞也非達也聞與達相似而不同乃誠僞之所以分學者不可不審也故夫子既明辨之下文又詳言之夫達也者質直而好義察言而觀色慮以下人在邦必達在家必達夫音扶下同好下皆去聲內主忠信而所行合宜審於接物而卑以自牧皆自修於內不求人知之事然德修於己而人信之則所行自無窒礙矣夫聞也者色取仁而行違居之不疑在邦必聞在家必聞行去聲善其顔色以取於仁而行實背之又自以為是而無所忌憚此不務實而專務求名者故虛譽雖隆而實德則病矣程子曰學者須是務實不要近名有意近名大本已失更學何事為名而學則是僞也今之學者大抵為名為名與為利雖清濁不同然其利心則一也尹氏曰子張之學病在乎不務實故孔子告之皆篤實之事充乎內而發乎外者也當時門人親受聖人之教而差失有如此者况後世乎樊遲從遊於舞雩之下曰敢問崇德修慝辨惑慝吐得反胡氏曰慝之字從心從匿蓋惡之匿於心者修者治而去之子曰善哉問善其切於為己先事後得非崇德與攻其惡無攻人之惡非修慝與一朝之忿忘其身以及其親非惑與與平聲先事後得猶言先難後獲也為所當為而不計其功則德日積而不自知矣專於治己而不責人則己之惡無所匿矣知一朝之忿為甚微而禍及其親為甚大則有以辨惑而懲其忿矣樊遲粗鄙近利故告之以此三者皆所以救其失也范氏曰先事後得上義而下利也人惟有欲利之心故德不崇惟不自省己過而知人之過故慝不修感物而易動者莫如忿忘其身以及其親惑之甚者也惑之甚者必起於細微能辨之於早則不至於大惑矣故懲忿所以辨惑也樊遲問仁子曰愛人問知子曰知人上知字去聲下同愛人仁之施知人知之務樊遲未達曾氏曰遲之意蓋以愛欲其周而知有所擇故疑二者之相悖爾子曰舉直錯諸枉能使枉者直舉直錯枉者知也使枉者直則仁矣如此則二者不惟不相悖而反相為用矣樊遲退見子夏曰鄉也吾見於夫子而問知子曰舉直錯諸枉能使枉者直何謂也鄉去聲見賢遍反遲以夫子之言專為知者之事又未達所以能使枉者直之理子夏曰富哉言乎歎其所包者廣不止言知舜有天下選於衆舉臯陶不仁者遠矣湯有天下選於衆舉伊尹不仁者遠矣選息戀反陶音遙遠如字伊尹湯之相也不仁者遠言人皆化而為仁不見有不仁者若其遠去爾所謂使枉者直也子夏蓋有以知夫子之兼仁知而言矣程子曰聖人之語因人而變化雖若有淺近者而其包含無所不盡觀於此章可見矣非若他人之言語近則遺遠語遠則不知近也尹氏曰學者之問也不獨欲聞其說又必欲知其方不獨欲知其方又必欲為其事如樊遲之問仁知也夫子告之盡矣樊遲未達故又問焉而猶未知其何以為之也及退而問諸子夏然後有以知之使其未喻則必將復問矣既問於師又辨諸友當時學者之務實也如是子貢問友子曰忠告而善道之不可則止毋自辱焉告工毒反道去聲友所以輔仁故盡其心以告之善其說以道之然以義合者也故不可則止若以數而見疏則自辱矣曾子曰君子以文㑹友以友輔仁講學以㑹友則道益明取善以輔仁則德日進論語卷六欽定四庫全書論語卷七宋朱子集注子路第十三凡三十章子路問政子曰先之勞之勞如字蘇氏曰凡民之行以身先之則不令而行凡民之事以身勞之則雖勤不怨請益曰無倦無古本作毋胡氏曰勇者喜於有為而不能持久故以此告之程子曰子路問政孔子既告之矣及請益則曰無倦而已未嘗復有所告姑使之深思也仲弓為季氏宰問政子曰先有司赦小過舉賢才有司衆職也宰兼衆職然事必先之於彼而後考其成功則已不勞而事畢舉矣過失誤也大者於事或有所害不得不懲小者赦之則刑不濫而人心悅矣賢有德者才有能者舉而用之則有司皆得其人而政益修矣曰焉知賢才而舉之曰舉爾所知爾所不知人其舍諸焉於䖍反舍上聲仲弓慮無以盡知一時之賢才故孔子告之以此程子曰人各親其親然後不獨親其親仲弓曰焉知賢才而舉之子曰舉爾所知爾所不知人其舍諸便見仲弓與聖人用心之大小推此義則一心可以興邦一心可以喪邦只在公私之間爾范氏曰不先有司則君行臣職矣不赦小過則下無全人矣不舉賢才則百職廢矣失此三者不可以為季氏宰况天下乎子路曰衛君待子而為政子將奚先衛君謂出公輒也是時魯哀公之十年孔子自楚反乎衛子曰必也正名乎是時出公不父其父而禰其祖名實紊矣故孔子以正名為先謝氏曰正名雖為衛君而言然為政之道皆當以此為先子路曰有是哉子之迂也奚其正迂謂逺於事情言非今日之急務也子曰野哉由也君子於其所不知蓋闕如也野謂鄙俗責其不能闕疑而率爾妄對也名不正則言不順言不順則事不成楊氏曰名不當其實則言不順言不順則無以考實而事不成事不成則禮樂不興禮樂不興則刑罰不中刑罰不中則民無所措手足中去聲范氏曰事得其序之謂禮物得其和之謂樂事不成則無序而不和故禮樂不興禮樂不興則施之政事皆失其道故刑罰不中故君子名之必可言也言之必可行也君子於其言無所苟而已矣程子曰名實相須一事苟則其餘皆苟矣胡氏曰衛世子蒯聵恥其母南子之淫亂欲殺之不果而出奔靈公欲立公子郢郢辭公卒夫人立之又辭乃立蒯聵之子輒以拒蒯聵夫蒯聵欲殺母得罪於父而輒據國以拒父皆無父之人也其不可有國也明矣夫子為政而以正名為先必將具其事之本末告諸天王請於方伯命公子郢而立之則人倫正天理得名正言順而事成矣夫子告之之詳如此而子路終不喻也故事輒不去卒死其難徒知食焉不避其難之為義而不知食輒之食為非義也樊遲請學稼子曰吾不如老農請學為圃曰吾不如老圃種五穀曰稼種蔬菜曰圃樊遲出子曰小人哉樊須也小人謂細民孟子所謂小人之事者也上好禮則民莫敢不敬上好義則民莫敢不服上好信則民莫敢不用情夫如是則四方之民襁負其子而至矣焉用稼好去聲夫音扶襁居丈反焉於䖍反禮義信大人之事也好義則事合宜情誠實也敬服用情蓋各以其類而應也襁織縷為之以約小兒於背者楊氏曰樊遲遊聖人之門而問稼圃志則陋矣辭而闢之可也待其出而後言其非何也蓋於其問也自謂農圃之不如則拒之者至矣須之學疑不及此而不能問不能以三隅反矣故不復及其既出則懼其終不喻也求老農老圃而學焉則其失愈遠矣故復言之使知前所言者意有在也子曰誦詩三百授之以政不達使於四方不能專對雖多亦奚以為使去聲專獨也詩本人情該物理可以驗風俗之盛衰見政治之得失其言溫厚和平長於風諭故誦之者必達於政而能言也程子曰窮經將以致用也世之誦詩者果能從政而專對乎然則其所學者章句之末耳此學者之大患也子曰其身正不令而行其身不正雖令不從子曰魯衛之政兄弟也魯周公之後衛康叔之後本兄弟之國而是時衰亂政亦相似故孔子歎之子謂衛公子荆善居室始有曰苟合矣少有曰苟完矣富有曰苟美矣公子荆衛大夫苟聊且粗略之意合聚也完備也言其循序而有節不以欲速盡美纍其心楊氏曰務為全美則纍物而驕吝之心生公子荆皆曰苟而已則不以外物為心其欲易足故也子適衛冉有僕僕御車也子曰庶矣哉庶衆也冉有曰既庶矣又何加焉曰富之庶而不富則民生不遂故制田里薄賦斂以富之曰既富矣又何加焉曰教之富而不教則近於禽獸故必立學校明禮義以教之胡氏曰天生斯民立之司牧而寄以三事然自三代之後能舉此職者百無一二漢之文明唐之太宗亦云庶且富矣西京之教無聞焉明帝尊師重傅臨雍拜老宗戚子弟莫不受學唐太宗大召名儒增廣生員教亦至矣然而未知所以教也三代之教天子公卿躬行於上言行政事皆可師法彼二君者其能然乎子曰苟有用我者期月而已可也三年有成期月謂周一嵗之月也可者僅辭言綱紀布也有成治功成也尹氏曰孔子歎當時莫能用己也故云然愚按史記此蓋為衛靈公不能用而發子曰善人為邦百年亦可以勝殘去殺矣誠哉是言也勝平聲去上聲為邦百年言相繼而久也勝殘化殘暴之人使不為惡也去殺謂民化於善可以不用刑殺也蓋古有是言而夫子稱之程子曰漢自髙惠至於文景黎民醇厚幾致刑揩庶乎其近之矣尹民曰勝殘去殺不為惡而已善人之功如是若夫聖人則不待百年其化亦不止此子曰如有王者必世而後仁王者謂聖人受命而興也三十年為一世仁謂教化浹也程子曰周自文武至於成王而後禮樂興即其效也或問三年必世遲速不同何也程子曰三年有成謂法度紀綱有成而化行也漸民以仁摩民以義使之浹於肌膚淪於骨髓而禮樂可興所謂仁也此非積久何以能致子曰苟正其身矣於從政乎何有不能正其身如正人何冉子退朝子曰何晏也對曰有政子曰其事也如有政雖不吾以吾其與聞之朝音潮與去聲冉有時為季氏宰朝季氏之私朝也晏晚也政國政事家事以用也禮大夫雖不治事猶得與聞國政是時季氏專魯其於國政蓋有不與同列議於公朝而獨與家臣謀於私室者故夫子為不知者而言此必季氏之家事耳若是國政我嘗為大夫雖不見用猶當與聞今既不聞則是非國政也語意與魏徴獻陵之對略相似其所以正名分抑季氏而教冉有之意深矣定公問一言而可以興邦有諸孔子對曰言不可以若是其幾也幾期也詩曰如幾如式言一言之間未可以如此而必期其效人之言曰為君難為臣不易易去聲當時有此言也如知為君之難也不幾乎一言而興邦乎因此言而知為君之難則必戰戰兢兢臨深履薄而無一事之敢忽然則此言也豈不可以必期於興邦乎為定公言故不及臣也曰一言而喪邦有諸孔子對曰言不可以若是其幾也人之言曰豫無樂乎為君唯其言而莫豫違也喪去聲下同樂音洛言他無所樂惟樂此耳如其善而莫之違也不亦善乎如不善而莫之違也不幾乎一言而喪邦乎范氏曰如不善而莫之違則忠言不至於耳君日驕而臣日諂未有不喪邦者也謝氏曰知為君之難則必敬謹以持之惟其言而莫豫違則讒諂面諛之人至矣邦未必遽興喪也而興喪之源分於此然此非識微之君子何足以知之葉公問政音義並見第七篇子曰近者說逺者來說音悅被其澤則說聞其風則來然必近者說而後逺者來也子夏為莒父宰問政子曰無欲速無見小利欲速則不達見小利則大事不成父音甫莒父魯邑名欲事之速成則急遽無序而反不達見小者之為利則所就者小而所失者大矣程子曰子張問政子曰居之無倦行之以忠子夏問政子曰無欲速無見小利子張常過髙而未仁子夏之病常在近小故各以切己之事告之葉公語孔子曰吾黨有直躬者其父攘羊而子證之語去聲直躬直身而行者有因而盜曰攘孔子曰吾黨之直者異於是父為子隱子為父隱直在其中矣為去聲父子相隱天理人情之至也故不求為直而直在其中謝氏曰順理為直父不為子隱子不為父隱於理順耶瞽䏂殺人舜竊負而逃遵海濱而處當是時愛親之心勝其於直不直何暇計哉樊遲問仁子曰居處恭執事敬與人忠雖之夷狄不可棄也恭主容敬主事恭見於外敬主乎中之夷狄不可棄勉其固守而勿失也程子曰此是徹上徹下語聖人初無二語也充之則睟面盎背推而達之則篤恭而天下平矣胡氏曰樊遲問仁者三此最先先難次之愛人其最後乎子貢問曰何如斯可謂之士矣子曰行已有恥使於四方不辱君命可謂士矣使去聲此其志有所不為而其材足以有為者也子貢能言故以使事告之蓋為使之難不獨貴於能言而已曰敢問其次曰宗族稱孝焉鄉黨稱弟焉弟去聲此本立而材不足者故為其次曰敢問其次曰言必信行必果硜硜然小人哉抑亦可以為次矣行去聲硜苦耕反果必行也硜小石之堅確者小人言其識量之淺狹也此其本末皆無足觀然亦不害其為自守也故聖人猶有取焉下此則市井之人不復可為士矣曰今之從政者何如子曰噫斗筲之人何足算也筲所交反算亦作算悉亂反今之從政者蓋如魯三家之屬噫心不平聲斗量名容十升筲竹器容斗二升斗筲之人言鄙細也算數也子貢之問每下故夫子以是警之程子曰子貢之意蓋欲為皎皎之行聞於人者夫子告之皆篤實自得之事子曰不得中行而與之必也狂狷乎狂者進取狷者有所不為也狷音絹行道也狂者志極高而行不掩狷者知未及而守有餘蓋聖人本欲得中道之人而教之然既不可得而徒得謹厚之人則未必能自振拔而有為也故不若得此狂狷之人猶可因其志節而激厲裁抑之以進於道非與其終於此而已也孟子曰孔子豈不欲中道哉不可必得故思其次也如琴張曽晳牧皮者孔子之所謂狂也其志嘐嘐然曰古之人古之人夷考其行而不掩焉者也狂者又不可得欲得不屑不潔之士而與之是狷也是又其次也子曰南人有言曰人而無恆不可以作巫醫善夫恆胡登反夫音扶南人南國之人恆常久也巫所以交鬼神醫所以寄生死故雖賤役而尤不可以無常孔子稱其言而善之不恆其德或承之羞此易恆卦九三爻辭承進也子曰不占而已矣復加子曰以别易文也其義未詳楊氏曰君子於易苟玩其占則知無常之取羞矣其為無常也蓋亦不占而已矣意亦略通子曰君子和而不同小人同而不和和者無乖戾之心同者有阿比之意尹氏曰君子尚義故有不同小人尚利安得而和子貢問曰鄉人皆好之何如子曰未可也鄉人皆惡之何如子曰未可也不如鄉人之善者好之其不善者惡之好惡並去聲一鄉之人宜有公論矣然其間亦各以類自為好惡也故善者好之而惡者不惡則必其有苟合之行惡者惡之而善者不好則必其無可好之實子曰君子易事而難說也說之不以道不說也及其使人也器之小人難事而易說也說之雖不以道說也及其使人也求備焉易去聲說音悅器之謂隨其材器而使之也君子之心公而恕小人之心私而刻天理人欲之間每相反而已矣子曰君子泰而不驕小人驕而不泰君子循理故安舒而不矜肆小人逞欲故反是子曰剛毅木訥近仁程子曰木者質朴訥者遲鈍四者質之近乎仁者也楊氏曰剛毅則不屈於物欲木訥則不至於外馳故近仁子路問曰何如斯可謂之士矣子曰切切偲偲怡怡如也可謂士矣朋友切切偲偲兄弟怡怡胡氏曰切切懇到也偲偲詳勉也怡怡和悅也皆子路所不足故告之又恐其混於所施則兄弟有賊恩之禍朋友有善柔之損故又别而言之子曰善人教民七年亦可以即戎矣教民者教之以孝弟忠信之行務農講武之法即就也戎兵也民知親其上死其長故可以即戎程子曰七年云者聖人度其時可矣如云期月三年百年一世大國五年小國七年之類皆當思其作為如何乃有益子曰以不教民戰是謂棄之以用也言用不教之民以戰必有敗亡之禍是棄其民也憲問第十四胡氏曰此篇疑原憲所記凡四十七章憲問恥子曰邦有道穀邦無道穀恥也憲原思名穀祿也邦有道不能有為邦無道不能獨善而但知食祿皆可恥也憲之狷介其於邦無道榖之可恥固知之矣至於邦有道穀之可恥則未必知也故夫子因其問而并言之以廣其志使知所以自勉而進於有為也克伐怨欲不行焉可以為仁矣此亦原憲以其所能而問也克好勝伐自矜怨忿恨欲貪欲子曰可以為難矣仁則吾不知也有是四者而能制之使不得行可謂難矣仁則天理渾然自無四者之纍不行不足以言之也程子曰人而無克伐怨欲惟仁者能之有之而能制其情使不行斯亦難能也謂之仁則未也此聖人開示之深惜乎憲之不能再問也或曰四者不行固不得為仁矣然亦豈非所謂克己之事求仁之方乎曰克去己私以復乎禮則私欲不留而天理之本然者得矣若但制而不行則是未有拔去病根之意而容其潛藏隱伏於胸中也豈克己求仁之謂哉學者察於二者之間則其所以求仁之功益親切而無滲漏矣子曰士而懷居不足以為士矣居謂意所便安處也子曰邦有道危言危行邦無道危行言孫行孫皆去聲危高峻也孫卑順也尹氏曰君子之持身不可變也至於言則有時而不敢盡以避禍也然則為國者使士言孫豈不殆哉子曰有德者必有言有言者不必有德仁者必有勇勇者不必有仁有德者和順積中英華發外能言者或便佞口給而已仁者心無私纍見義必為勇者或血氣之强而已尹氏曰有德者必有言徒能言者未必有德也仁者志必勇徒能勇者未必有仁也南宫適問於孔子曰羿善射奡蕩舟俱不得其死然禹稷躬稼而有天下夫子不答南宫適出子曰君子哉若人尚德哉若人適古活反羿音詣奡五報反蕩土浪反南宫適即南容也羿有窮之君善射滅夏后相而篡其位其臣寒浞又殺羿而代之奡春秋傳作澆浞之子也力能陸地行舟後為夏后少康所誅禹平水土暨稷播種身親稼穡之事禹受舜禪而有天下稷之後至周武王亦有天下適之意蓋以羿奡比當世之有權力者而以禹稷比孔子也故孔子不答然適之言如此可謂君子之人而有尚德之心矣不可以不與故俟其出而贊美之子曰君子而不仁者有矣夫未有小人而仁者也夫音扶謝氏曰君子志於仁矣然毫忽之間心不在焉則未免為不仁也子曰愛之能勿勞乎忠焉能勿誨乎蘇氏曰愛而勿勞禽犢之愛也忠而勿誨婦寺之忠也愛而知勞之則其為愛也深矣忠而知誨之則其為忠也大矣子曰為命裨諶草創之世叔討論之行人子羽修飾之東里子産潤色之裨婢之反諶時林反裨諶以下四人皆鄭大夫草略也創造也謂造為草藁也世叔游吉也春秋傳作子太叔討尋究也論講議也行人掌使之官子羽公孫揮也修飾謂增損之東里地名子産所居也潤色謂加以文采也鄭國之為辭命必更此四賢之手而成詳審精密各盡所長是以應對諸侯鮮有敗事孔子言此蓋善之也或問子産子曰惠人也子産之政不專於寬然其心則一以愛人為主故孔子以為惠人蓋舉其重而言也問子西曰彼哉彼哉子西楚公子申能遜楚國立昭王而改紀其政亦賢大夫也然不能革其僭王之號昭王欲用孔子又沮止之其後卒召白公以致禍亂則其為人可知矣彼哉者外之之辭問管仲曰人也奪伯氏駢邑三百飯疏食沒齒無怨言人也猶言此人也伯氏齊大夫駢邑地名齒年也蓋桓公奪伯氏之邑以與管仲伯氏自知己罪而心服管仲之功故窮約以終身而無怨言荀卿所謂與之書社三百而富人莫之敢拒者即此事也或問管仲子産孰優曰管仲之德不勝其才子産之才不勝其德然於聖人之學則槩乎其未有聞也子曰貧而無怨難富而無驕易易去聲處貧難處富易人之常情然人當勉其難而不可忽其易也子曰孟公綽為趙魏老則優不可以為滕薛大夫公綽魯大夫趙魏晉卿之家老家臣之長大家勢重而無諸侯之事家老望尊而無官守之責優有餘也滕薛二國名大夫任國政者滕薛國小政繁大夫位高責重然則公綽蓋廉靜寡欲而短於才者也楊氏曰知之弗豫枉其才而用之則為棄人矣此君子所以患不知人也言此則孔子之用人可知矣子路問成人子曰若臧武仲之知公綽之不欲卞莊子之勇冉求之藝文之以禮樂亦可以為成人矣知去聲成人猶言全人武仲魯大夫名紇莊子魯卞邑大夫言兼此四子之長則知足以窮理廉足以養心勇足以力行藝足以泛應而又節之以禮和之以樂使德成於內而文見乎外則材全德備渾然不見一善成名之迹中正和樂粹然無復偏倚駁雜之蔽而其為人也亦成矣然亦之為言非其至者蓋就子路之所可及而語之也若論其至則非聖人之盡人道不足以語此曰今之成人者何必然見利思義見危授命久要不忘平生之言亦可以為成人矣復加曰字者既答而復言也授命言不愛其生持以與人也久要舊約也平生平日也有是忠信之實則雖其才知禮樂有所未備亦可以為成人之次也程子曰知之明信之篤行之果天下之達德也若孔子所謂成人亦不出此三者武仲知也公綽仁也卞莊子勇也冉求藝也須是合此四人之能文之以禮樂亦可以為成人矣然而論其大成則不止於此若今之成人有忠信而不及於禮樂則又其次者也又曰臧武仲之知非正也若文之以禮樂則無不正矣又曰語成人之名非聖人孰能之孟子曰唯聖人然後可以踐形如此方可以稱成人之名胡氏曰今之成人以下乃子路之言蓋不復聞斯行之之勇而有終身誦之之固矣未詳是否子問公叔文子於公明賈曰信乎夫子不言不笑不取乎公叔文子衛大失公孫枝也公明姓賈名亦衛人文子為人其詳不可知然必廉靜之士故當時以三者稱之公明賈對曰以告者過也夫子時然後言人不厭其言樂然後笑人不厭其笑義然後取人不厭其取子曰其然豈其然乎厭者苦其多而惡之之辭事適其可則人不厭而不覺其有是矣是以稱之或過而以為不言不笑不取也然此言也非禮義充溢於中得時措之宜者不能文子雖賢疑未及此但君子與人為善不欲正言其非也故曰其然豈其然乎蓋疑之也子曰臧武仲以防求為後於魯雖曰不要君吾不信也要平聲防地名武仲所封邑也要有挾而求也武仲得罪奔邾自邾如防使請立後而避邑以示若不得請則將據邑以叛是要君也范氏曰要君者無上罪之大者也武仲之邑受之於君得罪出奔則立後在君非己所得專也而據邑以請由其好智而不好學也楊氏曰武仲卑辭請後其跡非要君者而意實要之夫子之言亦春秋誅意之法也子曰晉文公譎而不正齊桓公正而不譎譎古穴反晉文公名重耳齊桓公名小白譎詭也二公皆諸侯盟主攘夷狄以尊周室者也雖其以力假仁心皆不正然桓公伐楚仗義執言不由詭道猶為彼善於此文公則伐衛以致楚而隂謀以取勝其譎甚矣二君他事亦多類此故夫子言比以發其隱子路曰桓公殺公子糾召忽死之管仲不死曰未仁乎糾居黝反召音邵按春秋傳齊襄公無道鮑叔牙奉公子小白奔莒及無知弒襄公管夷吾召忽奉公子糾奔魯魯人納之未克而小白入是為桓公使魯殺子糾而請管召召忽死之管仲請囚鮑叔牙言於桓公以為相子路疑管仲忘君事讎忍心害理不得為仁也子曰桓公九合諸侯不以兵車管仲之力也如其仁如其仁九春秋傳作糾督也古字通用不以兵車言不假威力也如其仁言誰如其仁者又再言以深許之蓋管仲雖未得為仁人而其利澤及人則有仁之功矣子貢曰管仲非仁者與桓公殺公子糾不能死又相之與平聲相去聲子貢意不死猶可相之則已甚矣子曰管仲相桓公霸諸侯一匡天下民到于今受其賜微管仲吾其被髮左衽矣被皮寄反衽而審反霸與伯同長也匡正也尊周室攘夷狄皆所以正天下也微無也衽衣襟也被髮左衽夷狄之俗也豈若匹夫匹婦之為諒也自經於溝瀆而莫之知也諒小信也經縊也莫之知人不知也後漢書引此文莫字上有人字程子曰桓公兄也子糾弟也仲私於所事輔之以爭國非義也桓公殺之雖過而糾之死實當仲始與之同謀遂與之同死可也知輔之爭為不義將自免以圖後功亦可也故聖人不責其死而稱其功若使桓弟而糾兄管仲所輔者正桓奪其國而殺之則管仲之與桓不可同世之讎也若計其後功而與其事桓聖人之言無乃害義之甚啓萬世反覆不忠之亂乎如唐之王圭魏徴不死建成之難而從大宗可謂害於義矣後雖有功何足贖哉愚謂管仲有功而無罪故聖人獨稱其功王魏先有罪而後有功則不以相掩可也公叔文子之臣大夫僎與文子同升諸公僎士免反臣家臣公公朝謂薦之與已同進為公朝之臣也子聞之曰可以為文矣文者順理而成章之謂諡法亦有所謂錫民爵位曰文者洪氏曰家臣之賤而引之使與己並有三善焉知人一也忘己二也事君三也子言衛靈公之無道也康子曰夫如是奚而不喪夫音扶喪去聲喪失位也孔子曰仲叔圉治賓客祝鮀治宗廟王孫賈治軍旅夫如是奚其喪仲叔圉即孔文子也三人皆衛臣雖未必賢而其才可用靈公用之又各當其才尹氏曰衛靈公之無道宜喪也而能用此三人猶足以保其國而况有道之君能用天下之賢才者乎詩曰無競維人四方其訓之子曰其言之不怍則為之也難大言不慙則無必為之志而不自度其能否矣欲踐其言豈不難哉陳成子弒簡公成子齊大夫名恆簡公齊君名壬事在春秋哀公十四年孔子沐浴而朝告於哀公曰陳恆弒其君請討之朝音潮是時孔子致仕居魯沐浴齊戒以告君重其事而不敢忽也臣弒其君人倫之大變天理所不容人人得而誅之况鄰國乎故夫子雖已告老而猶請哀公討之公曰告夫三子二告夫音扶三子三家也時政在三家哀公不得自專故使孔子告之孔子曰以吾從大夫之後不敢不告也君曰告夫三子者孔子出而自言如此意謂弒君之賊法所必討大夫謀國義所當告君乃不能自命三子而使我告之邪之三子告不可孔子曰以吾從大夫之後不敢不告也以君命往告而三子魯之强臣素有無君之心實與陳氏聲勢相倚故沮其謀而夫子復以此應之其所以警之者深矣程子曰左氏記孔子之言曰陳恆弒其君民之不豫者半以魯之衆加齊之半可克也此非孔子之言誠若此言是以力不以義也若孔子之志必將正名其罪上告天子下告方伯而率與國以討之至於所以勝齊者孔子之餘事也豈計魯人之衆寡哉當是時天下之亂極矣因是足以正之周室其復興乎魯之君臣終不從之可勝惜哉胡氏曰春秋之法弒君之賊人得而討之仲尼此舉先發後聞可也子路問事君子曰勿欺也而犯之犯謂犯顔諫爭范氏曰犯非子路之所難也而以不欺為難故夫子教以先勿欺而後犯也子曰君子上達小人下達君子循天理故日進乎高明小人徇人欲故日究乎汙下子曰古之學者為己今之學者為人為去聲程子曰為己欲得之於己也為人欲見知於人也程子曰古之學者為己其終至於成物今之學者為人其終至於喪己愚按聖賢論學者用心得失之際其說多矣然未有如此言之切而要者於此明辨而日省之則庶乎其不昧於所從矣蘧伯玉使人於孔子使去聲下同蘧伯玉衛大夫名瑗孔子居銜嘗主於其家既而反魯故伯玉使人來也孔子與之坐而問焉曰夫子何為對曰夫子欲寡其過而未能也使者出子曰使乎使乎與之坐敬其主以及其使也夫子指伯玉也言其但欲寡過而猶未能則其省身克己常若不及之意可見矣使者之言愈自卑約而其主之賢益彰亦可謂深知君子之心而善於辭令者矣故夫子再言使乎以重美之按莊周稱伯玉行年五十而知四十九年之非又曰伯玉行年六十而六十化蓋其進德之功老而不倦是以踐履篤實光輝宣著不惟使者知之而夫子亦信之也子曰不在其位不謀其政重出曽子曰君子思不出其位此艮卦之象辭也曽子蓋嘗稱之記者因上章之語而類記之也范氏曰物各止其所而天下之理得矣故君子所思不出其位而君臣上下大小皆得其職也子曰君子恥其言而過其行行去聲恥者不敢盡之意過者欲有餘之辭子曰君子道者三我無能焉仁者不憂知者不惑勇者不懼知去聲自責以勉人也子貢曰夫子自道也道言也自道猶云謙辭尹氏曰成德以仁為先進學以知為先故夫子之言其序有不同者以此子貢方人子曰賜也賢乎哉夫我則不暇夫音扶方比也乎哉疑辭比方人物而較其短長雖亦窮理之事然專務為此則心馳於外而所以自治者疏矣故褒之而疑其辭復自貶以深抑之謝氏曰聖人責人辭不迫切而意己獨至如此子曰不患人之不己知患其不能也几章指同而文不異者一言而重出也文小異者屢言而各出也此章凡四見而文皆有異則聖人於此一事蓋屢言之其丁寧之意亦可見矣子曰不逆詐不億不信抑亦先覺者是賢乎逆未至而迎之也億未見而意之也詐謂人欺己不信謂人疑己抑反語辭言雖不逆不億而於人之情僞自然先覺乃為賢也楊氏曰君子一於誠而已然未有誠而不明者故雖不逆詐不億不信而常先覺也若夫不逆不億而卒為小人所罔焉斯亦不足觀也已微生畝謂孔子曰丘何為是栖栖者與無乃為佞乎與平聲微生姓畝名也畝名呼夫子而辭甚倨蓋有齒德而隱者栖栖依依也為佞言其務為口給以悅人也孔子曰非敢為佞也疾固也疾惡也固執一而不通也聖人之於達尊禮恭而言直如此其警之亦深矣子曰驥不稱其力稱其德也驥善馬之名德謂調良也尹氏曰驥雖有力其稱在德人有才而無德則亦奚足尚哉或曰以德報怨何如或人所稱今見老子書德謂恩惠也子曰何以報德言於其所怨既以德報之矣則人之有德於我者又將何以報之乎以直報怨以德報德於其所怨者愛憎取舍一以至公而無私所謂直也於其所德者則必以德報之不可忘也或人之言可謂厚矣然以聖人之言觀之則見其出於有意之私而怨德之報皆不得其平也必如夫子之言然後二者之報各得其所然怨有不讎而德無不報則又未嘗不厚也此章之言明白簡約而其指意曲折反覆如造化之簡易易知而微妙無窮學者所宜詳玩也子曰莫我知也夫夫音扶夫子自歎以發子貢之問也子貢曰何為其莫知子也子曰不怨天不尤人下學而上達知我者其天乎不得於天而不怨天不合於人而不尤人但知下學而自然上達此但自言其反己自修循序漸進耳無以甚異於人而致其知也然深味其語意則見其中自有人不及知而天獨知之之妙蓋在孔門惟子貢之智幾足以及此故特語以發之惜乎其猶有所未達也程子曰不怨天不尤人在理當如此又曰下學上達意在言表又曰學者須守下學上達之語乃學之要蓋凡下學人事便是上達天理然習而不察則亦不能以上達矣公伯寮訴子路於季孫子服景伯以告曰夫子固有惑志於公伯寮吾力猶能肆諸市朝朝音潮公伯寮魯人子服氏景諡伯字魯大夫子服何也夫子指季孫言其有疑於寮之言也肆陳尸也言欲誅寮子曰道之將行也與命也道之將廢也與命也公伯寮其如命何與平聲謝氏曰雖寮之訴行亦命也其實寮無如之何愚謂言此以曉景伯安子路而警伯寮耳聖人於利害之際則不待決於命而後泰然也子曰賢者辟世辟去聲下同天下無道而隱若伯夷太公是也其次辟地去亂國適治邦其次辟色禮貌衰而去其次辟言有違言而後去也程子曰四者雖以大小次第言之然非有優劣也所遇不同耳子曰作者七人矣李氏曰作起也言起而隱去者今七人矣不可知其誰何必求其人以實之則鑿矣子路宿於石門晨門曰奚自子路曰自孔氏曰是知其不可而為之者與與平聲石門地名晨門掌晨啓門蓋賢人隱於抱關者也自從也問其何所從來也胡氏曰晨門知世之不可而不為故以是譏孔子然不知聖人之視天下無不可為之時也子擊磬於衛有荷蕢而過孔氏之門者曰有心哉擊磬乎荷去聲磬樂器荷擔也蕢草器也此荷蕢者亦隱士也聖人之心未嘗忘天下此人聞其磬聲而知之則亦非常人矣既而曰鄙哉硜硜乎莫已知也斯已而已矣深則厲淺則揭硜苦耕反莫已之已音紀餘音以揭起例反硜硜石聲亦專確之意以衣涉水曰厲攝衣涉水曰揭此兩句衛風匏有苦葉之詩也譏孔子人不知己而不止不能適淺深之宜子曰果哉末之難矣果哉歎其果於忘世也末無也聖人心同天地視天下猶一家中國猶一人不能一日忘也故聞荷蕢之言而歎其果於忘世且言人之出處若但如此則亦無所難矣子張曰書云髙宗諒隂三年不言何謂也髙宗商王武丁也諒隂天子居喪之名未詳其義子曰何必髙宗古之人皆然君薨百官總已以聽於冢宰三年言君薨則諸侯亦然總己謂總攝己職冢宰大宰也百官聽於冢宰故君得以三年不言也胡氏曰位有貴賤而生於父母無以異者故三年之喪自天子達於庶人子張非疑此也殆以為人君三年不言則臣下無所禀令禍亂或由以起也孔子告以聽於冢宰則禍亂非所憂矣子曰上好禮則民易使也好易皆去聲謝氏曰禮達而分定故民易使子路問君子子曰修己以敬曰如斯而已乎曰修己以安人曰如斯而已乎曰修己以安百姓修己以安百姓堯舜其猶病諸修己以敬夫子之言至矣盡矣而子路少之故再以其充積之盛自然及物者告之無他道也人者對已而言百姓則盡乎人矣堯舜猶病言不可以有加於此以抑子路使反求諸近也蓋聖人之心無窮世雖極治然豈能必知四海之內果無一物不得其所哉故堯舜猶以安百姓為病若曰吾治己足則非所以為聖人矣程子曰君子修己以安百姓篤恭而天下平唯上下一於恭敬則天地自位萬物自育氣無不和而四靈畢至矣此體信達順之道聰明睿知皆由是出以此事天饗帝原壤夷俟子曰幼而不孫弟長而無述焉老而不死是為賊以杖叩其脛孫弟並去聲長上聲叩音口脛其定反原壤孔子之故人母死而歌蓋老氏之流自放於禮法之外者夷蹲踞也俟待也言見孔子來而蹲踞以待之也述猶稱也賊者害人之名以其自幼至老無一善狀而久生於世徒足以敗常亂俗則是賊而已矣脛足骨也孔子既責之而因以所曳之杖微擊其脛若使勿蹲踞然闕黨童子將命或問之曰益者與與平聲闕黨黨名童子未冠者之稱將命謂傳賓主之言或人疑此童子學有進益故孔子使之傳命以寵異之也子曰吾見其居於位也見其與先生並行也非求益者也欲速成者也禮童子當隅坐隨行孔子言吾見此童子不循此禮非能求益但欲速成爾故使之給使令之役觀長少之序習揖遜之容蓋所以抑而教之非寵而異之也論語卷七
