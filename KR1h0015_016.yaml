body:
  text: 欽定四庫全書孟子卷七宋朱子集註盡心章句上凡四十六章孟子曰盡其心者知其性也知其性則知天矣心者人之神明所以具衆理而應萬事者也性則心之所具之理而天又理之所從以出者也人有是心莫非全體然不窮理則有所蔽而無以盡乎此心之量故能極其心之全體而無不盡者必其能窮夫理而無不知者也既知其理則其所從出亦不外是矣以大學之序言之知性則物格之謂盡心則知至之謂也存其心養其性所以事天也存謂操而不含養謂順而不害事則奉承而不違也殀夀不貳脩身以俟之所以立命也殀夀命之短長也貳疑也不貳者知天之至脩身以俟死則事天以終身也立命謂全其天之所付不以人為害之程子曰心也性也天也一理也自理而言謂之天自禀受而言謂之性自存諸人而言謂之心張子曰由太虚有天之名由氣化有道之名合虚與氣有性之名合性與知覺有心之名愚謂盡心知性而知天所以造其理也存心養性以事天所以履其事也不知其理固不能履其事然徒造其理而不履其事則亦無以有諸已矣知天而不以殀夀貳其心智之盡也事天而能脩身以俟死仁之至也智有不盡固不知所以為仁然智而不仁則亦將流蕩不法而不足以為智矣孟子曰莫非命也順受其正人物之生吉凶禍福皆天所命然惟莫之致而至者乃為正命故君子脩身以俟之所以順受乎此也是故知命者不立乎巖牆之下命謂正命巖牆牆之將覆者知正命則不處危地以取覆壓之禍盡其道而死者正命也盡其道則所值之吉凶皆莫之致而至者矣桎梏死者非正命也桎梏所以拘罪人者言犯罪而死與立巖牆之下者同皆人所取非天所為也此章與上章盖一時之言所以發其末句未盡之意孟子曰求則得之舍則失之是求有益於得也求在我者也舍上聲在我者謂仁義禮智凡性之所有者求之有道得之有命是求無益於得也求在外者也有道言不可妄求有命則不可必得在外者謂富貴利逹凡外物皆是趙氏曰言為仁由已富貴在天如不可求從吾所好孟子曰萬物皆備於我矣此言理之本然也大則君臣父子小則事物細㣲其當然之理無一不具於性分之内也反身而誠樂莫大焉樂音洛誠實也言反諸身而所備之理皆如惡惡臭好好色之實然則其行之不待勉强而無不利矣其為樂孰大於是彊恕而行求仁莫近焉彊上聲彊勉强也恕推已以及人也反身而誠則仁矣其有未誠則是猶有私意之隔而理未純也故當凡事勉强推己及人庶幾心公理得而仁不逺也此章言萬物之理具於吾身體之而實則道在我而樂有餘行之以恕則私不容而仁可得孟子曰行之而不著焉習矣而不察焉終身由之而不知其道者衆也著者知之明察者識之精言方行之而不能明其所當然既習矣而猶不識其所以然所以終身由之而不知其道者多也孟子曰人不可以無恥無恥之恥無恥矣趙氏曰人能恥己之無所恥是能改行從善之人終身無復有恥辱之累矣孟子曰恥之於人大矣恥者吾所固有羞惡之心也存之則進於聖賢失之則入於禽獸故所繫為甚大為機變之巧者無所用恥焉為機械變詐之巧者所為之事皆人所深恥而彼方且自以為得計故無所用其愧恥之心也不恥不若人何若人有但無恥一事不如人則事事不如人矣或曰不恥其不如人則何能有如人之事其義亦通或問人有恥不能之心如何程子曰恥其不能而為之可也恥其不能而掩藏之不可也孟子曰古之賢王好善而忘勢古之賢士何獨不然樂其道而忘人之勢故王公不致敬盡禮則不得亟見之見且猶不得亟而况得而臣之乎好去聲樂音洛亟去吏反言君當屈已以下賢士不枉道而求利二者勢若相反而實則相成盖亦各盡其道而已孟子謂宋句踐曰子好遊乎吾語子遊句音鉤好語皆去聲宋姓句踐名遊遊説也人知之亦囂囂人不知亦囂囂趙氏曰囂囂自得無欲之貌曰何如斯可以囂囂矣曰尊徳樂義則可以囂囂矣樂音洛徳謂所得之善尊之則有以自重而不慕乎人爵之榮義謂所守之正樂之則有以自安而不徇乎外物之誘矣故士窮不失義逹不離道離力智反言不以貧賤而移不以富貴而淫此尊徳樂義見於行事之實也窮不失義故士得已焉逹不離道故民不失望焉得已言不失已也民不失望言人素望其興道致治而今果如所望也古之人得志澤加於民不得志脩身見於世窮則獨善其身逹則兼善天下見音現見謂名實之顯著也此又言士得已民不失望之實此章言内重而外輕則無往而不善孟子曰待文王而後興者凡民也若夫豪傑之士雖無文王猶興夫音扶興者感動奮發之意凡民庸常之人也豪傑有過人之才智者也盖降𠂻秉彛人所同得惟上智之資無物欲之蔽為能無待於教而自能感發以有為也孟子曰附之以韓魏之家如其自視欿然則過人遠矣欿音坎附益也韓魏晋卿富家也欿然不自滿之意尹氏曰言有過人之識則不以富貴為事孟子曰以佚道使民雖勞不怨以生道殺民雖死不怨殺者程子曰以佚道使民謂本欲佚之也播榖乘屋之類是也以生道殺民謂本欲生之也除害去惡之類是也盖不得已而為其所當為則雖咈民之欲而民不怨其不然者反是孟子曰霸者之民驩虞如也王者之民皥皥如也皥胡老反驩虞與歡娛同皥皥廣大自得之貌程子曰驩虞有所造為而然豈能久也耕田鑿井帝力何有於我如天之自然乃王者之政楊氏曰所以致人驩虞必有違道干譽之事若王者則如天亦不令人喜亦不令人怒殺之而不怨利之而不庸民日遷善而不知為之者此所謂皡皡如也庸功也豐氏曰因民之所惡而去之非有心於殺之也何怨之有因民之所利而利之非有心於利之也何庸之有輔其性之自然使自得之故民日遷善而不知誰之所為也夫君子所過者化所存者神上下與天地同流豈曰小補之哉夫音扶君子聖人之通稱也所過者化身所經厯之處即人無不化如舜之耕厯山而田者遜畔陶河濱而器不苦窳也所存者神心所存主處便神妙不測如孔子之立斯立道斯行綏斯來動斯和莫知其所以然而然也是其徳業之盛乃與天地之化同運並行舉一世而甄陶之非如霸者但小小補塞其罅漏而已此則王道之所以為大而學者所當盡心也孟子曰仁言不如仁聲之入人深也程子曰仁言謂以仁厚之言加於民仁聲謂仁聞謂有仁之實而為衆所稱道者也此尤見仁徳之昭著故其感人尤深也善政不如善教之得民也政謂法度禁令所以制其外也教謂道德齊禮所以格其心也善政民畏之善教民愛之善政得民財善教得民心得民財者百姓足而君無不足也得民心者不遺其親不後其君也孟子曰人之所不學而能者其良能也所不慮而知者其良知也良者本然之善也程子曰良知良能皆無所由乃出於天不係於人孩提之童無不知愛其親也及其長也無不知敬其兄也長上聲下同孩提二三嵗之間知孩笑可提抱者也愛親敬長所謂良知良能者也親親仁也敬長義也無他逹之天下也言親親敬長雖一人之私然逹之天下無不同者所以為仁義也孟子曰舜之居深山之中與木石居與鹿豕遊其所以異於深山之野人者幾希及其聞一善言見一善行若決江河沛然莫之能禦也行去聲居深山謂耕厯山時也盖聖人之心至虚至明渾然之中萬理畢具一有感觸則其應甚速而無所不通非孟子造道之深不能形容至此也孟子曰無為其所不為無欲其所不欲如此而已矣李氏曰有所不為不欲人皆有是心也至於私意一萌而不能以禮義制之則為所不為欲所不欲者多矣能反是心則所謂擴充其羞惡之心者而義不可勝用矣故曰如此而已矣孟子曰人之有徳慧術知者恒存乎疢疾知去聲疢丑刃反徳慧者徳之慧術知者術之知疢疾猶災患也言人必有疢疾則能動心忍性増益其所不能也獨孤臣孽子其操心也危其慮患也深故逹孤臣逺臣孽子庶子皆不得於君親而常有疢疾者也逹謂逹於事理即所謂徳慧術知也孟子曰有事君人者事是君則為容悦者也阿徇以為容逢迎以為悦此鄙夫之事妾婦之道也有安社禝臣者以安社禝為悦者也言大臣之計安社禝如小人之務悦其君眷眷於此而不忘也有天民者逹可行於天下而後行之者也民者無位之稱以其全盡天理乃天之民故謂之天民必其道可行於天下然後行之不然則寜没世不見知而不悔不肯小用其道以徇於人也張子曰必功覆斯民然後出如伊呂之徒有大人者正已而物正者也大人徳盛而上下化之所謂見龍在田天下文明者此章言人品不同略有四等容悦佞臣不足言安社禝則忠矣然猶一國之士也天民則非一國之士矣然猶有意也無意無必惟其所在而物無不化唯聖者能之孟子曰君子有三樂而王天下不與存焉樂音洛王與皆去聲下並同父母俱存兄弟無故一樂也此人所深願而不可必得者今既得之其樂可知仰不愧於天俯不怍於人二樂也程子曰人能克己則仰不愧俯不怍心廣體胖其樂可知有息則餒矣得天下英才而教育之三樂也盡得一世明睿之才而以所樂乎已者教而養之則斯道之傳得之者衆而天下後世將無不被其澤矣聖人之心所願欲者莫大於此今既得之其樂為何如哉君子有三樂而王天下不與存焉林氏曰此三樂者一係於天一係於人其可以自致者惟不愧不怍而已學者可不勉哉孟子曰廣土衆民君子欲之所樂不存焉樂音洛下同地闢民聚澤可逺施故君子欲之然未足以為樂也中天下而立定四海之民君子樂之所性不存焉其道大行無一夫不被其澤故君子樂之然其所得於天者則不在是也君子所性雖大行不加焉雖窮居不損焉分定故也分去聲分者所得於天之全體故不以窮逹而有異君子所性仁義禮智根於心其生色也睟然見於面盎於背施於四體四體不言而喻睟音粹見音現盎烏浪反上言所性之分與所欲所樂不同此乃言其藴也仁義禮智性之四徳也根本也生發見也睟然清和潤澤之貌盎豐厚盈溢之意施於四體謂見於動作威儀之間也喻曉也四體不言而喻言四體不待吾言而自能曉吾意也盖氣稟清明無物欲之累則性之四徳根本於心其積之盛則發而著見於外者不待言而無不順也程子曰睟面盎背皆積盛致然四體不言而喻惟有徳者能之此章言君子固欲其道之大行然其所得於天者則不以是而有所加損也孟子曰伯夷辟紂居北海之濱聞文王作興曰盍歸乎來吾聞西伯善養老者太公辟紂居東海之濱聞文王作興曰盍歸乎來吾聞西伯善養老者天下有善養老則仁人以為已歸矣辟去聲下同大他盖反已歸謂已之所歸餘見前篇五畝之宅樹牆下以桑匹婦蠶之則老者足以衣帛矣五母雞二母彘無失其時老者足以無失肉矣百畝之田匹夫耕之八口之家可以無饑矣衣去聲此文王之政也一家養母雞五母彘二也餘見前篇所謂西伯善養老者制其田里教之樹畜導其妻子使養其老五十非帛不煖七十非肉不飽不煖不飽謂之凍餒文王之民無凍餒之老者此之謂也田謂百畆之田里謂五畝之宅樹謂耕桑畜謂雞彘也趙氏曰善養老者教導之使可以養其老耳非家賜而人益之也孟子曰易其田疇薄其税斂民可使富也易斂皆去聲易治也疇耕治之田也食之以時用之以禮財不可勝用也勝音升教民節儉則財用足矣民非水火不生活昏暮叩人之門户求水火無弗與者至足矣聖人治天下使有菽粟如水火菽粟如水火而民焉有不仁者乎焉於虞反水火民之所急宜其愛之而反不愛者多故也尹氏曰言禮義生於富足民無常産則無常心矣孟子曰孔子登東山而小魯登太山而小天下故觀於海者難為水遊於聖人之門者難為言此言聖人之道大也東山盖魯城東之髙山而太山則又髙矣此言所處益髙則其視下益小所見既大則其小者不足觀也難為水難為言猶仁不可為衆之意觀水有術必觀其瀾日月有明容光必照焉此言道之有本也瀾水之湍急處也明者光之體光者明之用也觀水之瀾則知其源之有本矣觀日月於容光之隙無不照則知其明之有本矣流水之為物也不盈科不行君子之志於道也不成章不逹言學當以漸乃能至也成章所積者厚而文章外見也逹者足於此而通於彼也此章言聖人之道大而有本學之者必以其漸乃能至也孟子曰雞鳴而起孳孳為善者舜之徒也孳孳勤勉之意言雖未至於聖人亦是聖人之徒也雞鳴而起孳孳為利者蹠之徒也蹠盗蹠也欲知舜與蹠之分無他利與善之間也程子曰言間者謂相去不遠所争毫末耳善與利公私而已矣才出於善便以利言也楊氏曰舜蹠之相去逺矣而其分乃在利善之間而已是豈可以不謹然講之不熟見之不明未有不以利為義者又學者所當深察也或問難鳴而起若未接物如何為善程子曰只主於敬便是為善孟子曰楊子取為我拔一毛而利天下不為也為我之為去聲楊子名朱取者僅足之意取為我者僅足於為我而已不及為人也列子稱其言曰伯成子髙不以一毫利物是也墨子兼愛摩頂放踵利天下為之放上聲墨子名翟兼愛無所不愛也摩頂摩突其頂也放至也子莫執中執中為近之執中無權猶執一也子莫魯之賢者也知楊墨之失中也故度於二者之間而執其中近近道也權稱錘也所以稱物之輕重而取中也執中而無權則膠於一定之中而不知變是亦執一而已矣程子曰中字最難識須是黙識心通且試言一㕔則中央為中一家則㕔非中而堂為中一國則堂非中而國之中為中推此類可見矣又曰中不可執也識得則事事物物皆有自然之中不待安排安排者則不中矣所惡執一者為其賊道也舉一而廢百也惡為皆去聲賊害也為我害仁兼愛害義執中者害於時中皆舉一而廢百者也此章言道之所貴者中中之所貴者權楊氏曰禹稷三過其門而不入苟不當其可則與墨子無異顔子在陋巷不改其樂苟不當其可則與楊氏無異子莫執為我兼愛之中而無權鄉隣有鬬而不知閉户同室有鬭而不知救之是亦猶執一耳故孟子以為賊道禹稷顔回易地則皆然以其有權也不然則是亦楊墨而已矣孟子曰飢者甘食渴者甘飲是未得飲食之正也飢渴害之也豈惟口腹有飢渴之害人心亦皆有害口腹為飢渴所害故於飲食不暇擇而失其正味人心為貧賤所害故於富貴不暇擇而失其正理人能無以飢渴之害為心害則不及人不為憂矣人能不以貧賤之故而動其心則過人逺矣孟子曰柳下惠不以三分易其介介有分辨之意栁下惠進不隠賢必以其道遺佚不怨阨窮不憫直道事人至於三黜是其介也此章言栁下惠和而不流與孔子論夷齊不念舊惡意正相類皆聖賢㣲顯闡幽之意也孟子曰有為者辟若掘井掘井九軔而不及泉猶為棄井也辟讀作譬軔音刃與仞同八尺曰仞言鑿井雖深然未及泉而止猶為自棄其井也吕侍講曰仁不如堯孝不如舜學不如孔子終未入於聖人之域終未至於天道未免為半塗而廢自棄前功也孟子曰堯舜性之也湯武身之也五霸假之也堯舜天性渾全不假脩習湯脩身體道以復其性五霸則假借仁義之名以求濟其貪欲之私耳久假而不歸惡知其非有也惡平聲歸還也有實有也言竊其名以終身而不自知其非真有或曰盖歎世人莫覺其偽者亦通舊説久假不歸即為真有則誤矣尹氏曰性之者與道一也身之者履之也及其成功則一也五霸則假之而已是以功烈如彼其卑也公孫丒曰伊尹曰予不狎于不順放太甲于桐民大悦太甲賢又反之民大悦予不狎于不順太甲篇文狎習見也不順言太甲所為不順義理也餘見前篇賢者之為人臣也其君不賢則固可放與與平聲孟子曰有伊尹之志則可無伊尹之志則篡也伊尹之志公天下以為心而無一毫之私者也公孫丑曰詩曰不素餐兮君子之不耕而食何也孟子曰君子居是國也其君用之則安富尊榮其子弟從之則孝弟忠信不素餐兮孰大於是餐七丹反詩魏國風伐檀之篇素空也無功而食禄謂之素餐此與告陳相彭更之意同王子墊問曰士何事墊丁念反墊齊王之子也上則公卿大夫下則農工商賈皆有所事而士居其間獨無所事故王子問之也孟子曰尚志尚髙尚也志者心之所之也士既未得行公卿大夫之道又不當為農工商賈之業則髙尚其志而已曰何謂尚志曰仁義而已矣殺一無罪非仁也非其有而取之非義也居惡在仁是也路惡在義是也居仁由義大人之事備矣惡平聲非仁非義之事雖小不為而所居所由無不在於仁義此士所以尚其志也大人謂公卿大夫言士雖未得大人之位而其志如此則大人之事體用已全若小人之事則固非所當為也孟子曰仲子不義與之齊國而弗受人皆信之是舍簞食豆羮之義也人莫大焉亡親戚君臣上下以其小者信其大者奚可哉舍音捨食音嗣仲子陳仲子也言仲子設若非義而與之齊國必不肯受齊人皆信其賢然此但小亷耳其辟兄離母不食君禄無人道之大倫罪莫大焉豈可以小亷信其大節而遂以為賢哉桃應問曰舜為天子臯陶為士瞽瞍殺人則如之何桃應孟子弟子也其意以為舜雖愛父而不可以私害公臯陶雖執法而不可以刑天子之父故設此問以觀聖賢用心之所極非以為真有此事也孟子曰執之而已矣言臯陶之心知有法而已不知有天子之父也然則舜不禁與與平聲桃應問也曰夫舜惡得而禁之夫有所受之也犬音扶惡平聲言臯陶之法有所傳受非所敢私雖天子之命亦不得而廢之也然則舜如之何桃應問也曰舜視棄天下猶棄敝蹝也竊負而逃遵海濵而處終身訢然樂而忘天下蹝音徙訢與欣同樂音洛蹝草履也遵循也言舜之心知有父而已不知有天下也孟子嘗言舜視天下猶草芥而惟順於父母可以觧憂與此意互相發此章言為士者但知有法而不知天子父之為尊為子者但知有父而不知天下之為大盖其所以為心者莫非天理之極人倫之至學者察此而有得焉則不待較計論量而天下無難處之事矣孟子自范之齊望見齊王之子喟然歎曰居移氣養移體大哉居乎夫非盡人之子與夫音扶與平聲范齊邑居謂所處之位養奉養也言人之居處所繫甚大王子亦人子耳特以所居不同故所養不同而其氣體有異也孟子曰張鄒皆云羡文也王子宮室車馬衣服多與人同而王子若彼者其居使之然也况居天下之廣居者乎廣居見前篇尹氏曰睟然見於面盎於背居天下之廣居者然也魯君之宋呼於垤澤之門守者曰此非吾君也何其聲之似我君也此無他居相似也呼去聲垤澤宋城門名也孟子又引此事為證孟子曰食而弗愛豕交之也愛而不敬獸畜之也食音嗣畜許六反交接也畜養也獸謂犬馬之屬恭敬者幣之未將者也將猶奉也詩曰承筐是將程子曰恭敬雖因威儀幣帛而後發見然幣之未將時已有此恭敬之心非因幣帛而後有也恭敬而無實君子不可虚拘此言當時諸侯之待賢者特以幣帛為恭敬而無其實也拘留也孟子曰形色天性也惟聖人然後可以踐形人之有形有色無不各有自然之理所謂天性也踐如踐言之踐盖衆人有是形而不能盡其理故無以踐其形惟聖人有是形而又能盡其理然後可以踐其形而無歉也程子曰此言聖人盡得人道而能充其形也盖人得天地之正氣而生與萬物不同既為人須盡得人理然後稱其名衆人有之而不知賢人踐之而未盡能充其形惟聖人也楊氏曰天生蒸民有物有則物者形色也則者性也各盡其則則可以踐形矣齊宣王欲短喪公孫丑曰為朞之喪猶愈於已乎已猶止也孟子曰是猶或紾其兄之臂子謂之姑徐徐云爾亦教之孝弟而已矣紾之忍反紾戾也教之以孝弟之道則彼當自知兄之不可戾而喪之不可短矣孔子曰子生三年然後免於父母之懐予也有三年之愛於其父母乎所謂教之以孝弟者如此盖示之以至情之不能己者非强之也王子有其母死者其傅為之請數月之喪公孫丑曰若此者何如也為去聲陳氏曰王子所生之母死厭於嫡母而不敢終喪其傅為請於王欲使得行數月之喪也時又適有此事丑問如此者是非何如按儀禮公子為其母練冠麻衣縓縁既葬除之疑當時此禮已廢或既葬而未忍即除故請之也曰是欲終之而不可得也雖加一日愈於己謂夫莫之禁而弗為者也夫音扶言王子欲終喪而不可得其傅為請雖止得加一日猶勝不加我前所譏乃謂夫莫之禁而自不為者耳此章言三年通喪天經地義不容私意有所短長示之至情則不肖者有以企而及之矣孟子曰君子之所以教者五下文五者盖因人品髙下或相去逺近先後之不同有如時雨化之者時雨及時之雨也草木之生播種封殖人力已至而未能自化所少者雨露之滋耳及此時而雨之則其化速矣教人之妙亦猶是也若孔子之於顔曾是已有成徳者有逹財者財與材同此各因其所長而教之者也成徳如孔子之於冉閔逹財如孔子之於由賜有答問者就所問而答之若孔孟之於樊遲萬章也有私淑艾者艾音乂私竊也淑善也艾治也人或不能及門受業但聞君子之道於人而竊以善治其身是亦君子教誨之所及若孔孟之於陳亢夷之是也孟子亦曰予未得為孔子徒也予私淑諸人也此五者君子之所以教也聖賢施教各因其材小以成小大以成大無棄人也公孫丑曰道則髙矣美矣宜若登天然似不可及也何不使彼為可幾及而日孳孳也㡬音機孟子曰大匠不為拙工改廢繩墨羿不為拙射變其彀率為去聲彀古候反率音律彀率彎弓之限也言教人者皆有不可易之法不容自貶以徇學者之不能也君子引而不發躍如也中道而立能者從之引引弓也發發矢也躍如如踊躍而出也因上文彀率而言君子教人但授以學之之法而不告以得之之妙如射者之引弓而不發矢然其所不告者已如踊躍而見於前矣中者無過不及之謂中道而立言其非難非易能者従之言學者當自勉也此章言道有定體教有成法卑不可抗髙不可貶語不能顯黙不能藏孟子曰天下有道以道殉身天下無道以身殉道殉如殉葬之殉以死隨物之名也身出則道在必行道屈則身在必退以死相從而不離也未聞以道殉乎人者也以道從人妾婦之道公都子曰滕更之在門也若在所禮而不答何也更平聲趙氏曰滕更滕君之弟來學者也孟子曰挾貴而問挾賢而問挾長而問挾有勲勞而問挾故而問皆所不答也滕更有二焉長上聲趙氏曰二謂挾貴挾賢也尹氏曰有所挾則受道之心不專所以不答也此言君子雖誨人不倦又惡夫意之不誠者孟子曰於不可已而已者無所不已於所厚者薄無所不薄也已止也不可止謂所不得不為者也所厚所當厚者也此言不及者之弊其進鋭者其退速進鋭者用心太過其氣易衰故退速三者之弊理勢必然雖過不及之不同然卒同歸於廢弛孟子曰君子之於物也愛之而弗仁於民也仁之而弗親親親而仁民仁民而愛物物謂禽獸草木愛謂取之有時用之有節程子曰仁推已及人如老吾老以及人之老於民則可於物則不可統而言之則皆仁分而言之則有序楊氏曰其公不同故所施不能無差等所謂理一而分殊者也尹氏曰何以有是差等一本故也無偽也孟子曰知者無不知也當務之為急仁者無不愛也急親賢之為務堯舜之知而不徧物急先務也堯舜之仁不徧愛人急親賢也知者之知並去聲知者固無不知然常以所當務者為急則事無不治而其為知也大矣仁者固無不受然常急於親賢則恩無不洽而其為仁也博矣不能三年之喪而緦小功之察放飯流歠而問無齒决是之謂不知務飯扶晚反歠昌悦反三年之喪服之重者也緦麻三月小功五月服之輕者也察致詳也放飯大飯流歠長歠不敬之大者也齒决齧斷乾肉不敬之小者也問講求之意此章言君子之於道識其全體則心不狹知所先後則事有序豐氏曰智不急於先務雖徧知人之所知徧能人之所能徒弊精神而無益於天下之治矣仁不急於親賢雖有仁民愛物之心小人在位無由下逹聰明日蔽於上而惡政日加於下此孟子所謂不知務也盡心章句下凡三十八章孟子曰不仁哉梁惠王也仁者以其所愛及其所不愛不仁者以其所不愛及其所愛親親而仁民仁民而愛物所謂以其所愛及其所不愛也公孫丑曰何謂也梁惠王以土地之故糜爛其民而戰之大敗將復之恐不能勝故驅其所愛子弟以殉之是之謂以其所不愛及其所愛也梁惠王以下孟子答辭也糜爛其民使之戰鬬糜爛其血肉也復之復戰也子弟謂太子申也以土地之故及其民以民之故及其子皆以其所不愛及其所愛也此承前篇之末三章之意言仁人之恩自内及外不仁之禍由疏逮親孟子曰春秋無義戰彼善於此則有之矣春秋每書諸侯戰伐之事必加譏貶以著其擅興之罪無有以為合於義而許之者但就中彼善於此者則有之如召陵之師之類是也征者上伐下也敵國不相征也征所以正人也諸侯有罪則天子討而正之此春秋所以無義戰也孟子曰盡信書則不如無書程子曰載事之辭容有重稱而過其實者學者當識其義而已苟執於辭則時或有害於義不如無書之愈也吾於武成取二三策而已矣武成周書篇名武王伐紂歸而記事之書也策竹簡也取其二三策之言其餘不可盡信也程子曰取其奉天伐暴之意反政施仁之法而已仁人無敵於天下以至仁伐至不仁而何其血之流杵也杵舂杵也或作鹵楯也武成言武王伐紂紂之前徒倒戈攻于後以北血流漂杵孟子言此則其不可信者然書本意乃謂商人自相殺非謂武王殺之也孟子之設是言懼後世之惑且長不仁之心耳孟子曰有人曰我善為陳我善為戰大罪也陳去聲制行伍曰陳交兵曰戰國君好仁天下無敵焉好去聲南面而征北狄怨東面而征西夷怨曰奚為後我此引湯之事以明之解見前篇武王之伐殷也革車三百兩虎賁三千人兩去聲賁音奔又以武王之事明之也兩車數一車兩輪也千書序作百王曰無畏寧爾也非敵百姓也若崩厥角稽首書泰誓文與此小異孟子之意當云王謂商人曰無畏我也我來伐紂本為安寧汝非敵商之百姓也於是商人稽首至地如角之崩也征之為言正也各欲正已也焉用戰焉於䖍反民為暴君所虐皆欲仁者來正已之國也孟子曰梓匠輪輿能與人規矩不能使人巧尹氏曰規矩法度可告者也巧則在其人雖大匠亦末如之何也已盖下學可以言傳上逹必由心悟荘周所論斲輪之意盖如此孟子曰舜之飯糗茹草也若將終身焉及其為天子也被袗衣鼓琴二女果若固有之飯上聲糗去久反茹音汝袗之忍反果説文作婐烏果反飯食也糗乾糒也茹亦食也袗畫衣也二女堯二女也果女侍也言聖人之心不以貧賤而冇慕於外不以富貴而有動於中隨遇而安無預於己所性分定故也孟子曰吾今而後知殺人親之重也殺人之父人亦殺其父殺人之兄人亦殺其兄然則非自殺之也一間耳間去聲言吾今而後知者必有所為而感發也一間者我徃彼來問一人耳其實與自害其親無異也范氏曰知此則愛敬人之親人亦愛敬其親矣孟子曰古之為關也將以禦暴譏察非常今之為關也將以為暴征税出入范氏曰古之耕者什一後世或收大半之税此以賦斂為暴也文王之囿與民同之齊宣王之囿為阱國中此以園囿為暴也後世為暴不止於關若使孟子用於諸侯必行文王之政凡此之類皆不終曰而改也孟子曰身不行道不行於妻子使人不以道不能行於妻子身不行道者以行言之不行者道不行也使人不以道者以事言之不能行者令不行也孟子曰周於利者凶年不能殺周於德者邪世不能亂周足也言積之厚則用有餘孟子曰好名之人能讓千乘之國苟非其人簞食豆羮見於色好乘食皆去聲見音現好名之人矯情干譽是以能讓千乘之國然若本非能輕富貴之人則於得失之小者反不覺其真情之發見矣盖觀人不於其所勉而於其所忽然後可以見其所安之實也孟子曰不信仁賢則國空虛空虚言若無人然無禮義則上下亂禮義所以辨上下定民志無政事則財用不足生之無道取之無度用之無節故也尹氏曰三者以仁賢為本無仁賢則禮義政事處之皆不以其道矣孟子曰不仁而得國者有之矣不仁而得天下未之有也言不仁之人騁其私智可以盗千乘之國而不可以得丘民之心鄒氏曰自秦以來不仁而得天下者有矣然皆一再傳而失之猶不得也所謂得天下者必如三代而後可孟子曰民為貴社稷次之君為輕社土神禝榖神建國則立壇壝以祀之盖國以民為本社禝亦為民而立而君之尊又係於二者之存亡故其輕重如此是故得乎丘民而為天子得乎天子為諸侯得乎諸侯為大夫丘民田野之民至㣲賤也然得其心則天下歸之天子至尊貴也而得其心者不過為諸侯耳是民為重也諸侯危社稷則變置諸侯無道将使社稷為人所滅則當更立賢君是君輕於社稷也犧牲既成粢盛既潔祭祀以時然而旱乾水溢則變置社稷盛音成祭祀不失禮而土榖之神不能為民禦災捍患則毁其壇壝而更置之亦年不順成八蜡不通之意是社稷雖重於君而輕於民也孟子曰聖人百世之師也伯夷柳下惠是也故聞伯夷之風者頑夫亷懦夫有立志聞柳下惠之風者薄夫敦鄙夫寛奮乎百世之上句百世之下聞者莫不興起也非聖人而能若是乎而况於親炙之者乎興起感動奮發也親炙親近而熏炙之也餘見前篇孟子曰仁也者人也合而言之道也仁者人之所以為人之理也然仁理也人物也以仁之理合於人之身而言之乃所謂道者也程子曰中庸所謂率性之謂道是也或曰外國本人也之下有義也者宜也禮也者履也智也者知也信也者實也凡二十字今按如此則理極分明然未詳其是否也孟子曰孔子之去魯曰遲遲吾行也去父母國之道也去齊接淅而行去他國之道也重出孟子曰君子之戹於陳蔡之間無上下之交也君子孔子也戹與厄同君臣皆惡無所與交也貉稽曰稽大不理於口貉音陌趙氏曰貉姓稽名為衆口所訕理賴也今按漢書無俚方言亦訓賴孟子曰無傷也士憎兹多口趙氏曰為士者益多為衆口所訕按此則憎當從土今本皆從心盖傳冩之誤詩云憂心悄悄愠于羣小孔子也肆不殄厥愠亦不隕厥問文王也詩弼風柏舟及大雅緜之篇也悄悄憂貌愠怒也本言衛之仁人見怒於羣小孟子以為孔子之事可以當之肆發語辭隕墜也問聲問也本言太王事昆夷雖不能殄絶其愠怒亦不自墜其聲問之美孟子以為文王之事可以當之尹氏曰言人顧自處如何盡其在我者而已孟子曰賢者以其昭昭使人昭昭今以其昬昬使人昭昭昭昭明也昬昬闇也尹氏曰大學之道在自昭明徳而施於天下國家其有不順者寡矣孟子謂髙子曰山徑之蹊閒句介然用之而成路句為閒不用則茅塞之矣今茅塞子之心矣介音戞徑山路也蹊人行處也介然倐然之頃也用由也路大路也為間少頃也茅塞茅草生而塞之也言理義之心不可少有間斷也髙子曰禹之聲尚文王之聲尚加尚也豐氏曰言禹之樂過於文王之樂孟子曰何以言之曰以追蠡追音堆蠡音禮豐氏曰追鐘紐也周禮所謂旋蟲是也蠡者齧木蟲也言禹時鐘在者鐘紐如蟲齧而欲絶盖用之者多而文王之鐘不然是以知禹之樂過於文王之樂也曰是奚足哉城門之軌兩馬之力與與平聲豐氏曰奚足言此何足以知之也軌車轍迹也兩馬一車所駕也城中之涂容九軌車可散行故其轍迹淺城門惟容一車車皆由之故其轍迹深盖日久車多所致非一車兩馬之力能使之然也言禹在文王前千餘年故鐘久而紐絶文王之鐘則未久而紐全不可以此而議優劣也此章文義本不可曉舊説相承如此而豐氏差明白故今存之亦未知其是否也齊饑陳臻曰國人皆以夫子將復為發棠殆不可復復扶又反先時齊國嘗饑孟子勸王發棠邑之倉以賑貧窮至此又饑陳臻問言齊人望孟子復勸王發棠而又自言恐其不可也孟子曰是為馮婦也晉人有馮婦者善搏虎卒為善士則之野有衆逐虎虎負嵎莫之敢攖望見馮婦趨而迎之馮婦攘臂下車衆皆悦之其為士者笑之手執曰搏卒為善士後能改行為善也之適也負依也山曲曰嵎攖觸也笑之笑其不知止也疑此時齊王已不能用孟子而孟子亦將去矣故其言如此孟子曰口之於味也目之於色也耳之於聲也鼻之於臭也四肢之於安佚也性也有命焉君子不謂性也程子曰五者之欲性也然有分不能皆如其願則是命也不可謂我性之所有而求必得之也愚按不能皆如其願不止為貧賤盖雖富貴之極亦有品節限制則是亦有命也仁之於父子也義之於君臣也禮之於賓主也智之於賢者也聖人之於天道也命也有性焉君子不謂命也程子曰仁義禮智天道在人則賦於命者所禀有厚薄清濁然而性善可學而盡故不謂之命也張子曰晏嬰知矣而不知仲尼是非命邪愚按所稟者厚而清則其仁之於父子也至義之於君臣也盡禮之於賓主也恭智之於賢否也哲聖人之於天道也無不脗合而純亦不已焉薄而濁則反是是皆所謂命也或曰者當作否人衍字更詳之愚聞之師曰此二條者皆性之所有而命於天者也然世之人以前五者為性雖有不得而必欲求之以後五者為命一有不至則不復致力故孟子各就其重處言之以仲此而抑彼也張子所謂養則付命於天道則責成於己其言約而盡矣浩生不害問曰樂正子何人也孟子曰善人也信人也趙氏曰浩生姓不害名齊人也何謂善何謂信不害問也曰可欲之謂善天下之理其善者必可欲其惡者必可惡其為人也可欲而不可惡則可謂善人矣有諸已之謂信凡所謂善皆實有之如惡惡臭如好好色是則可謂信人矣張子曰志仁無惡之謂善誠善於身之謂信充實之謂美力行其善至於充滿而積實則美在其中而無待於外矣充實而有光輝之謂大和順積中而英華發外美在其中而暢於四支發於事業則徳業至盛而不可加矣大而化之之謂聖大而能化使其大者冺然無復可見之迹則不思不勉從容中道而非人力之所能為矣張子曰大可為也化不可為也在熟之而已矣聖而不可知之之謂神程子曰聖不可知謂聖之至妙人所不能測非聖人之上又有一等神人也樂正子二之中四之下也盖在善信之間觀其徔於子敖則其有諸己者或未實也張子曰顔淵樂正子皆知好仁矣樂正子志仁無惡而不致於學所以但為善人信人而已顔子好學不倦合仁與智具體聖人獨未至聖人之止耳程子曰士之所難者在有諸己而已能有諸己則居之安資之深而美且大可以馴致矣徒知可欲之善而若存若亡而已則能不受變於俗者鮮矣尹氏曰自可欲之善至於聖而不可知之神上下一理擴充而至於神則不可得而名矣孟子曰逃墨必歸於楊逃楊必歸於儒歸斯受之而已矣墨氏務外而不情楊氏太簡而近實故其反正之漸大略如此歸斯受之者憫其陷溺之久而取其悔悟之新也今之與楊墨辯者如追放豚既入其苙又從而招之放豚放逸之豕豚也苙闌也招罥也羈其足也言彼既來歸而又追咎其既往之失也此章見聖賢之於異端拒之甚嚴而於其來歸待之甚恕拒之嚴故人知彼説之為邪待之恕故人知此道之可反仁之至義之盡也孟子曰有布縷之征粟米之征力役之征君子用其一緩其二用其二而民有殍用其三而父子離征賦之法嵗有常數然布縷取之於夏粟米取之於秋力役取之於冬當各以其時若并取之則民力有所不堪矣今兩税三限之法亦此意也尹氏曰言民為邦本取之無度則其國危矣孟子曰諸侯之寳三土地人民政事寳珠玉者殃必及身尹氏曰言寳得其寳者安寳失其寳者危盆成括仕於齊孟子曰死矣盆成括盆成括見殺門人問曰夫子何以知其將見殺曰其為人也小有才未聞君子之大道也則足以殺其軀而已矣盆成姓括名也恃才妄作所以取禍徐氏曰君子道其常而已括有死之道焉設使幸而獲免孟子之言猶信也孟子之滕館於上宮有業屨於牖上館人求之弗得館舍也上宮别宮名業屨織之有次業而未成者盖館人所作置之牖上而失之也或問之曰若是乎從者之廀也曰子以是為竊屨來與曰殆非也夫子之設科也往者不追來者不拒苟以是心至斯受之而已矣從為去聲與平聲夫子如字舊讀為扶余者非或問之者問於孟子也慶匿也言子之徔者乃匿人之物如此乎孟子答之而或人自悟其失因言此從者固不為竊屨而來但夫子設置科條以待學者苟以向道之心而來則受之耳雖夫子亦不能保其往也門人取其言有合於聖賢之指故記之孟子曰人皆有所不忍逹之於其所忍仁也人皆有所不為逹之於其所為義也惻隠羞惡之心人皆有之故莫不有所不忍不為此仁義之端也然以氣質之偏物欲之蔽則於他事或有不能者但推所能逹之於所不能則無非仁義矣人能充無欲害人之心而仁不可勝用也人能充無穿窬之心而義不可勝用也勝平聲充滿也穿穿穴窬踰墻皆為盗之事也能推所不忍以逹於所忍則能滿其無欲害人之心而無不仁矣能推其所不為以逹於所為則能滿其無穿窬之心而無不義矣人能充無受爾汝之實無所往而不為義也此申説上文充無穿窬之心之意也盖爾汝人所輕賤之稱人雖或有所貪昧隠忍而甘受之者然其中心必有慚忿而不肯受之之實人能即此而推之使其充滿無所虧缺則無適而非義矣士未可以言而言是以言餂之也可以言而不言是以不言餂之也是皆穿窬之類也餂音忝餂探取之也今人以舌取物曰餂即此意也便佞隠黙皆有意探取於人是亦穿窬之類然其事隠微人所忽易故特舉以見例明必推無穿窬之心以逹於此而悉去之然後為能充其無穿窬之心也孟子曰言近而指遠者善言也守約而施博者善道也君子之言也不下帶而道存焉施去聲古人視不下於帶則帶之上乃目前常見至近之處也舉目前之近事而至理存焉所以為言近而指逺也君子之守脩其身而天下平此所謂守約而施博也人病舍其田而芸人之田所求於人者重而所以自任者輕舍音捨此言不守約而務博施之病孟子曰堯舜性者也湯武反之也性者得全於天無所汚壊不假脩為聖之至也反之者脩為以復其性而至於聖人也程子曰性之反之古未有此語盖自孟子發之吕氏曰無意而安行性也有意利行而至於無意復性者也堯舜不失其性湯武善反其性及其成功則一也動容周旋中禮者盛徳之至也哭死而哀非為生者也經徳不回非以干禄也言語必信非以正行也中為行並去聲細㣲曲折無不中禮乃其盛徳之至自然而中而非有意於中也經常也回曲也三者亦皆自然而然非有意而為之也皆聖人之事性之之徳也君子行法以俟命而已矣法者天理之當然者也君子行之而吉凶禍福有所不計盖雖未至於自然而已非有所為而為矣此反之之事董子所謂正其義不謀其利明其道不計其功正此意也程子曰動容周旋中禮者盛徳之至行法以俟命者朝聞道夕死可矣之意也呂氏曰法由此立命由此出聖人也行法以俟命君子也聖人性之君子所以復其性也孟子曰説大人則藐之勿視其巍巍然説音税藐音眇趙氏曰大人當時尊貴者也藐輕之也巍巍富貴髙顯之貌藐焉而不畏之則志意舒展言語得盡也堂髙數仞榱題數尺我得志弗為也食前方丈侍妾數百人我得志弗為也般樂飲酒驅騁田獵後車千乘我得志弗為也在彼者皆我所不為也在我者皆古之制也吾何畏彼哉榱楚危反般音盤樂音洛乘去聲榱桷也題頭也食前方丈饌食列於前者方一丈也此皆其所謂巍巍然者我雖得志有所不為而所守者皆古聖賢之法則彼之巍巍者何足道哉楊氏曰孟子此章以已之長方人之短猶有此等氣象在孔子則無此矣孟子曰養心莫善於寡欲其為人也寡欲雖有不存焉者寡矣其為人也多欲雖有存焉者寡矣欲如口鼻耳目四支之欲雖人之所不能無然多而不節未有不失其本心者學者所當深戒也程子曰所欲不必沉溺只有所向便是欲曾晳嗜羊棗而曾子不忍食羊棗羊棗實小黒而圓足謂之羊矢棗曽子以父嗜之父沒之後食必思親故不忍食也公孫丑問曰膾炙與羊棗孰美孟子曰膾炙哉公孫丑曰然則曾子何為食膾炙而不食羊棗曰膾炙所同也羊棗所獨也諱名不諱姓姓所同也名所獨也肉聶而切之為膾炙炙肉也萬章問曰孔子在陳曰盍歸乎來吾黨之士狂簡進取不忘其初孔子在陳何思魯之狂士盍何不也狂簡謂志大而畧於事進取謂求望髙逺不忘其初謂不能改其舊也此語與論語小異孟子曰孔子不得中道而與之必也狂獧乎狂者進取獧者有所不為也孔子豈不欲中道哉不可必得故思其次也獧音絹不得中道至有所不為據論語亦孔子之言然則孔子字下當有曰字論語道作行獧作狷有所不為者知恥自好不為不善之人也孔子豈不欲中道以下孟子言也敢問何如斯可謂狂矣萬章問曰如琴張曾皙牧皮者孔子之所謂狂矣琴張名牢字子張子桑户死琴張臨其喪而歌事見荘子雖未必盡然要必有近似者曽皙見前篇季武子死曽皙倚其門而歌事見檀弓又言志異乎三子者之撰事見論語牧皮未詳何以謂之狂也萬章問曰其志嘐嘐然曰古之人古之人夷考其行而不掩焉者也嘐火交反行去聲嘐嘐志大言大也重言古之人見其動輒稱之不一稱而已也夷平也掩覆也言平考其行而不能覆其言也程子曰曾皙言志而夫子與之盖與聖人之志同便是堯舜氣象也特行有不掩焉耳此所謂狂也狂者又不可得欲得不屑不潔之士而與之是獧也是又其次也此因上文所引遂觧所以思得獧者之意狂有志者也獧有守者也有志者能進於道有守者不失其身屑潔也孔子曰過我門而不入我室我不憾焉者其惟鄉原乎鄉原徳之賊也曰何如斯可謂之鄉原矣鄉原非有識者原與愿同荀子原慤字皆讀作愿謂謹愿之人也故鄉里所謂愿人謂之鄉原孔子以其似徳而非徳故以為徳之賊過門不入而不恨之以其不見親就為幸深惡而痛絶之也萬章又引孔子之言而問也曰何以是嘐嘐也言不顧行行不顧言則曰古之人古之人行何為踽踽涼涼生斯世也為斯世也善斯可矣閹然媚於世也者是鄉原也行去聲踽其禹反閹音奄踽踽獨行不進之貌凉凉薄也不見親厚於人也鄉原譏狂者曰何用如此嘐嘐然行不掩其言而徒每事必稱古人邪又譏獧者曰何必如此踽踽凉凉無所親厚哉人既生於此世則但當為此世之人使當世之人皆以為善則可矣此鄉原之志也閹如奄人之奄閉藏之意也媚求悦於人也孟子言此深自閉藏以求親媚於世是郷原之行也萬章曰一鄉皆稱原人焉無所往而不為原人孔子以為徳之賊何哉原亦謹厚之稱而孔子以為徳之賊故萬章疑之曰非之無舉也刺之無刺也同乎流俗合乎汙世居之似忠信行之似亷潔衆皆悦之自以為是而不可與入堯舜之道故曰徳之賊也吕侍講曰言此等之人欲非之則無可舉欲刺之則無可刺也流俗者風俗頽靡如水之下流衆莫不然也汙濁也非忠信而似忠信非亷潔而似亷潔孔子曰惡似而非者惡莠恐其亂苗也惡佞恐其亂義也惡利口恐其亂信也惡鄭聲恐其亂樂也惡紫恐其亂朱也惡鄉原恐其亂徳也惡去聲莠音有孟子又引孔子之言以明之莠似苗之草也佞才智之稱其言似義而非義也利口多言而不實者也鄭聲淫樂也樂正樂也紫閒色朱正色也鄉原不狂不獧人皆以為善有似乎中道而實非也故恐其亂徳君子反經而已矣經正則庶民興庶民興斯無邪慝矣反復也經常也萬世不易之常道也興興起於善也邪慝如鄉原之属是也世衰道㣲大經不正故人人得為異説以濟其私而邪慝並起不可勝正君子於此亦復其常道而已常道既復則民興於善而是非明白無所回互雖有邪慝不足以惑之矣尹氏曰君子取夫狂狷者盖以狂者志大而可與進道狷者有所不為而可與冇為也所惡於鄉原而欲痛絶之者為其似是而非惑人之深也絶之之術無他焉亦曰反經而已矣孟子曰由堯舜至於湯五百有餘嵗若禹臯陶則見而知之若湯則聞而知之趙氏曰五百嵗而聖人出天道之常然亦有遲速不能正五百年故言有餘也尹氏曰知謂知其道也由湯至於文王五百有餘嵗若伊尹萊朱則見而知之若文王則聞而知之趙氏曰萊朱湯賢臣或曰即仲虺也為湯左相由文王至於孔子五百有餘嵗若太公望散宜生則見而知之若孔子則聞而知之散素亶反散氏宜生名文王賢臣也子貢曰文武之道未墜於地在人賢者識其大者不賢者識其小者莫不有文武之道焉夫子焉不學此所謂聞而知之也由孔子而來至於今百有餘嵗去聖人之世若此其未遠也近聖人之居若此其甚也然而無有乎爾則亦無有乎爾林氏曰孟子言孔子至今時未逺鄒魯相去又近然而已無有見而知之者矣則五百餘嵗之後又豈復有聞而知之者乎愚按此言雖若不敢自謂已得其傳而憂後世遂失其傳然乃所以自見其有不得辭者而又以見夫天理民彝不可冺滅百世之下必將有神㑹而心得之者耳故於篇終厯序羣聖之統而終之以此所以明其傳之有在而又以俟後聖於無窮也其旨深哉有宋元豐八年河南程顥伯淳卒潞公文彦博題其墓曰明道先生而其弟頤正叔序之曰周公沒聖人之道不行孟軻死聖人之學不傳道不行百世無善治學不傳千載無真儒無善治士猶得以明夫善治之道以淑諸人以傳諸後無真儒則天下貿貿焉莫知所之人欲肆而天理滅矣先生生乎千四百年之後得不傳之學於遺經以興起斯文為己任辨異端闢邪説使聖人之道煥然復明於世盖自孟子之後一人而已然學者於道不知所向則孰知斯人之為功不知所至則孰知斯名之稱情也哉孟子卷七欽定四庫全書中庸章句序中庸何為而作也子思子憂道學之失其傳而作也蓋自上古聖神繼天立極而道統之傳有自來矣其見於經則允執厥中者堯之所以授舜也人心惟危道心惟㣲惟精惟一允執厥中者舜之所以授禹也堯之一言至矣盡矣而舜復益之以三言者則所以明夫堯之一言必如是而後可庶㡬也蓋嘗論之心之虚靈知覺一而已矣而以為有人心道心之異者則以其或生於形氣之私或原於性命之正而所以為知覺者不同是以或危殆而不安或微妙而難見耳然人莫不有是形故雖上智不能無人心亦莫不有是性故雖下愚不能無道心二者雜於方寸之閒而不知所以治之則危者愈危㣲者愈㣲而天理之公卒無以勝夫人欲之私矣精則察夫二者之閒而不雜也一則守其本心之正而不離也從事於斯無少閒斷必使道心常為一身之主而人心每聽命焉則危者安㣲者著而動靜云為自無過不及之差矣夫堯舜禹天下之大聖也以天下相傳天下之大事也以天下之大聖行天下之大事而其授受之際丁寧告戒不過如此則天下之理豈有以加於此哉自是以來聖聖相承若成湯文武之為君臯陶伊傅周召之為臣既皆以此而接夫道統之傳若吾夫子則雖不得其位而所以繼往聖開來學其功反有賢於堯舜者然當是時見而知之者惟顔氏曾氏之傳得其宗及曾氏之再傳而復得夫子之孫子思則去聖逺而異端起矣子思懼夫愈乆而愈失其眞也於是推本堯舜以來相傳之意質以平日所聞父師之言更互演繹作為此書以詔後之學者蓋其憂之也深故其言之也切其慮之也逺故其説之也詳其曰天命率性則道心之謂也其曰擇善固執則精一之謂也其曰君子時中則執中之謂也世之相後千有餘年而其言之不異如合符節歴選前聖之書所以提挈綱維開示藴奥未有若是其明且盡者也自是而又再傳以得孟氏為能推明是書以承先聖之統及其沒而遂失其傳焉則吾道之所寄不越乎言語文字之閒而異端之説日新月盛以至於老佛之徒出則彌近理而大亂眞矣然而尚幸此書之不泯故程夫子兄弟者出得有所考以續夫千載不傳之緒得有所據以斥夫二家似是之非蓋子思之功於是為大而微程夫子則亦莫能因其語而得其心也惜乎其所以為説者不傳而凡石氏之所輯錄僅出於其門人之所記是以大義雖明而微言未析至其門人所自為説則雖頗詳盡而多所𤼵明然倍其師説而淫於老佛者亦有之矣熹自蚤歲即嘗受讀而竊疑之沈潛反復蓋亦有年一旦恍然似有以得其要領者然後乃敢會衆説而折其衷既為定著章句一篇以俟後之君子而一二同志復取石氏書刪其繁亂名以輯略且記所嘗論辯取舍之意别為或問以附其後然後此書之㫖支分節觧脉絡貫通詳略相因巨細畢舉而凡諸説之同異得失亦得以曲暢旁通而各極其趣雖於道統之傳不敢妄議然初學之士或有取焉則亦庶乎升高行逺之一助云爾淳熈己酉春三月戊申新安朱熹序欽定四庫全書中庸中者不偏不倚無過不及之名庸平常也宋朱子章句子程子曰不偏之謂中不易之謂庸中者天下之正道庸者天下之定理此篇乃孔門傳授心法子思恐其乆而差也故筆之於書以授孟子其書始言一理中散為萬事末復合為一理放之則彌六合卷之則退藏於密其味無窮皆實學也善讀者玩索而有得焉則終身用之有不能盡者矣天命之謂性率性之謂道脩道之謂教命猶令也性即理也天以隂陽五行化生萬物氣以成形而理亦賦焉猶命令也於是人物之生因各得其所賦之理以為健順五常之徳所謂性也率循也道猶路也人物各循其性之自然則其日用事物之閒莫不各有當行之路是則所謂道也脩品節之也性道雖同而氣禀或異故不能無過不及之差聖人因人物之所當行者而品節之以為法於天下則謂之教若禮樂刑政之屬是也盖人知己之有性而不知其出於天知事之有道而不知其由於性知聖人之有教而不知其因吾之所固有者裁之也故子思於此首𤼵明之而董子所謂道之大原出於天亦此意也道也者不可須臾離也可離非道也是故君子戒慎乎其所不睹恐懼乎其所不聞離去聲道者日用事物當行之理皆性之徳而具於心無物不有無時不然所以不可須臾離也若其可離則豈率性之謂哉是以君子之心常存敬畏雖不見聞亦不敢忽所以存天理之本然而不使離於須臾之頃也莫見乎隠莫顯乎㣲故君子慎其獨也見音現隠暗處也㣲細事也獨者人所不知而已所獨知之地也言幽暗之中細㣲之事跡雖未形而㡬則已動人雖不知而已獨知之則是天下之事無有著見明顯而過於此者是以君子既常戒懼而於此尤加謹焉所以遏人欲於将萌而不使其潛滋暗長於隠㣲之中以至離道之逺也喜怒哀樂之未𤼵謂之中𤼵而皆中節謂之和中也者天下之大本也和也者天下之達道也樂音洛中節之中去聲喜怒哀樂情也其未𤼵則性也無所偏倚故謂之中𤼵皆中節情之正也無所乖戾故謂之和大本者天命之性天下之理皆由此出道之體也達道者循性之謂天下古今之所共由道之用也此言性情之徳以明道不可離之意致中和天地位焉萬物育焉致推而極之也位者安其所也育者遂其生也自戒懼而約之以至於至靜之中無少偏倚而其守不失則極其中而天地位矣自謹獨而精之以至於應物之處無少差謬而無適不然則極其和而萬物育矣盖天地萬物本吾一體吾之心正則天地之心亦正矣吾之氣順則天地之氣亦順矣故其效驗至於如此此學問之極功聖人之能事初非有待於外而脩道之教亦在其中矣是其一體一用雖有動静之殊然必其體立而後用有以行則其實亦非有兩事也故於此合而言之以結上文之意右第一章子思述所傳之意以立言首明道之本原出於天而不可易其實體備於已而不可離次言存飬省察之要終言聖神功化之極盖欲學者於此反求諸身而自得之以去夫外誘之私而充其本然之善楊氏所謂一篇之體要是也其下十章盖子思引夫子之言以終此章之義仲尼曰君子中庸小人反中庸中庸者不偏不倚無過不及而平常之理乃天命所當然精㣲之極致也唯君子為能體之小人反是君子之中庸也君子而時中小人之中庸也小人而無忌憚也王肅本作小人之反中庸也程子亦以為然今從之君子之所以為中庸者以其有君子之徳而又能隨時以處中也小人之所以反中庸者以其有小人之心而又無所忌憚也盖中無定體隨時而在是乃平常之理也君子知其在我故能戒謹不睹恐懼不聞而無時不中小人不知有此則肆欲妄行而無所忌憚矣右第二章此下十章皆論中庸以釋首章之義文雖不屬而意實相承也變和言庸者游氏曰以性情言之則曰中和以徳行言之則曰中庸是也然中庸之中實兼中和之義子曰中庸其至矣乎民鮮能乆矣鮮上聲下同過則失中不及則未至故惟中庸之德為至然亦人所同得初無難事但世教衰民不興行故鮮能之今已乆矣論語無能字右第三章子曰道之不行也我知之矣知者過之愚者不及也道之不明也我知之矣賢者過之不肖者不及也知者之知去聲道者天理之當然中而已矣知愚賢不肖之過不及則生稟之異而失其中也知者知之過既以道為不足行愚者不及知又不知所以行此道之所以常不行也賢者行之過既以道為不足知不肖者不及行又不求所以知此道之所以常不明也人莫不飲食也鮮能知味也道不可離人自不察是以有過不及之弊右第四章子曰道其不行矣夫夫音扶由不明故不行右第五章此章承上章而舉其不行之端以起下章之意子曰舜其大知也與舜好問而好察邇言隠惡而揚善執其兩端用其中於民其斯以為舜乎知去聲與平聲好去聲舜之所以為大知者以其不自用而取諸人也邇言者淺近之言猶必察焉其無遺善可知然於其言之未善者則隠而不宣其善者則播而不匿其廣大光明又如此則人孰不樂告以善哉兩端謂衆論不同之極致盖凡物皆有兩端如小大厚薄之類於善之中又執其兩端而量度以取中然後用之則其擇之審而行之至矣然非在我之權度精切不差何以與此此知之所以無過不及而道之所以行也右第六章子曰人皆曰予知驅而納諸罟擭陷阱之中而莫之知辟也人皆曰予知擇乎中庸而不能期月守也予知之知去聲罟音古擭胡化反阱才性反辟與避同期居之反罟網也擭機檻也陷阱坑坎也皆所以揜取禽獸者也擇乎中庸辨别衆理以求所謂中庸即上章好問用中之事也期月匝一月也言知禍而不知辟以况能擇而不能守皆不得為知也右第七章承上章大知而言又舉不明之端以起下章也子曰回之為人也擇乎中庸得一善則拳拳服膺而弗失之矣回孔子弟子顔淵名拳拳奉持之貌服猶著也膺胷也奉持而著之心胷之閒言能守也顔子盖眞知之故能擇能守如此此行之所以無過不及而道之所以明也右第八章子曰天下國家可均也爵祿可辭也白刃可蹈也中庸不可能也均平治也三者亦知仁勇之事天下之至難也然皆倚於一偏故資之近而力能勉者皆足以能之至於中庸雖若易能然非義精仁熟而無一毫人欲之私者不能及也三者難而易中庸易而難此民之所以鮮能也右第九章亦承上章以起下章子路問强子路孔子弟子仲由也子路好勇故問强子曰南方之强與北方之强與抑而强與與平聲抑語辭而汝也寛柔以教不報無道南方之强也君子居之寛柔以教謂含容巽順以誨人之不及也不報無道謂横逆之來直受之而不報也南方風氣柔弱故以含忍之力勝人為强君子之道也衽金革死而不厭北方之强也而强者居之衽席也金戈兵之屬革甲胄之屬北方風氣剛勁故以果敢之力勝人為强强者之事也故君子和而不流强哉矯中立而不倚强哉矯國有道不變塞焉强哉矯國無道至死不變强哉矯此四者汝之所當强也矯强貌詩曰矯矯虎臣是也倚偏著也塞未達也國有道不變未達之所守國無道不變平生之所守也此則所謂中庸之不可能者非有以自勝其人欲之私不能擇而守也君子之强孰大於是夫子以是告子路者所以抑其血氣之剛而進之以徳義之勇也右第十章子曰素隠行怪後世有述焉吾弗為之矣素按漢書當作索盖字之誤也索隠行怪言深求隠僻之理而過為詭異之行也然以其足以欺世而盜名故後世或有稱述之者此知之過而不擇乎善行之過而不用其中不當强而强者也聖人豈為之哉君子遵道而行半塗而廢吾弗能已矣遵道而行則能擇乎善矣半塗而廢則力之不足也此其知雖足以及之而行有不逮當强而不强者也已止也聖人於此非勉焉而不敢廢盖至誠無息自有所不能止也君子依乎中庸遯世不見知而不悔唯聖者能之不為索隠行怪則依乎中庸而已不能半塗而廢是以遯世不見知而不悔也此中庸之成徳知之盡仁之至不賴勇而裕如者正吾夫子之事而猶不自居也故曰唯聖者能之而已右第十一章子思所引夫子之言以明首章之義者止此盖此篇大㫖以知仁勇三達徳為入道之門故於篇首即以大舜顔淵子路之事明之舜知也顔淵仁也子路勇也三者廢其一則無以造道而成德矣餘見第二十章君子之道費而隠費符未反費用之廣也隠體之㣲也夫婦之愚可以與知焉及其至也雖聖人亦有所不知焉夫婦之不肖可以能行焉及其至也雖聖人亦有所不能焉天地之大也人猶有所憾故君子語大天下莫能載焉語小天下莫能破焉與去聲君子之道近自夫婦居室之閒逺而至於聖人天地之所不能盡其大無外其小無内可謂費矣然其理之所以然則隠而莫之見也盖可知可能者道中之一事及其至而聖人不知不能則舉全體而言聖人固有所不能盡也侯氏曰聖人所不知如孔子問禮問官之類所不能知孔子不得位堯舜病博施之類愚謂人所憾於天地如覆載生成之偏及寒暑災祥之不得其正者詩云鳶飛戾天魚躍于淵言其上下察也鳶余専反詩大雅旱麓之篇鳶鴟類戾至也察著也子思引此詩以明化育流行上下昭著莫非此理之用所謂費也然其所以然者則非見聞所及所謂隠也故程子曰此一節子思喫緊為人處活潑潑地讀者其致思焉君子之道造端乎夫婦及其至也察乎天地結上文右第十二章子思之言盖以申明首章道不可離之意也其下八章雜引孔子之言以明之子曰道不逺人人之為道而逺人不可以為道道者率性而已固衆人之所能知能行者也故常不逺於人若為道者厭其卑近以為不足為而反務為髙逺難行之事則非所以為道矣詩云伐柯伐柯其則不逺執柯以伐柯睨而視之猶以為逺故君子以人治人改而止睨研計反詩豳風伐柯之篇柯斧柄則法也睨邪視也言人執柯伐木以為柯者彼柯長短之法在此柯耳然猶有彼此之别故伐者視之猶以為逺也若以人治人則所以為人之道各在當人之身初無彼此之别故君子之治人也即以其人之道還治其人之身其人能改即止不治盖責之以其所能知能行非欲其逺人以為道也張子所謂以衆人望人則易從是也忠恕違道不逺施諸已而不願亦勿施於人盡已之心為忠推已及人為恕違去也如春秋傳齊師違榖七里之違言自此至彼相去不逺非背而去之之謂也道即其不逺人者是也施諸已而不願亦勿施於人忠恕之事也以已之心度人之心未嘗不同則道之不逺於人者可見故已之所不欲則勿以施之於人亦不逺人以為道之事張子所謂以愛巳之心愛人則盡仁是也君子之道四丘未能一焉所求乎子以事父未能也所求乎臣以事君未能也所求乎弟以事兄未能也所求乎朋友先施之未能也庸徳之行庸言之謹有所不足不敢不勉有餘不敢盡言顧行行顧言君子胡不慥慥爾子臣弟友四字絶句求猶責也道不逺人凡已之所以責人者皆道之所當然也故反之以自責而自脩焉庸平常也行者踐其實謹者擇其可徳不足而勉則行益力言有餘而訒則謹益至謹之至則言顧行矣行之力則行顧言矣慥慥篤實貌言君子之言行如此豈不慥慥乎贊美之也凡此皆不逺人以為道之事張子所謂以責人之心責已則盡道是也右第十三章道不逺人者夫婦所能丘未能一者聖人所不能皆費也而其所以然者則至隠存焉下章放此君子素其位而行不願乎其外素猶見在也言君子但因見在所居之位而為其所當為無慕乎其外之心也素富貴行乎富貴素貧賤行乎貧賤素夷狄行乎夷狄素患難行乎患難君子無入而不自得焉難去聲此言素其位而行也在上位不陵下在下位不援上正已而不求於人則無怨上不怨天下不尤人援平聲此言不願乎其外也故君子居易以俟命小人行險以儌幸易去聲易平地也居易素位而行也俟命不願乎外也儌求也幸謂所不當得而得者子曰射有似乎君子失諸正鵠反求諸其身正音征鵠工毒反畫布曰正棲皮曰鵠皆侯之中射之的也子思引此孔子之言以結上文之意右第十四章子思之言也凡章首無子曰字者放此君子之道辟如行逺必自邇辟如登高必自卑辟譬同詩曰妻子好合如鼔瑟琴兄弟既翕和樂且耽宜爾室家樂爾妻帑好去聲耽詩作湛亦音耽樂音洛詩小雅棠棣之篇鼔瑟琴和也翕亦合也耽亦樂也帑子孫也子曰父母其順矣乎夫子誦此詩而贊之曰人能和於妻子宜於兄弟如此則父母其安樂之矣子思引詩及此語以明行逺自邇登高自卑之意右第十五章子曰鬼神之為徳其盛矣乎程子曰鬼神天地之功用而造化之迹也張子曰鬼神者二氣之良能也愚謂以二氣言則鬼者隂之靈也神者陽之靈也以一氣言則至而伸者為神反而歸者為鬼其實一物而已為徳猶言性情功效視之而弗見聽之而弗聞體物而不可遺鬼神無形與聲然物之終始莫非隂陽合散之所為是其為物之體而物所不能遺也其言體物猶易所謂幹事使天下之人齊明盛服以承祭祀洋洋乎如在其上如在其左右齊側皆反齊之為言齊也所以齊不齊而致其齊也明猶潔也洋洋流動充滿之意能使人畏敬奉承而𤼵見昭著如此乃其體物而不可遺之驗也孔子曰其氣𤼵揚于上為昭明焄蒿悽愴此百物之精也神之著也正謂此爾詩曰神之格思不可度思矧可射思度待洛反射音亦詩作斁詩大雅抑之篇格來也矧况也射厭也言厭怠而不敬也思語辭夫㣲之顯誠之不可揜如此夫夫音扶誠者眞實無妄之謂隂陽合散無非實者故其𤼵見之不可揜如此右第十六章不見不聞隠也體物如在則亦費矣此前三章以其費之小者而言此後三章以其費之大者而言此一章兼費隠包小大而言子曰舜其大孝也與徳為聖人尊為天子富有四海之内宗廟饗之子孫保之與平聲子孫謂虞思陳胡公之屬故大德必得其位必得其祿必得其名必得其壽舜年百有十歲故天之生物必因其材而篤焉故栽者培之傾者覆之材質也篤厚也栽植也氣至而滋息為培氣反而游散則覆詩曰嘉樂君子憲憲令德宜民宜人受祿于天保佑命之自天申之詩大雅假樂之篇假當依此作嘉憲當依詩作顯申重也故大德者必受命受命者受天命為天子也右第十七章此由庸行之常推之以極其至見道之用廣也而其所以然者則為體微矣後二章亦此意子曰無憂者其惟文王乎以王季為父以武王為子父作之子述之此言文王之事書言王季其勤王家盖其所作亦積功累仁之事也武王纘大王王季文王之緒壹戎衣而有天下身不失天下之顯名尊為天子富有四海之内宗廟饗之子孫保之大音泰下同此言武王之事纘繼也大王王季之父也書云大王肇基王迹詩云至于大王實始翦商緒業也戎衣甲胄之屬壹戎衣武成文言一著戎衣以伐紂也武王末受命周公成文武之徳追王大王王季上祀先公以天子之禮斯禮也達乎諸侯大夫及士庻人父為大夫子為士葬以大夫祭以士父為士子為大夫葬以士祭以大夫期之喪達乎大夫三年之喪達乎天子父母之喪無貴賤一也追王之王去聲此言周公之事末猶老也追王盖推文武之意以及乎王迹之所起也先公組紺以上至后稷也上祀先公以天子之禮又推大王王季之意以及於無窮也制為禮法以及天下使葬用死者之爵祭用生者之祿喪服自期以下諸侯絶大夫降而父母之喪上下同之推已以及人也右第十八章子曰武王周公其達孝矣乎達通也承上章而言武王周公之孝乃天下之人通謂之孝猶孟子之言達尊也夫孝者善繼人之志善述人之事者也上章言武王纘大王王季文王之緒以有天下而周公成文武之徳以追崇其先祖此繼志述事之大者也下文又以其所制祭祀之禮通于上下者言之春秋脩其祖廟陳其宗器設其裳衣薦其時食祖廟天子七諸侯五大夫三適士二官師一宗器先世所藏之重器若周之赤刀大訓天球河圖之屬也裳衣先祖之遺衣服祭則設之以授尸也時食四時之食各有其物如春行羔豚膳膏香之類是也宗廟之禮所以序昭穆也序爵所以辨貴賤也序事所以辨賢也旅酬下為上所以逮賤也燕毛所以序齒也昭如字為去聲宗廟之次左為昭右為穆而子孫亦以為序有事於太廟則子姓兄弟羣昭羣穆咸在而不失其倫焉爵公侯卿大夫也事宗祝有司之職事也旅衆也酬導飲也旅酬之禮賓弟子兄弟之子各舉觶於其長而衆相酬盖宗廟之中以有事為榮故逮及賤者使亦得以申其敬也燕毛祭畢而燕則以毛髪之色别長㓜為坐次也齒年數也踐其位行其禮奏其樂敬其所尊愛其所親事死如事生事亡如事存孝之至也踐猶履也其指先王也所尊所親先王之祖考子孫臣庶也始死謂之死既葬則曰反而亡焉皆指先王也此結上文兩節皆繼志述事之意也郊社之禮所以事上帝也宗廟之禮所以祀乎其先也明乎郊社之禮禘嘗之義治國其如示諸掌乎郊祭天社祭地不言后土者省文也禘天子宗廟之大祭追祭太祖之所自出於太廟而以太祖配之也嘗秋祭也四時皆祭舉其一耳禮必有義對舉之互文也示與視同視諸掌言易見也此與論語文意大同小異記有詳畧耳右第十九章哀公問政哀公魯君名蒋子曰文武之政布在方策其人存則其政舉其人亡則其政息方版也策簡也息猶滅也有是君有是臣則有是政矣人道敏政地道敏樹夫政也者蒲盧也夫音扶敏速也蒲盧沈括以為蒲葦是也以人立政猶以地種樹其成速矣而蒲葦又易生之物其成尤速也言人存政舉其易如此故為政在人取人以身脩身以道脩道以仁此承上文人道敏政而言也為政在人家語作為政在於得人語意尤備人謂賢臣身指君身道者天下之逹道仁者天地生物之心而人得以生者所謂元者善之長也言人君為政在於得人而取人之則又在脩身能仁其身則有君有臣而政無不舉矣仁者人也親親為大義者宜也尊賢為大親親之殺尊賢之等禮所生也殺去聲人指人身而言具此生理自然便有惻怛慈愛之意深體味之可見宜者分别事理各有所宜也禮則節文斯二者而已在下位不獲乎上民不可得而治矣鄭氏曰此句在下誤重在此故君子不可以不脩身思脩身不可以不事親思事親不可以不知人思知人不可以不知天為政在人取人以身故不可以不脩身脩身以道脩道以仁故思脩身不可以不事親欲盡親親之仁必由尊賢之義故又當知人親親之殺尊賢之等皆天理也故又當知天天下之達道五所以行之者三曰君臣也父子也夫婦也昆弟也朋友之交也五者天下之達道也知仁勇三者天下之達徳也所以行之者一也知去聲達道者天下古今所共由之路即書所謂五典孟子所謂父子有親君臣有義夫婦有别長㓜有序朋友有信是也知所以知此也仁所以體此也勇所以强此也謂之逹徳者天下古今所同得之理也一則誠而已矣達道雖人所共由然無是三德則無以行之達德雖人所同得然一有不誠則人欲閒之而徳非其徳矣程子曰所謂誠者止是誠實此三者三者之外更别無誠或生而知之或學而知之或困而知之及其知之一也或安而行之或利而行之或勉强而行之及其成功一也强上聲知之者之所知行之者之所行謂達道也以其分而言則所以知者知也所以行者仁也所以至於知之成功而一者勇也以其等而言則生知安行者知也學知利行者仁也困知勉行者勇也盖人性雖無不善而氣禀有不同者故聞道有蚤莫行道有難易然能自强不息則其至一也吕氏曰所入之塗雖異而所至之域則同此所以為中庸若乃企生知安行之資為不可㡬及輕困知勉行謂不能有成此道之所以不明不行也子曰好學近乎知力行近乎仁知恥近乎勇子曰二字衍文好近乎知之知並去聲此言未及乎達徳而求以入徳之事通上文三知為知三行為仁則此三近者勇之次也吕氏曰愚者自是而不求自私者徇人欲而忘返懦者甘為人下而不辭故好學非知然足以破愚力行非仁然足以忘私知恥非勇然足以起懦知斯三者則知所以脩身知所以脩身則知所以治人知所以治人則知所以治天下國家矣斯三者指三近而言人者對巳之稱天下國家則盡乎人矣言此以結上文脩身之意起下文九經之端也凡為天下國家有九經曰脩身也尊賢也親親也敬大臣也體羣臣也子庶民也來百工也柔逺人也懐諸侯也經常也體謂設以身處其地而察其心也子如父母之愛其子也柔逺人所謂無忘賓旅者也此列九經之目也吕氏曰天下國家之本在身故脩身為九經之本然必親師取友然後脩身之道進故尊賢次之道之所進莫先其家故親親次之由家以及朝廷故敬大臣體羣臣次之由朝廷以及其國故子庶民來百工次之由其國以及天下故柔逺人懐諸侯次之此九經之序也視羣臣猶吾四體視百姓猶吾子此視臣視民之别也脩身則道立尊賢則不惑親親則諸父昆弟不怨敬大臣則不眩體羣臣則士之報禮重子庻民則百姓勸來百工則財用足柔逺人則四方歸之懐諸侯則天下畏之此言九經之效也道立謂道成於已而可為民表所謂皇建其有極是也不惑謂不疑於理不眩謂不迷於事敬大臣則信任専而小臣不得以閒之故臨事而不眩也來百工則通功易事農末相資故財用足柔逺人則天下之旅皆悦而願出於其塗故四方歸懐諸侯則徳之所施者博而威之所制者廣矣故曰天下畏之齊明盛服非禮不動所以脩身也去讒逺色賤貨而貴徳所以勸賢也尊其位重其祿同其好惡所以勸親親也官盛任使所以勸大臣也忠信重祿所以勸士也時使薄斂所以勸百姓也日省月試既禀稱事所以勸百工也送徃迎來嘉善而矜不能所以柔逺人也繼絶世舉廢國治亂持危朝聘以時厚徃而薄來所以懐諸侯也齊側皆反去上聲逺好惡斂並去聲既許氣反禀彼錦力錦二反稱去聲朝音潮此言九經之事也官盛任使謂官屬衆盛足任使令也盖大臣不當親細事故所以優之者如此忠信重祿謂待之誠而養之厚盖以身體之而知其所賴乎上者如此也旣讀曰餼餼禀稍食也稱事如周禮槀人職曰考其弓弩以上下其食是也徃則為之授節以送之來則豐其委積以迎之朝謂諸侯見於天子聘謂諸侯使大夫來獻王制比年一小聘三年一大聘五年一朝厚徃薄來謂燕賜厚而納貢薄凡為天下國家有九經所以行之者一也一者誠也一有不誠則是九者皆為虛文矣此九經之實也凡事豫則立不豫則廢言前定則不跲事前定則不困行前定則不疚道前定則不窮跲其劫反行去聲凡事指達道達徳九經之屬豫素定也跲躓也疚病也此承上文言凡事皆欲先立乎誠如下文所推是也在下位不獲乎上民不可得而治矣獲乎上有道不信乎朋友不獲乎上矣信乎朋友有道不順乎親不信乎朋友矣順乎親有道反諸身不誠不順乎親矣誠身有道不明乎善不誠乎身矣此又以在下位者推言素定之意反諸身不誠謂反求諸身而所存所𤼵未能眞實而無妄也不明乎善謂未能察於人心天命之本然而眞知至善之所在也誠者天之道也誠之者人之道也誠者不勉而中不思而得從容中道聖人也誠之者擇善而固執之者也中並去聲從七容反此承上文誠身而言誠者眞實無妄之謂天理之本然也誠之者未能眞實無妄而欲其眞實無妄之謂人事之當然也聖人之德渾然天理眞實無妄不待思勉而從容中道則亦天之道也未至於聖則不能無人欲之私而其為德不能皆實故未能不思而得則必擇善然後可以明善未能不勉而中則必固執然後可以誠身此則所謂人之道也不思而得生知也不勉而中安行也擇善學知以下之事固執利行以下之事也博學之審問之慎思之明辨之篤行之此誠之之目也學問思辨所以擇善而為知學而知也篤行所以固執而為仁利而行也程子曰五者廢其一非學也有弗學學之弗能弗措也有弗問問之弗知弗措也有弗思思之弗得弗措也有弗辨辨之弗明弗措也有弗行行之弗篤弗措也人一能之已百之人十能之已千之君子之學不為則已為則必要其成故常百倍其功此困而知勉而行者也勇之事也果能此道矣雖愚必明雖柔必强明者擇善之功强者固執之效吕氏曰君子所以學者為能變化氣質而已德勝氣質則愚者可進於明柔者可進於强不能勝之則雖有志於學亦愚不能明柔不能立而已矣盖均善而無惡者性也人所同也昏明强弱之稟不齊者才也人所異也誠之者所以反其同而變其異也夫以不美之質求變而美非百倍其功不足以致之今以鹵莽滅裂之學或作或輟以變其不美之質及不能變則曰天質不美非學所能變是果於自棄其為不仁甚矣右第二十章此引孔子之言以繼大舜文武周公之緒明其所傳之一致舉而措之亦猶是耳盖包費隠兼小大以終十二章之意章内語誠始詳而所謂誠者實此篇之樞紐也又按孔子家語亦載此章而其文尤詳成功一也之下有公曰子之言美矣至矣寡人實固不足以成之也故其下復以子曰起答辭今無此問辭而猶有子曰二字盖子思刪其繁文以附于篇而所刪有不盡者今當為衍文也博學之以下家語無之意彼有闕文抑此或子思所補也歟自誠明謂之性自明誠謂之教誠則明矣明則誠矣自由也德無不實而明無不照者聖人之徳所性而有者也天道也先明乎善而後能實其善者賢人之學由教而入者也人道也誠則無不明矣明則可以至於誠矣右第二十一章子思承上章夫子天道人道之意而立言也自此以下十二章皆子思之言以反覆推明此章之意唯天下至誠為能盡其性能盡其性則能盡人之性能盡人之性則能盡物之性能盡物之性則可以贊天地之化育可以贊天地之化育則可以與天地參矣天下至誠謂聖人之德之實天下莫能加也盡其性者徳無不實故無人欲之私而天命之在我者察之由之巨細精粗無毫髪之不盡也人物之性亦我之性但以所賦形氣不同而有異耳能盡之者謂知之無不明而處之無不當也贊猶助也與天地參謂與天地並立為三也此自誠而明者之事也右第二十二章言天道也其次致曲曲能有誠誠則形形則著著則明明則動動則變變則化唯天下至誠為能化其次通大賢以下凡誠有未至者而言也致推致也曲一偏也形者積中而𤼵外著則又加顯矣明則又有光輝𤼵越之盛也動者誠能動物變者物從而變化則有不知其所以然者盖人之性無不同而氣則有異故惟聖人能舉其性之全體而盡之其次則必自其善端𤼵見之偏而悉推致之以各造其極也曲無不致則徳無不實而形著動變之功自不能已積而至於能化則其至誠之妙亦不異於聖人矣右第二十三章言人道也至誠之道可以前知國家將興必有禎祥國家将亡必有妖孽見乎蓍龜動乎四體禍福将至善必先知之不善必先知之故至誠如神見音現禎祥者福之兆妖孽者禍之萌蓍所以筮龜所以卜四體謂動作威儀之閒如執玉高卑其容俯仰之類凡此皆理之先見者也然唯誠之至極而無一毫私偽畱於心目之閒者乃能有以察其㡬焉神謂鬼神右第二十四章言天道也誠者自成也而道自道也道也之道音導言誠者物之所以自成而道者人之所當自行也誠以心言本也道以理言用也誠者物之終始不誠無物是故君子誠之為貴天下之物皆實理之所為故必得是理然後有是物所得之理既盡則是物亦盡而無有矣故人之心一有不實則雖有所為亦如無有而君子必以誠為貴也盖人之心能無不實乃為有以自成而道之在我者亦無不行矣誠者非自成已而已也所以成物也成已仁也成物知也性之徳也合外内之道也故時措之宜也知去聲誠雖所以成已然既有以自成則自然及物而道亦行於彼矣仁者體之存知者用之𤼵是皆吾性之固有而無内外之殊既得於已則見於事者以時措之而皆得其宜也右第二十五章言人道也故至誠無息既無虚假自無閒斷不息則乆乆則徵乆常於中也徵驗於外也徵則悠逺悠逺則博厚博厚則高明此皆以其驗於外者言之鄭氏所謂至誠之徳著於四方者是也存諸中者既乆則驗於外者益悠逺而無窮矣悠逺故其積也廣博而深厚博厚故其𤼵也高大而光明博厚所以載物也高明所以覆物也悠乆所以成物也悠乆即悠逺兼内外而言之也本以悠逺致高厚而高厚又悠乆也此言聖人與天地同用愽厚配地高明配天悠乆無疆此言聖人與天地同體如此者不見而章不動而變無為而成見音現見猶示也不見而章以配地而言也不動而變以配天而言也無為而成以無疆而言也天地之道可一言而盡也其為物不貳則其生物不測此以下復以天地明至誠無息之功用天地之道可一言而盡不過曰誠而已不貳所以誠也誠故不息而生物之多有莫知其所以然者天地之道博也厚也高也明也悠也乆也言天地之道誠一不貳故能各極其盛而有下文生物之功今夫天斯昭昭之多及其無窮也日月星辰繫焉萬物覆焉今夫地一撮土之多及其廣厚載華嶽而不重振河海而不洩萬物載焉今夫山一卷石之多及其廣大草木生之禽獸居之寳藏興焉今夫水一勺之多及其不測黿鼉蛟龍魚鼈生焉貨財殖焉夫音扶華藏並去聲卷平聲勺市若反昭昭猶耿耿小明也此指其一處而言之及其無窮猶十二章及其至也之意盖舉全體而言也振收也卷區也此四條皆以𤼵明由其不貳不息以致盛大而能生物之意然天地山川實非由積累而後大讀者不以辭害意可也詩云維天之命於穆不已盖曰天之所以為天也於乎不顯文王之徳之純盖曰文王之所以為文也純亦不已於音烏乎音呼詩周頌維天之命篇於歎辭穆深逺也不顯猶言豈不顯也純純一不雜也引此以明至誠無息之意程子曰天道不已文王純於天道亦不已純則無二無雜不已則無閒斷先後右第二十六章言天道也大哉聖人之道包下文兩節而言洋洋乎𤼵育萬物峻極于天峻高大也此言道之極於至大而無外也優優大哉禮儀三百威儀三千優優充足有餘之意禮儀經禮也威儀曲禮也此言道之入於至小而無閒也待其人而後行總結上兩節故曰苟不至徳至道不凝焉至徳謂其人至道指上兩節而言也凝聚也成也故君子尊德性而道問學致廣大而盡精㣲極高明而道中庸温故而知新敦厚以崇禮尊者恭敬奉持之意徳性者吾所受於天之正理道由也温猶燖温之温謂故學之矣復時習之也敦加厚也尊徳性所以存心而極乎道體之大也道問學所以致知而盡乎道體之細也二者脩徳凝道之大端也不以一毫私意自蔽不以一毫私欲自累涵泳乎其所已知敦篤乎其所已能此皆存心之屬也析理則不使有毫釐之差處事則不使有過不及之謬理義則日知其所未知節文則日謹其所未謹此皆致知之屬也盖非存心無以致知而存心者又不可以不致知故此五句大小相資首尾相應聖賢所示入徳之方莫詳於此學者宜盡心焉是故居上不驕為下不倍國有道其言足以興國無道其黙足以容詩曰既明且哲以保其身其此之謂與倍與背同與平聲興謂興起在位也詩大雅烝民之篇右第二十七章言人道也子曰愚而好自用賤而好自専生乎今之世反古之道如此者烖及其身者也好去聲烖古灾字以上孔子之言子思引之反復也非天子不議禮不制度不考文此以下子思之言禮親疏貴賤相接之體也度品制文書名今天下車同軌書同文行同倫行去聲今子思自謂當時也軌轍迹之度倫次序之體三者皆同言天下一統也雖有其位苟無其徳不敢作禮樂焉雖有其徳苟無其位亦不敢作禮樂焉鄭氏曰言作禮樂者必聖人在天子之位子曰吾説夏禮把不足徵也吾學殷禮有宋存焉吾學周禮今用之吾從周此又引孔子之言把夏之後徴證也宋殷之後三代之禮孔子皆嘗學之而能言其意但夏禮既不可考證殷禮雖存又非當世之法惟周禮乃時王之制今日所用孔子既不得位則從周而已右第二十八章承上章為下不倍而言亦人道也王天下有三重焉其寡過矣乎王去聲吕氏曰三重謂議禮制度考文惟天子得以行之則國不異政家不殊俗而人得寡過矣上焉者雖善無徵無徵不信不信民弗從下焉者雖善不尊不尊不信不信民弗從上焉者謂時王以前如夏商之禮雖善而皆不可考下焉者謂聖人在下如孔子雖善於禮而不在尊位也故君子之道本諸身徵諸庶民考諸三王而不謬建諸天地而不悖質諸鬼神而無疑百世以俟聖人而不惑此君子指王天下者而言其道即議禮制度考文之事也本諸身有其徳也徵諸庶民驗其所信從也建立也立於此而參於彼也天地者道也鬼神者造化之迹也百世以俟聖人而不惑所謂聖人復起不易吾言者也質諸鬼神而無疑知天也百世以俟聖人而不惑知人也知天知人知其理也是故君子動而世為天下道行而世為天下法言而世為天下則逺之則有望近之則不厭動兼言行而言道兼法則而言法法度也則準則也詩曰在彼無惡在此無射庶㡬夙夜以永終譽君子未有不如此而蚤有譽於天下者也惡去聲射音妒詩作斁詩周頌振鷺之篇射厭也所謂此者指本諸身以下六事而言右第二十九章承上章居上不驕而言亦人道也仲尼祖述堯舜憲章文武上律天時下襲水土祖述者逺宗其道憲章者近守其法律天時者法其自然之運襲水土者因其一定之理皆兼内外該本末而言也辟如天地之無不持載無不覆幬辟如四時之錯行如日月之代明辟音譬幬徒報反錯猶迭也此言聖人之徳萬物並育而不相害道並行而不相悖小徳川流大徳敦化此天地之所以為大也悖猶背也天覆地載萬物並育於其閒而不相害四時日月錯行代明而不相悖所以不害不悖者小德之川流所以並育並行者大徳之敦化小徳者全體之分大徳者萬殊之本川流者如川之流脉絡分明而徃不息也敦化者敦厚其化根本盛大而出無窮也此言天地之道以見上文取辟之意也右第三十章言天道也唯天下至聖為能聰明睿知足以有臨也寛裕温柔足以有容也𤼵强剛毅足以有執也齊莊中正足以有敬也文理密察足以有别也知去聲齊側皆反别彼列反聰明睿知生知之質臨謂居上而臨下也其下四者乃仁義禮知之徳文文章也理條理也密詳細也察明辨也溥博淵泉而時出之溥博周徧而廣闊也淵泉静深而有本也出𤼵見也言五者之徳充積於中而以時𤼵見於外也溥博如天淵泉如淵見而民莫不敬言而民莫不信行而民莫不説見音現説音悦言其充積極其盛而𤼵見當其可也是以聲名洋溢乎中國施及蠻貊舟車所至人力所通天之所覆地之所載日月所照霜露所隊凡有血氣者莫不尊親故曰配天施去聲隊音墜舟車所至以下蓋極言之配天言其徳之所及廣大如天也右第三十一章承上章而言小徳之川流亦天道也唯天下至誠為能經綸天下之大經立天下之大本知天地之化育夫焉有所倚夫音扶焉於䖍反經綸皆治絲之事經者理其緒而分之綸者比其類而合之也經常也大經者五品之人倫大本者所性之全體也惟聖人之徳極誠無妄故於人倫各盡其當然之實而皆可以為天下後世法所謂經綸之也其於所性之全體無一毫人欲之偽以雜之而天下之道千變萬化皆由此出所謂立之也其於天地之化育則亦其極誠無妄者有默契焉非但聞見之知而已此皆至誠無妄自然之功用夫豈有所倚著於物而後能哉肫肫其仁淵淵其淵浩浩其天肫之純反肫肫懇至貌以經綸而言也淵淵静深貌以立本而言也浩浩廣大貌以知化而言也其淵其天别非特如之而已苟不固聰明聖知達天徳者其孰能知之聖知之知去聲固猶實也鄭氏曰唯聖人能知聖人也右第三十二章承上章而言大徳之敦化亦天道也前章言至聖之徳此章言至誠之道然至誠之道非至聖不能知至聖之徳非至誠不能為則亦非二物矣此篇言聖人天道之極致至此而無以加矣詩曰衣錦尚絅惡其文之著也故君子之道闇然而日章小人之道的然而日亡君子之道淡而不厭簡而文温而理知逺之近知風之自知微之顯可與入徳矣衣去聲絅口逈反惡去聲闇於感反前章言聖人之徳極其盛矣此復自下學立心之始言之而下文又推之以至其極也詩國風衛碩人鄭之丰皆作衣錦褧衣褧絅同禪衣也尚加也古之學者為己故其立心如此尚絅故闇然衣錦故有日章之實淡簡温絅之襲於外也不厭而文且理焉錦之美在中也小人反是則暴於外而無實以繼之是以的然而日亡也逺之近見於彼者由於此也風之自著乎外者本乎内也㣲之顯有諸内者形諸外也有為己之心而又知此三者則知所謹而可入徳矣故下文引詩言謹獨之事詩云潛雖伏矣亦孔之昭故君子内省不疚無惡於志君子之所不可及者其唯人之所不見乎惡去聲詩小雅正月之篇承上文言莫見乎隠莫顯乎㣲也疚病也無惡於志猶言無愧於心此君子謹獨之事也詩云相在爾室尚不愧于屋漏故君子不動而敬不言而信相去聲詩大雅抑之篇相視也屋漏室西北隅也承上文又言君子之戒謹恐懼無時不然不待言動而後敬信則其為己之功益加密矣故下文引詩并言其效詩曰奏假無言時靡有爭是故君子不賞而民勸不怒而民威於鈇鉞假格同鈇音夫詩商頌烈祖之篇奏進也承上文而遂及其效言進而感格於神明之際極其誠敬無有言説而人自化之也威畏也鈇莝斫刀也鉞斧也詩曰不顯惟徳百辟其刑之是故君子篤恭而天下平詩周頌烈文之篇不顯説見二十六章此借引以為幽深𤣥逺之意承上文言天子有不顯之徳而諸侯法之則其徳愈深而效愈逺矣篤厚也篤恭言不顯其敬也篤恭而天下平乃聖人至徳淵微自然之應中庸之極功也詩云予懐明徳不大聲以色子曰聲色之於以化民末也詩曰德輶如毛毛猶有倫上天之載無聲無臭至矣輶由酉二音詩大雅皇矣之篇引之以明上文所謂不顯之徳者正以其不大聲與色也又引孔子之言以為聲色乃化民之末務今但言不大之而已則猶有聲色者存是未足以形容不顯之妙不若烝民之詩所言徳輶如毛則庶乎可以形容矣而又自以為謂之毛則猶有可比者是亦未盡其妙不若文王之詩所言上天之載無聲無臭然後乃為不顯之至耳盖聲臭有氣無形在物最為㣲妙而猶曰無之故唯此可以形容不顯篤恭之妙非此德之外又别有是三等然後為至也右第三十三章子思因前章極致之言反求其本復自下學為己謹獨之事推而言之以馴致乎篤恭而天下平之盛又贊其妙至於無聲無臭而後已焉蓋舉一篇之要而約言之其反復丁寧示人之意至深切矣學者其可不盡心乎中庸
